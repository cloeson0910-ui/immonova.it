<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  color:#7f6430;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.30;
}
.header{
  padding:34px 52px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(166,127,52,.10);
  background:rgba(244,236,223,.62);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  font-size:24px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a67f34;
  text-decoration:none;
}
.nav{
  display:flex;
  gap:30px;
  align-items:center;
  flex-wrap:wrap;
}
.nav a{
  text-decoration:none;
  color:#a67f34;
  font-size:11px;
  letter-spacing:.24em;
  text-transform:uppercase;
  padding:0;
  border:none;
  background:transparent;
  position:relative;
}
.nav a::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-8px;
  height:1px;
  background:#a67f34;
  transform:scaleX(0);
  transform-origin:center;
  transition:transform .28s ease;
}
.nav a:hover::after{
  transform:scaleX(1);
}
.nav a:hover{
  background:transparent;
  color:#7f6430;
}
.nav-dropdown{position:relative}
.nav-dropdown summary{list-style:none;cursor:pointer;color:#a67f34;font-size:11px;letter-spacing:.24em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;user-select:none}
.nav-dropdown summary::-webkit-details-marker{display:none}
.nav-dropdown summary::after{content:"▾";font-size:8px;transition:transform .2s ease}
.nav-dropdown[open] summary::after{transform:rotate(180deg)}
.nav-dropdown-menu{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);background:#fffaf0;border:1px solid rgba(166,127,52,.22);box-shadow:0 20px 50px rgba(127,100,48,.16);padding:8px 0;min-width:210px;z-index:30}
.nav-dropdown-menu a{display:block;padding:11px 22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a67f34;text-decoration:none;white-space:nowrap}
.nav-dropdown-menu a:hover{background:rgba(166,127,52,.08);color:#7f6430}
.container{
  max-width:980px;
  margin:0 auto;
  padding:56px 42px 100px;
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#9a793c;
  text-decoration:none;
  margin-bottom:36px;
}
.back-link:hover{color:#7f6430}
.status{min-height:20px;margin-bottom:20px;font-size:13px}.error{color:#9c2f2f}
.profile-card{
  border:1px solid rgba(166,127,52,.16);
  background:rgba(255,255,255,.3);
  box-shadow:0 24px 70px rgba(127,100,48,.08);
  overflow:hidden;
  display:grid;
  grid-template-columns:340px 1fr;
}
.profile-photo{
  background:rgba(166,127,52,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  min-height:420px;
}
.profile-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.profile-photo .initials{font-size:72px;font-weight:200;color:#a67f34;letter-spacing:.1em}
.profile-body{padding:46px 44px}
.profile-category{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#9a793c;margin-bottom:12px}
.profile-name{font-size:clamp(28px,3vw,38px);font-weight:300;color:#7f6430;letter-spacing:.03em;margin-bottom:28px}
.profile-block{margin-bottom:26px}
.profile-block:last-child{margin-bottom:0}
.profile-block-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a58139;margin-bottom:10px}
.profile-block-text{font-size:15px;line-height:1.85;color:#735f36;white-space:pre-line}
.profile-contacts{display:flex;flex-direction:column;gap:8px;font-size:15px;color:#735f36}
.profile-contacts a{color:#a67f34;text-decoration:none}
.profile-contacts a:hover{text-decoration:underline}
.empty{
  padding:54px;
  text-align:center;
  color:#8f7643;
  border:1px solid rgba(166,127,52,.16);
  background:rgba(255,255,255,.18);
  line-height:1.8;
}

@media(max-width:760px){
  .header{padding:28px 24px;flex-direction:column;gap:18px}
  .nav{justify-content:center}
  .container{padding:40px 22px 78px}
  .profile-card{grid-template-columns:1fr}
  .profile-photo{min-height:280px}
  .profile-body{padding:34px 26px}
}

/* ---- Mobile hamburger menu (IMMONOVA standard) ---- */
.nav-toggle{display:none;background:none;border:1px solid rgba(166,127,52,.35);color:#a67f34;font-size:22px;line-height:1;padding:8px 13px;cursor:pointer;font-family:inherit;flex-shrink:0}
@media(max-width:900px){
  .header{position:relative;flex-wrap:nowrap}
  .nav-toggle{display:block}
  .nav{
    display:none;
    position:absolute;
    top:100%;left:0;right:0;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    background:rgba(244,236,223,.98);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(166,127,52,.18);
    box-shadow:0 24px 50px rgba(127,100,48,.14);
    padding:8px 24px 22px;
    max-height:80vh;
    overflow-y:auto;
    z-index:25;
  }
  .nav.open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid rgba(166,127,52,.10);width:100%}
  .nav-dropdown summary{padding:14px 0;border-bottom:1px solid rgba(166,127,52,.10);width:100%}
  .nav-dropdown-menu{position:static;transform:none;box-shadow:none;border:none;background:transparent;padding:0 0 0 18px;min-width:0}
  .nav-dropdown-menu a{padding:12px 0;border-bottom:1px solid rgba(166,127,52,.08)}
}
</style>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const profileContainer = document.getElementById("profileContainer");
const statusBox = document.getElementById("status");

const params = new URLSearchParams(window.location.search);
const memberId = params.get("id");

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setStatus(message,type){
  statusBox.className = "status " + (type || "");
  statusBox.textContent = message || "";
}

function initials(member){
  const n = (member.nome || "").trim()[0] || "";
  const c = (member.cognome || "").trim()[0] || "";
  return (n + c).toUpperCase() || "IM";
}

function memberPhoto(member){
  if(member.foto_url){
    return '<img src="'+esc(member.foto_url)+'" alt="'+esc(member.nome+" "+member.cognome)+'">';
  }
  return '<span class="initials">'+esc(initials(member))+'</span>';
}

function render(member, categoryName){
  const fullName = (member.nome + " " + member.cognome).trim();

  document.getElementById("pageTitle").textContent = fullName + " | IMMONOVA Team";
  document.getElementById("metaDescription").setAttribute(
    "content",
    "Il profilo di " + fullName + (categoryName ? " (" + categoryName + ")" : "") + " nel network IMMONOVA."
  );

  const contacts = [];
  if(member.email) contacts.push('<a href="mailto:'+esc(member.email)+'">'+esc(member.email)+'</a>');
  if(member.telefono) contacts.push('<a href="tel:'+esc(member.telefono)+'">'+esc(member.telefono)+'</a>');

  profileContainer.innerHTML =
    '<div class="profile-card">'
    + '<div class="profile-photo">'+memberPhoto(member)+'</div>'
    + '<div class="profile-body">'
    + (categoryName ? '<div class="profile-category">'+esc(categoryName)+'</div>' : "")
    + '<h1 class="profile-name">'+esc(fullName)+'</h1>'
    + (member.bio ? '<div class="profile-block"><div class="profile-block-label">Bio</div><div class="profile-block-text">'+esc(member.bio)+'</div></div>' : "")
    + (member.esperienza ? '<div class="profile-block"><div class="profile-block-label">Esperienza</div><div class="profile-block-text">'+esc(member.esperienza)+'</div></div>' : "")
    + (contacts.length ? '<div class="profile-block"><div class="profile-block-label">Contatti</div><div class="profile-contacts">'+contacts.join("")+'</div></div>' : "")
    + '</div></div>';
}

async function loadProfile(){
  if(!memberId){
    profileContainer.innerHTML = '<div class="empty">Profilo non specificato.</div>';
    return;
  }

  try{
    const memberResult = await client
      .from("team_members")
      .select("*")
      .eq("id", memberId)
      .eq("published", true)
      .single();

    if(memberResult.error) throw memberResult.error;

    const member = memberResult.data;
    if(!member){
      profileContainer.innerHTML = '<div class="empty">Profilo non trovato.</div>';
      return;
    }

    let categoryName = "";
    if(member.category_id){
      const catResult = await client
        .from("team_categories")
        .select("name")
        .eq("id", member.category_id)
        .single();
      if(!catResult.error && catResult.data) categoryName = catResult.data.name || "";
    }

    render(member, categoryName);
  }catch(error){
    console.error(error);
    setStatus("Errore caricamento profilo: " + (error.message || error), "error");
    profileContainer.innerHTML = '<div class="empty">Profilo temporaneamente non disponibile.</div>';
  }
}

loadProfile();
</script>
<script>
(function(){
  var toggle = document.getElementById("navToggle");
  var nav = document.querySelector("header.header .nav");
  if(toggle && nav){
    toggle.addEventListener("click", function(){
      var isOpen = nav.classList.toggle("open");
      toggle.innerHTML = isOpen ? "&times;" : "&#9776;";
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    nav.querySelectorAll("a").forEach(function(a){
      a.addEventListener("click", function(){
        nav.classList.remove("open");
        toggle.innerHTML = "&#9776;";
        toggle.setAttribute("aria-expanded", "false");
      });
    });
  }
  document.addEventListener("click", function(e){
    document.querySelectorAll(".nav-dropdown[open]").forEach(function(d){
      if(!d.contains(e.target)) d.removeAttribute("open");
    });
  });
})();
</script>
</body>
