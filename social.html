<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IMMONOVA Circle</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
<meta name="theme-color" content="#211810" />
<style>
:root{--bg:#f4ecdf;--card:#fffdf7;--ink:#2b2416;--muted:#7d6f55;--gold:#a67f34;--gold2:#c9a65a;--line:#e6d9bf;--dark:#211810;--red:#b3452f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;background:
 repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
 repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px);background-size:230px 199px}
a{color:inherit}
button,input,textarea,select{font-family:inherit;font-size:15px}
.hdr{position:sticky;top:0;z-index:30;background:rgba(33,24,16,.96);color:#efe4cc;backdrop-filter:blur(10px)}
.hdr .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-weight:300;letter-spacing:.38em;font-size:17px;color:#e2c47a}
.brand span{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#a8946c}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:#cbbd9c;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;letter-spacing:.06em;position:relative}
.tabs button.on{background:rgba(201,166,90,.18);color:#f3e6c4}
.tabs .dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 90px;display:grid;grid-template-columns:260px 1fr;gap:22px}
.side .card{position:sticky;top:84px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 20px rgba(43,36,22,.05)}
.me{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:#e9dcc0;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 auto;overflow:hidden;background-size:cover;background-position:center;border:1px solid var(--line)}
.av.lg{width:84px;height:84px;font-size:28px}
.nm{font-weight:600}.sub{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#f3e8cf;color:#7a5d22;margin-left:6px;vertical-align:middle}
.badge.team{background:var(--dark);color:#e2c47a}
.btn{background:var(--gold);color:#fffaf0;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(166,127,52,.45)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{min-width:0}
.composer textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.post{margin-top:16px}
.post .body{margin:12px 0;white-space:pre-wrap;word-break:break-word}
.gal{display:grid;gap:6px;margin:10px 0;border-radius:10px;overflow:hidden}
.gal.n1{grid-template-columns:1fr}.gal.n2{grid-template-columns:1fr 1fr}.gal.n3,.gal.n4{grid-template-columns:1fr 1fr}
.gal img{width:100%;height:100%;max-height:420px;object-fit:cover;display:block;cursor:zoom-in;background:#eee6d4}
.gal.n1 img{max-height:520px}
.acts{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px;flex-wrap:wrap}
.acts button{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.acts button:hover{background:#f6eedc}
.acts button.liked{color:var(--red)}
.cmts{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.cmt{display:flex;gap:8px;margin:8px 0}
.cmt .av{width:30px;height:30px;font-size:12px}
.cmt .bub{background:#f7f0e1;border-radius:12px;padding:7px 11px;font-size:14px;flex:1;min-width:0;word-break:break-word}
.cmtin{display:flex;gap:8px;margin-top:6px}
.cmtin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff}
.opp{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin:10px 0;text-decoration:none}
.opp img{width:140px;height:110px;object-fit:cover;flex:0 0 auto;background:#eee6d4}
.opp .t{padding:10px 12px 10px 0}
.opp .t b{display:block;font-family:Georgia,serif;font-weight:400;font-size:17px}
.hiddenpost{border:1px dashed var(--red)}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{text-align:center}
.mcard .av{margin:0 auto 8px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin:4px 0 12px}
label.l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chat{display:grid;grid-template-columns:260px 1fr;gap:14px;min-height:60vh}
.thr{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}
.thr:hover,.thr.on{background:#f6eedc}
.msgs{display:flex;flex-direction:column;gap:6px;height:52vh;overflow:auto;padding:6px}
.msg{max-width:76%;padding:8px 12px;border-radius:14px;background:#f3e8cf;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--dark);color:#f3e6c4}
.msg .tm{font-size:11px;opacity:.6;margin-top:2px}
.hero{max-width:560px;margin:60px auto;text-align:center}
.hero h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:10px 0}
.hero p{color:var(--muted);margin:10px 0 22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#f3e6c4;padding:12px 18px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;background:rgba(20,14,8,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:92vh}
.notice{background:#fff7e0;border:1px solid #ecd9a8;border-radius:12px;padding:12px 14px;font-size:13.5px}
.mobnav{display:none}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;padding-bottom:86px}
  .side{display:none}
  .tabs{display:none}
  .chat{grid-template-columns:1fr}
  .chat.open .thrs{display:none}
  .chat:not(.open) .conv{display:none}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(33,24,16,.97);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .mobnav button{background:none;border:0;color:#cbbd9c;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding:4px 10px}
  .mobnav button i{font-style:normal;font-size:20px}
  .mobnav button.on{color:#f3e6c4}
  .mobnav .dot{position:absolute;top:0;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
  .opp img{width:100px;height:90px}
  #inb{bottom:calc(78px + env(safe-area-inset-bottom)) !important}
  .composer .row > .av{display:none}
}
</style>
</head>
<body>
<header class="hdr"><div class="in">
  <a class="brand" href="social.html"><b>IMMONOVA</b><span>Circle</span></a>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<div id="app"><div class="hero"><p>Caricamento…</p></div></div>
<nav class="mobnav" id="mobnav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
(function(){
"use strict";
const sb = window.supabaseClient;
const OWNER_EMAIL = "claudio.romano@bluewin.ch";
const TYPES = { investitore:"Investitore", family_office:"Family office", partner:"Agenzia partner", segnalatore:"Segnalatore", professionista:"Professionista", team:"IMMONOVA" };
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const ago = iso => { const d = (Date.now() - new Date(iso)) / 1000; if(d < 60) return "adesso"; if(d < 3600) return Math.floor(d / 60) + " min"; if(d < 86400) return Math.floor(d / 3600) + " h";
  if(d < 7 * 86400) return Math.floor(d / 86400) + " g"; return new Date(iso).toLocaleDateString("it-IT", { day:"numeric", month:"short" }); };
const initials = n => String(n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
const params = new URLSearchParams(location.search);
/* il codice di invito viene ricordato su questo dispositivo: se la persona crea l'account, accede
   o torna più tardi (anche senza il link), il Circle le chiede solo di completare l'ingresso */
let invite = (params.get("invito") || "").trim().toUpperCase();
try{ if(invite) localStorage.setItem("immonova_circle_invite", invite); else invite = localStorage.getItem("immonova_circle_invite") || ""; }catch(e){}

let me = null, meMember = null, isOwner = false, members = {}, avatarUrls = {}, tab = "feed";
let posts = [], postOffset = 0, PAGE = 20, unreadMsgs = 0, chatWith = null, msgChannel = null;

/* ---------- avatar e foto (archivio privato: link temporanei) ---------- */
async function signed(paths){
  const need = paths.filter(p => p && !avatarUrls[p]);
  if(need.length){ const r = await sb.storage.from("social-feed").createSignedUrls(need, 3600);
    (r.data || []).forEach((x, i) => { if(x.signedUrl) avatarUrls[need[i]] = x.signedUrl; }); }
  return paths.map(p => avatarUrls[p] || "");
}
function av(uid, cls){
  const m = members[uid] || {}; const url = m.avatar_path ? avatarUrls[m.avatar_path] : "";
  return '<div class="av ' + (cls || "") + '" style="' + (url ? "background-image:url('" + url + "');color:transparent" : "") + '">' + esc(initials(m.display_name)) + '</div>';
}
function badge(uid){ const m = members[uid] || {}; return '<span class="badge ' + (m.member_type === "team" ? "team" : "") + '">' + esc(TYPES[m.member_type] || "Membro") + '</span>'; }
function nameOf(uid){ return esc((members[uid] || {}).display_name || "Membro"); }

/* ---------- ingresso ---------- */
async function start(){
  const s = await sb.auth.getSession(); me = s.data.session && s.data.session.user;
  if(!me) return landing();
  isOwner = String(me.email || "").toLowerCase() === OWNER_EMAIL;
  try{ await sb.rpc("social_join_team"); }catch(e){}
  let r = await sb.from("social_members").select("*").eq("user_id", me.id).maybeSingle();
  meMember = r.data;
  if(meMember){ try{ localStorage.removeItem("immonova_circle_invite"); }catch(e){} }
  if(!meMember && invite) return joinForm();
  if(!meMember) return notMember();
  if(meMember.status !== "active") return page('<div class="hero"><h1>Accesso sospeso</h1><p>Il tuo accesso a IMMONOVA Circle è sospeso. Per informazioni scrivi a IMMONOVA.</p></div>');
  sb.from("social_members").update({ last_seen_at:new Date().toISOString() }).eq("user_id", me.id).then(() => {});
  await loadMembers();
  buildNav();
  const h = location.hash;
  if(h.startsWith("#chat-")) { chatWith = h.slice(6); go("msg"); }
  else if(h.startsWith("#u-")) go("members", h.slice(3));
  else if(h === "#moderazione" && isOwner) go("mod");
  else if(h === "#proposte" && isOwner) go("mod");
  else go("feed");
  refreshUnread(); setInterval(refreshUnread, 45000);
  sb.channel("circle-" + me.id).on("postgres_changes", { event:"INSERT", schema:"public", table:"social_messages", filter:"to_id=eq." + me.id }, p => {
    refreshUnread(); if(tab === "msg" && chatWith === p.new.from_id) openChat(chatWith, true); else toast("✉️ Nuovo messaggio da " + ((members[p.new.from_id] || {}).display_name || "un membro"));
  }).subscribe();
}
function page(h){ $("#app").innerHTML = h; }
async function landing(){
  let info = null;
  if(invite){ const r = await sb.rpc("social_invite_info", { p_code:invite }); info = r.data; }
  const back = encodeURIComponent("social.html" + (invite ? "?invito=" + invite : ""));
  page('<div class="hero"><div class="brand" style="justify-content:center"><b style="color:var(--gold)">IMMONOVA</b></div>' +
    '<h1>IMMONOVA Circle</h1>' +
    (info && info.ok ? '<p><b>' + esc(info.from) + '</b> ti ha invitato a entrare nel club riservato di IMMONOVA: investitori, family office, partner e professionisti del mercato immobiliare di pregio.</p>'
      : info ? '<p class="notice">' + esc(info.error) + '. Chiedi un nuovo invito a chi ti ha invitato.</p>'
      : '<p>Il club riservato di IMMONOVA: investitori, family office, partner e professionisti del real estate di pregio. Si entra solo su invito.</p>') +
    '<div class="row" style="justify-content:center"><a class="btn" href="signup.html?redirect=' + back + '">Crea il tuo account</a> <a class="btn ghost" href="signin.html?redirect=' + back + '">Accedi</a></div></div>');
}
function notMember(){
  page('<div class="hero card"><h1>IMMONOVA Circle</h1><p>Il club riservato di IMMONOVA è accessibile solo su invito. Se hai ricevuto un invito, incolla qui il link o il codice.</p>' +
    '<div class="row" style="justify-content:center"><input class="f" id="icode" placeholder="Link o codice di invito" style="flex:1 1 220px;margin:0;max-width:360px"><button class="btn" id="igo">Continua</button></div>' +
    '<p class="sub" id="ierr" style="margin-top:10px"></p><a class="btn ghost" href="index.html" style="margin-top:8px">Torna al sito</a></div>');
  $("#igo").onclick = () => {
    const c = $("#icode").value.trim().replace(/.*invito=/i, "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    if(c.length < 6){ $("#ierr").textContent = "Codice non valido."; return; }
    invite = c; try{ localStorage.setItem("immonova_circle_invite", c); }catch(e){} joinForm();
  };
}
function joinForm(){
  page('<div class="hero card" style="text-align:left"><h1 style="text-align:center">Benvenuto in IMMONOVA Circle</h1>' +
    '<div class="notice" style="margin:14px 0">🔒 <b>Riservatezza.</b> Tutto ciò che leggi nel Circle (post, profili, messaggi, opportunità) è riservato ai membri. Entrando ti impegni a non divulgarlo all\'esterno e a non contattare direttamente proprietari o controparti scavalcando IMMONOVA.</div>' +
    '<label class="l">Nome e cognome (come ti vedranno gli altri)</label><input class="f" id="jn" value="' + esc((me.user_metadata && me.user_metadata.full_name) || "") + '">' +
    '<label class="l">Chi sei</label><select class="f" id="jt">' + Object.keys(TYPES).filter(k => k !== "team").map(k => '<option value="' + k + '">' + TYPES[k] + '</option>').join("") + '</select>' +
    '<label class="row" style="font-size:14px;margin:4px 0 16px"><input type="checkbox" id="jok"> Accetto l\'impegno di riservatezza</label>' +
    '<button class="btn" id="jgo" style="width:100%">Entra nel Circle</button><p class="sub" id="jerr" style="margin-top:10px"></p></div>');
  $("#jgo").onclick = async () => {
    const n = $("#jn").value.trim(); if(n.length < 3){ $("#jerr").textContent = "Scrivi nome e cognome."; return; }
    if(!$("#jok").checked){ $("#jerr").textContent = "Devi accettare l'impegno di riservatezza."; return; }
    $("#jgo").disabled = true;
    const r = await sb.rpc("social_redeem_invite", { p_code:invite, p_name:n, p_type:$("#jt").value });
    if(r.error || !r.data || !r.data.ok){ const er = (r.data && r.data.error) || (r.error && r.error.message) || "Errore";
      $("#jerr").textContent = er; $("#jgo").disabled = false;
      if(/non valido|usato|scadut/i.test(er)){ try{ localStorage.removeItem("immonova_circle_invite"); }catch(e){} }
      return; }
    try{ localStorage.removeItem("immonova_circle_invite"); }catch(e){}
    history.replaceState(null, "", "social.html"); start();
  };
}

/* ---------- membri ---------- */
async function loadMembers(){
  const r = await sb.from("social_members").select("*").order("display_name");
  members = {}; (r.data || []).forEach(m => members[m.user_id] = m);
  await signed(Object.values(members).map(m => m.avatar_path).filter(Boolean));
}

/* ---------- navigazione ---------- */
const NAV = [["feed","🏠","Bacheca"],["news","📰","Notizie"],["members","👥","Membri"],["msg","✉️","Messaggi"],["profile","👤","Profilo"]];
function buildNav(){
  const items = NAV.concat(isOwner ? [["mod","🛡","Moderazione"]] : []);
  $("#tabs").innerHTML = items.map(n => '<button data-t="' + n[0] + '">' + n[2] + (n[0] === "msg" ? '<span class="dot" hidden></span>' : "") + '</button>').join("");
  $("#mobnav").innerHTML = items.map(n => '<button data-t="' + n[0] + '"><i>' + n[1] + '</i>' + n[2] + (n[0] === "msg" ? '<span class="dot" hidden></span>' : "") + '</button>').join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go(b.dataset.t));
}
function go(t, arg){
  tab = t; document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  window.scrollTo(0, 0);
  ({ feed:showFeed, news:showNews, members:showMembers, msg:showMessages, profile:showProfile, mod:showMod })[t](arg);
}
async function refreshUnread(){
  const r = await sb.from("social_messages").select("id", { count:"exact", head:true }).eq("to_id", me.id).is("read_at", null);
  unreadMsgs = r.count || 0;
  document.querySelectorAll('[data-t="msg"] .dot').forEach(d => { d.hidden = !unreadMsgs; d.textContent = unreadMsgs; });
}
function sideCard(){
  return '<aside class="side"><div class="card"><div class="me">' + av(me.id) + '<div><div class="nm">' + nameOf(me.id) + '</div><div class="sub">' + esc(meMember.headline || TYPES[meMember.member_type]) + '</div></div></div>' +
    '<div style="margin-top:14px" class="sub">Membri del Circle: <b>' + Object.keys(members).length + '</b></div>' +
    '<button class="btn ghost sm" style="margin-top:12px;width:100%" id="sideInv">✉️ Invita una persona</button>' +
    '<button class="btn ghost sm" style="margin-top:8px;width:100%" id="sideProp">🏛 Proponi un immobile a IMMONOVA</button>' +
    '<p class="sub" style="margin-top:14px;font-size:12px">🔒 Contenuti riservati ai membri. Non divulgare all\'esterno.</p></div></aside>';
}
function bindSide(){ const a = $("#sideInv"); if(a) a.onclick = () => go("profile", "inviti"); const b = $("#sideProp"); if(b) b.onclick = proposeModal; }

/* ---------- bacheca ---------- */
async function showFeed(){
  page('<div class="wrap">' + sideCard() + '<main class="main">' +
    '<div class="card composer"><div class="row" style="align-items:flex-start">' + av(me.id) + '<textarea id="pbody" placeholder="Condividi una notizia, un\'idea, un evento con il Circle…"></textarea></div>' +
    '<div class="thumbs" id="pthumbs"></div>' +
    (meMember.member_type === "team" ? '<div class="row" style="margin-top:8px"><label class="sub">Collega un\'opportunità IMMONOVA:</label><select id="popp" class="f" style="margin:0;flex:1 1 200px;min-width:0;width:auto"><option value="">— nessuna —</option></select></div>' : "") +
    '<div class="row sp" style="margin-top:10px"><div class="row"><label class="btn ghost sm" style="cursor:pointer">📷 Foto<input type="file" id="pfile" accept="image/*" multiple hidden></label>' +
    '<button class="btn ghost sm" id="pprop">🏛 Proponi un immobile</button></div><button class="btn" id="psend">Pubblica</button></div>' +
    '<p class="sub" style="margin-top:8px;font-size:12px">Gli immobili non si pubblicano qui: usa “Proponi un immobile”, la proposta arriva riservata solo a IMMONOVA.</p></div>' +
    '<div id="feed"></div><div style="text-align:center;margin:18px 0"><button class="btn ghost" id="more" hidden>Carica altri</button></div></main></div>');
  bindSide();
  let files = [];
  $("#pfile").onchange = e => { files = files.concat([...e.target.files]).slice(0, 4);
    $("#pthumbs").innerHTML = files.map(f => '<img src="' + URL.createObjectURL(f) + '">').join(""); };
  $("#pprop").onclick = proposeModal;

function bindPostActions(box){

  box.querySelectorAll("[data-hide]:not([data-b])").forEach(b => { b.dataset.b = 1; b.onclick = async () => { const p = posts.find(x => x.id === +b.dataset.hide);
    await sb.from("social_posts").update({ hidden:!p.hidden }).eq("id", p.id); p.hidden = !p.hidden; toast(p.hidden ? "Post nascosto ai membri" : "Post di nuovo visibile"); go(tab); }; });
  box.querySelectorAll("[data-rep]:not([data-b])").forEach(b => { b.dataset.b = 1; b.onclick = async () => { const why = prompt("Perché segnali questo post a IMMONOVA?"); if(why === null) return;

  box.querySelectorAll("[data-dm]:not([data-b])").forEach(b => { b.dataset.b = 1; b.onclick = () => { chatWith = b.dataset.dm; go("msg"); }; });
  box.querySelectorAll("[data-u]:not([data-b])").forEach(a => { a.dataset.b = 1; a.onclick = e => { e.preventDefault(); go("members", a.dataset.u); }; });
  box.querySelectorAll("[data-dossier]:not([data-b])").forEach(s => { s.dataset.b = 1; s.onclick = e => { e.preventDefault(); e.stopPropagation(); location.href = "request-dossier.html?id=" + s.dataset.dossier; }; });

}

    '<label class="l">Città</label><input class="f" id="fc" value="' + esc(meMember.city || "") + '">' +
    '<label class="l">Presentazione</label><textarea class="f" id="fb" rows="4">' + esc(meMember.bio || "") + '</textarea>' +
    '<button class="btn" id="fsave">Salva profilo</button></div>' +
    '<div class="card" style="margin-top:16px" id="inviti"><h2 style="font-family:Georgia,serif;font-weight:400">Inviti</h2>' +
    '<p class="sub" style="margin:6px 0 12px">Il Circle cresce solo su invito. Invita persone che conosci personalmente e di cui ti fidi. ' + (isOwner ? "" : "Inviti disponibili: <b>" + (fresh.invites_left || 0) + "</b>") + '</p>' +
    '<div class="row"><input class="f" id="iem" placeholder="Email della persona (facoltativa)" style="flex:1;margin:0"><button class="btn" id="inew">Crea link di invito</button></div>' +
    '<div id="ilist" style="margin-top:12px">' + (inv.data || []).map(i => { const link = location.origin + location.pathname + "?invito=" + i.code;
      return '<div class="row sp" style="border-top:1px solid var(--line);padding:8px 0"><div style="min-width:0"><b>' + esc(i.email || "Invito " + i.code) + '</b><div class="sub">' +
        (i.used_by ? "✅ usato da " + nameOf(i.used_by) : new Date(i.expires_at) < new Date() ? "scaduto" : "valido fino al " + new Date(i.expires_at).toLocaleDateString("it-IT")) + '</div></div>' +
        (i.used_by ? "" : '<div class="row"><button class="btn ghost sm" data-copy="' + esc(link) + '">Copia link</button><a class="btn ghost sm" target="_blank" href="https://wa.me/?text=' + encodeURIComponent("Ti invito a entrare in IMMONOVA Circle, il club riservato di IMMONOVA: " + link) + '">WhatsApp</a></div>') + '</div>'; }).join("") + '</div></div>' +
    '<div class="card" style="margin-top:16px"><p class="sub">Per uscire dal tuo account usa “Esci”.</p><button class="btn ghost sm" id="logout" style="margin-top:8px">Esci</button></div></main></div>');
  bindSide();
  $("#avf").onchange = async e => { const f = e.target.files[0]; if(!f) return; const path = me.id + "/avatar-" + Date.now() + ".jpg";
    const up = await sb.storage.from("social-feed").upload(path, f, { contentType:f.type || "image/jpeg" }); if(up.error){ toast("Errore: " + up.error.message); return; }
    await sb.from("social_members").update({ avatar_path:path }).eq("user_id", me.id); await loadMembers(); meMember = members[me.id]; showProfile(); };
  $("#fsave").onclick = async () => { const r = await sb.from("social_members").update({ display_name:$("#fn").value.trim() || meMember.display_name, headline:$("#fh").value.trim(), city:$("#fc").value.trim(), bio:$("#fb").value.trim() }).eq("user_id", me.id);
    if(r.error){ toast("Errore: " + r.error.message); return; } await loadMembers(); meMember = members[me.id]; toast("Profilo salvato"); };
  $("#inew").onclick = async () => { const r = await sb.rpc("social_create_invite", { p_email:$("#iem").value.trim() || null, p_note:null });
    if(r.error){ toast(r.error.message); return; } const link = location.origin + location.pathname + "?invito=" + r.data;
    try{ await navigator.clipboard.writeText(link); toast("Link di invito copiato: incollalo dove vuoi"); }catch(e){ prompt("Link di invito:", link); } showProfile("inviti"); };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try{ await navigator.clipboard.writeText(b.dataset.copy); toast("Link copiato"); }catch(e){ prompt("Link:", b.dataset.copy); } });
  $("#logout").onclick = async () => { await sb.auth.signOut(); location.href = "index.html"; };
  if(sec === "inviti") $("#inviti").scrollIntoView({ block:"start" });
}

/* ---------- moderazione (solo titolare) ---------- */
async function showMod(){
  if(!isOwner) return go("feed");
  const [rep, prop, hid] = await Promise.all([
    sb.from("social_reports").select("*").is("resolved_at", null).order("created_at", { ascending:false }),
    sb.from("social_property_proposals").select("*").order("created_at", { ascending:false }).limit(50),
    sb.from("social_posts").select("id,author_id,body,created_at").eq("hidden", true).order("created_at", { ascending:false }).limit(30)]);
  page('<div class="wrap" style="grid-template-columns:1fr"><main class="main">' +
    '<div class="card"><h2 style="font-family:Georgia,serif;font-weight:400">🚩 Segnalazioni da gestire</h2>' +
    ((rep.data || []).map(r => '<div class="row sp" style="border-top:1px solid var(--line);padding:10px 0"><div><b>' + nameOf(r.reporter_id) + '</b> <span class="sub">' + ago(r.created_at) + '</span><div>' + esc(r.reason || "") + '</div>' +
      (r.post_id ? '<a class="sub" href="#post-' + r.post_id + '" data-gopost="' + r.post_id + '">Apri il post</a>' : "") + '</div><button class="btn ghost sm" data-res="' + r.id + '">Risolta</button></div>').join("") || '<p class="sub">Nessuna segnalazione aperta.</p>') + '</div>' +
    '<div class="card" style="margin-top:16px" id="proposte"><h2 style="font-family:Georgia,serif;font-weight:400">🏛 Proposte riservate dei membri</h2>' +
    ((prop.data || []).map(p => '<div style="border-top:1px solid var(--line);padding:10px 0"><b>' + (p.kind === "acquirente" ? "Acquirente" : "Immobile") + '</b> · ' + esc([p.tipologia, p.comune, p.prezzo].filter(Boolean).join(" · ")) +
      ' <span class="sub">da ' + nameOf(p.member_id) + ', ' + ago(p.created_at) + (p.owner_contact_ok ? " · ✅ contatto possibile" : "") + '</span><div>' + esc(p.descrizione || "") + '</div>' +
      '<button class="btn ghost sm" data-dmm="' + p.member_id + '" style="margin-top:6px">Scrivi a ' + nameOf(p.member_id) + '</button></div>').join("") || '<p class="sub">Nessuna proposta.</p>') + '</div>' +
    '<div class="card" style="margin-top:16px"><h2 style="font-family:Georgia,serif;font-weight:400">Post nascosti</h2>' +
    ((hid.data || []).map(p => '<div class="row sp" style="border-top:1px solid var(--line);padding:10px 0"><div><b>' + nameOf(p.author_id) + '</b> <span class="sub">' + ago(p.created_at) + '</span><div>' + esc((p.body || "").slice(0, 160)) + '</div></div><button class="btn ghost sm" data-unhide="' + p.id + '">Mostra di nuovo</button></div>').join("") || '<p class="sub">Nessun post nascosto.</p>') + '</div>' +
    '<p class="sub" style="margin-top:14px">Per sospendere un membro apri il suo profilo (Membri) e premi “Sospendi accesso”. Su ogni post trovi “Nascondi” ed “Elimina”.</p></main></div>');
  document.querySelectorAll("[data-res]").forEach(b => b.onclick = async () => { await sb.from("social_reports").update({ resolved_at:new Date().toISOString() }).eq("id", +b.dataset.res); showMod(); });
  document.querySelectorAll("[data-unhide]").forEach(b => b.onclick = async () => { await sb.from("social_posts").update({ hidden:false }).eq("id", +b.dataset.unhide); showMod(); });
  document.querySelectorAll("[data-dmm]").forEach(b => b.onclick = () => { chatWith = b.dataset.dmm; go("msg"); });
  document.querySelectorAll("[data-gopost]").forEach(a => a.onclick = e => { e.preventDefault(); location.hash = "post-" + a.dataset.gopost; go("feed"); });
}

start();
})();
</script>
</body>
</html>
