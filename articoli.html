<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notizie e Approfondimenti | IMMONOVA</title>
<meta name="description" content="Analisi, dati di mercato e approfondimenti su real estate di lusso, fiscalita' e incentivi in Puglia e nel Sud Italia, a cura di IMMONOVA.">
<link rel="canonical" href="https://immonova-consulting.it/articoli.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="IMMONOVA">
<meta property="og:title" content="Notizie e Approfondimenti | IMMONOVA">
<meta property="og:description" content="Analisi, dati di mercato e approfondimenti su real estate di lusso, fiscalita' e incentivi in Puglia e nel Sud Italia.">
<meta property="og:url" content="https://immonova-consulting.it/articoli.html">
<meta name="twitter:card" content="summary">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#4a3c1d}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),#f4ecdf}
.header{padding:40px 60px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:300;letter-spacing:.32em;color:#a67f34;text-decoration:none}
.back{text-decoration:none;color:#a67f34;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.hero{max-width:900px;margin:20px auto 60px;padding:0 24px;text-align:center}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a67f34;font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(28px,4vw,42px);font-weight:300;line-height:1.25;color:#4a3c1d}
.list{max-width:900px;margin:0 auto 100px;padding:0 24px;display:flex;flex-direction:column;gap:2px}
.post-card{display:block;text-decoration:none;color:inherit;background:#fffaf0;border:1px solid rgba(166,127,52,.2);padding:32px;margin-bottom:20px;transition:box-shadow .2s}
.post-card:hover{box-shadow:0 18px 50px rgba(127,100,48,.12)}
.post-date{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a67f34;margin-bottom:10px}
.post-title{font-size:22px;font-weight:400;margin-bottom:10px;line-height:1.3}
.post-excerpt{font-size:14px;line-height:1.6;color:#6b5a35}
.empty{text-align:center;color:#8f7643;padding:60px 0;font-size:14px}
@media(max-width:640px){.header{padding:26px 24px}.logo{font-size:18px}}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">IMMONOVA</a>
  <a href="index.html" class="back">&larr; Home</a>
</header>

<div class="hero">
  <div class="kicker">IMMONOVA &middot; Notizie e Approfondimenti</div>
  <h1>Mercato, fiscalità e opportunità nel real estate di lusso del Sud Italia</h1>
</div>

<div class="list" id="postList">
  <div class="empty">Caricamento...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function fmtDate(iso){
  if(!iso) return "";
  return new Date(iso).toLocaleDateString("it-IT", { day:"2-digit", month:"long", year:"numeric" });
}

async function load(){
  const listEl = document.getElementById("postList");
  const { data, error } = await client.from("blog_posts")
    .select("slug,title,excerpt,published_at")
    .eq("published", true)
    .order("published_at", { ascending: false });
  if(error){
    listEl.innerHTML = '<div class="empty">Impossibile caricare gli articoli al momento.</div>';
    return;
  }
  if(!data || !data.length){
    listEl.innerHTML = '<div class="empty">Nessun articolo pubblicato al momento. Torna presto.</div>';
    return;
  }
  listEl.innerHTML = data.map(p => `
    <a class="post-card" href="articolo.html?slug=${encodeURIComponent(p.slug)}">
      <div class="post-date">${esc(fmtDate(p.published_at))}</div>
      <div class="post-title">${esc(p.title)}</div>
      ${p.excerpt ? `<div class="post-excerpt">${esc(p.excerpt)}</div>` : ""}
    </a>
  `).join("");
}
load();
</script>

</body>
</html>
