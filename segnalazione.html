<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Segnalazione — IMMONOVA</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--cream:#f4ede1;--card:#fffdf8;--line:#e2d6bd;--gold:#a8812f;--dark:#2b2416;--muted:#7d6f55;--err:#8a1f1f;--ok:#2b5a26}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.logo{text-align:center;letter-spacing:.42em;font-size:22px;font-weight:300;color:var(--dark);margin:10px 0 2px}
.sub{text-align:center;font-size:10px;letter-spacing:.28em;color:var(--gold);font-weight:600;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;box-shadow:0 8px 24px rgba(43,36,22,.06)}
h1{font-size:21px;font-weight:600;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 16px;font-size:14.5px}
h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px;font-weight:700}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 5px}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--dark)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(168,129,47,.35);border-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:10px;background:var(--dark);color:#f1d27a;font-size:16px;font-weight:600;letter-spacing:.06em;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-size:14px;min-height:18px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.done{text-align:center;padding:26px 6px}
.done .ic{font-size:44px}
.hidden{display:none}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">IMMONOVA</div>
  <div class="sub">OFF MARKET • CONSULTING</div>
  <div class="card" id="card"><p class="lead" style="text-align:center;margin:0">Caricamento…</p></div>
  <div class="foot">I dati inviati sono usati solo dal team IMMONOVA per gestire la segnalazione.</div>
</div>
<script>
const FN = "https://bpzzmitmbavcmcasswbu.supabase.co/functions/v1/immonova-segnalazioni";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const TIP = ["Villa","Appartamento","Masseria","Palazzo storico","Hotel / Resort","Terreno","Locale commerciale","Altro"];
const tipId = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "_");
const sel = (name, req) => '<select name="' + name + '"' + (req ? " required" : "") + '><option value="">Scegli…</option>' + TIP.map(t => '<option value="' + tipId(t) + '">' + t + '</option>').join("") + '</select>';
const inp = (name, label, opt, type, extra) => '<label>' + label + (opt ? ' <span class="opt">(facoltativo)</span>' : "") + '</label><input name="' + name + '" type="' + (type || "text") + '"' + (opt ? "" : " required") + (extra || "") + '>';
const area = (name, label, opt) => '<label>' + label + (opt ? ' <span class="opt">(facoltativo)</span>' : "") + '</label><textarea name="' + name + '"' + (opt ? "" : " required") + '></textarea>';
const fail = m => { $("card").innerHTML = '<div class="done"><div class="ic">⚠️</div><p>' + esc(m) + '</p></div>'; };

async function init(){
  if(!token) return fail("Link non valido.");
  let j; try { j = await (await fetch(FN + "?t=" + encodeURIComponent(token))).json(); } catch(e){ return fail("Connessione non riuscita. Riprova tra poco."); }
  if(!j.ok) return fail(j.error || "Link non valido.");
  const k = j.kind;
  const title = k === "immobile" ? "Segnala un immobile" : k === "acquirente" ? "Segnala un acquirente" : "Scrivi al team IMMONOVA";
  let h = '<h1>' + title + '</h1><p class="lead">' + (j.nome ? "Ciao " + esc(j.nome) + ", c" : "C") + 'ompila i campi e premi Invia: arriva subito al tuo referente IMMONOVA.</p><form id="f" novalidate>';
  if(j.nuovo) h += '<h2>I tuoi dati</h2><div class="two"><div>' + inp("seg_nome", "Nome") + '</div><div>' + inp("seg_cognome", "Cognome") + '</div></div>' +
    inp("seg_cell", "Cellulare", false, "tel", ' inputmode="tel" value="' + esc(j.phone) + '"');
  if(k === "immobile") h += '<h2>L\'immobile</h2><label>Tipologia</label>' + sel("tipologia", true) + inp("comune", "Comune / zona") + inp("indirizzo", "Indirizzo", true) +
    '<div class="two"><div>' + inp("mq", "Mq indicativi", true, "text", ' inputmode="numeric"') + '</div><div>' + inp("prezzo", "Prezzo richiesto (€)", true, "text", ' inputmode="numeric"') + '</div></div>' +
    '<h2>Il proprietario</h2>' + inp("prop_nome", "Nome e cognome") + inp("prop_tel", "Telefono", true, "tel", ' inputmode="tel"') + area("note", "Note (stato, disponibilità a vendere, altro)", true);
  if(k === "acquirente") h += '<h2>Il cliente</h2>' + inp("cli_nome", "Nome e cognome") + inp("cli_tel", "Telefono", true, "tel", ' inputmode="tel"') +
    '<label>Cosa cerca</label>' + sel("cerca", true) + inp("zone", "Zone di interesse") +
    '<div class="two"><div>' + inp("budget_min", "Budget minimo (€)", true, "text", ' inputmode="numeric"') + '</div><div>' + inp("budget_max", "Budget massimo (€)", true, "text", ' inputmode="numeric"') + '</div></div>' +
    area("note", "Note (camere, mare, piscina, tempi…)", true);
  if(k === "generico") h += area("messaggio", "Il tuo messaggio");
  h += '<button type="submit" id="go">Invia</button><div class="msg" id="msg"></div></form>';
  $("card").innerHTML = h;
  $("f").addEventListener("submit", send);
}
async function send(e){
  e.preventDefault();
  const f = $("f"), msg = $("msg");
  const miss = [...f.querySelectorAll("[required]")].find(x => !x.value.trim());
  if(miss){ msg.className = "msg err"; msg.textContent = "Compila il campo: " + (miss.previousElementSibling ? miss.previousElementSibling.textContent : "obbligatorio"); miss.focus(); return; }
  const data = {}; new FormData(f).forEach((v, k) => data[k] = String(v).trim());
  $("go").disabled = true; msg.className = "msg"; msg.textContent = "Invio in corso…";
  try{
    const j = await (await fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ action:"submit", token, data }) })).json();
    if(!j.ok) throw new Error(j.error || "Invio non riuscito");
    $("card").innerHTML = '<div class="done"><div class="ic">✅</div><h1>Grazie!</h1><p>' + esc(j.message) + '</p><p class="lead">Puoi chiudere questa pagina e tornare su WhatsApp.</p></div>';
  }catch(err){ $("go").disabled = false; msg.className = "msg err"; msg.textContent = err.message; }
}
init();
</script>
</body>
</html>
