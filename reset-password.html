<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#7f6430;display:flex;align-items:center;justify-content:center;padding:32px}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),#f4ecdf}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);background-size:230px 199px;opacity:.30}
.card{max-width:420px;width:100%;background:rgba(255,255,255,.5);border:1px solid rgba(166,127,52,.22);padding:44px 34px;box-shadow:0 24px 70px rgba(127,100,48,.10)}
.logo{font-size:22px;letter-spacing:.35em;color:#a67f34;font-weight:300;text-align:center;margin-bottom:6px}
.brand-sub{font-size:9px;letter-spacing:.22em;color:#a58139;text-transform:uppercase;text-align:center;margin-bottom:30px}
h1{font-size:19px;font-weight:500;color:#5c4a20;margin-bottom:22px;text-align:center}
.field{margin-bottom:16px}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8f7643;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid rgba(166,127,52,.30);background:rgba(255,255,255,.55);color:#5c4a20;font-size:14px;font-family:inherit;outline:none}
button{width:100%;margin-top:10px;padding:14px;border:1px solid #a67f34;background:#a67f34;color:#fff;text-transform:uppercase;font-size:12px;letter-spacing:.16em;cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:16px;min-height:20px;font-size:12.5px;line-height:1.6}
.error{color:#9c2f2f}
.success{color:#4f7f45}
.alt{margin-top:20px;text-align:center;font-size:12.5px;color:#8f7643}
.alt a{color:#a67f34}
</style>
</head>

<body>
<div class="card">
  <div class="logo">IMMONOVA</div>
  <div class="brand-sub">Off Market • Consulting</div>
  <h1>Imposta la nuova password</h1>

  <form id="resetForm">
    <div class="field"><label for="password">Nuova password</label><input type="password" id="password" minlength="8" required></div>
    <div class="field"><label for="confirmPassword">Conferma password</label><input type="password" id="confirmPassword" minlength="8" required></div>
    <button type="submit" id="submitBtn">Salva nuova password</button>
  </form>

  <div id="status" class="status">Verifica del link in corso...</div>
  <div class="alt"><a href="signin.html">Torna al login</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var form = document.getElementById("resetForm");
var statusBox = document.getElementById("status");
var submitBtn = document.getElementById("submitBtn");
var linkValid = false;

function setStatus(msg, type){
  statusBox.textContent = msg || "";
  statusBox.className = "status " + (type || "");
}

client.auth.onAuthStateChange(function(event, session){
  if(event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)){
    linkValid = true;
    setStatus("Inserisci la tua nuova password.", "");
  }
});

setTimeout(async function(){
  if(linkValid) return;
  var sessionRes = await client.auth.getSession();
  if(sessionRes.data.session){
    linkValid = true;
    setStatus("Inserisci la tua nuova password.", "");
  }else{
    setStatus("Link non valido o scaduto. Richiedine uno nuovo dalla pagina di accesso.", "error");
  }
}, 1500);

form.addEventListener("submit", async function(e){
  e.preventDefault();

  if(!linkValid){
    setStatus("Link non valido o scaduto. Richiedine uno nuovo dalla pagina di accesso.", "error");
    return;
  }

  var password = document.getElementById("password").value;
  var confirmPassword = document.getElementById("confirmPassword").value;

  if(password !== confirmPassword){
    setStatus("Le due password non coincidono.", "error");
    return;
  }

  submitBtn.disabled = true;
  setStatus("Salvataggio in corso...", "");

  try{
    var res = await client.auth.updateUser({ password: password });
    if(res.error) throw res.error;

    setStatus("Password aggiornata correttamente. Reindirizzamento al login...", "success");
    setTimeout(function(){ window.location.href = "signin.html"; }, 1200);
  }catch(error){
    setStatus(error.message || "Errore durante il salvataggio.", "error");
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
