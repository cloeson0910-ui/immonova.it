}
body::before{
  content:"";

  z-index:-2;

.header{
  padding:34px 52px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(166,127,52,.10);
  background:rgba(244,236,223,.62);

  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  font-size:24px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a67f34;
  text-decoration:none;
}
.nav{
  display:flex;
  gap:30px;
  align-items:center;
  flex-wrap:wrap;
}
.nav a{
  text-decoration:none;
  color:#a67f34;
  font-size:11px;
  letter-spacing:.24em;
  text-transform:uppercase;
  padding:0;
  border:none;
  background:transparent;
  position:relative;
}
.nav a::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-8px;
  height:1px;
  background:#a67f34;
  transform:scaleX(0);
  transform-origin:center;
  transition:transform .28s ease;
}
.nav a:hover::after{transform:scaleX(1)}
.nav a:hover{color:#7f6430}
.page{

}
.lang-row{

.language-select{

  font-size:10px;
  letter-spacing:.14em;
  outline:none;
  font-family:inherit;
}
.hero{

  grid-template-columns:1.05fr .95fr;
  gap:46px;
  align-items:center;

}
.kicker{

  letter-spacing:.34em;
  text-transform:uppercase;
  color:#9a793c;
  margin-bottom:16px;
}
h1{

  font-size:clamp(42px,5vw,76px);

  line-height:1.05;
  letter-spacing:.07em;
  text-transform:uppercase;
  margin-bottom:22px;
}
.meta{
  color:#8f7643;
  font-size:14px;

  text-transform:uppercase;

.hero-desc{

.status-badge{

}

  overflow:hidden;
}
.hero-media img{

  height:100%;
  min-height:460px;
  object-fit:cover;
  display:block;
}
.media-placeholder{
  min-height:460px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#a67f34;
  letter-spacing:.22em;
  text-transform:uppercase;
  line-height:1.9;
}
.lock-marker{
  position:absolute;
  right:18px;
  bottom:18px;
  max-width:250px;
  padding:15px 18px;
  border:1px solid rgba(241,210,122,.42);
  background:linear-gradient(135deg,rgba(255,252,244,.48),rgba(166,127,52,.16));
  backdrop-filter:blur(14px) saturate(150%);
  color:#fff0b1;
  text-transform:uppercase;
  text-shadow:0 1px 10px rgba(0,0,0,.28);
}
.lock-marker small{
  display:block;
  font-size:8px;
  letter-spacing:.20em;
  color:#f1d27a;
}
.lock-marker strong{
  display:block;
  margin-top:5px;
  font-size:13px;
  letter-spacing:.16em;
}
.main-grid{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);
  gap:34px;
  align-items:start;
}
.panel{
  border:1px solid rgba(166,127,52,.16);
  background:rgba(255,255,255,.18);
  padding:36px;

}
.panel + .panel{margin-top:28px}
.section-title{

  letter-spacing:.26em;
  text-transform:uppercase;
  color:#a67f34;
  margin-bottom:20px;
}
.text{
  font-size:15px;
  line-height:1.9;
  color:#735f36;
  white-space:pre-line;
}
.data-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}
.data-item{
  border-top:1px solid rgba(166,127,52,.16);

}
.data-label{
  font-size:9px;
  letter-spacing:.20em;
  text-transform:uppercase;
  color:#a67f34;
  margin-bottom:8px;
}
.data-value{
  font-size:15px;
  color:#735f36;
  line-height:1.45;
}

.amenities-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:22px 18px;
}
.amenity-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:8px;
}
.amenity-icon{
  width:30px;
  height:30px;
  color:#a67f34;
}
.amenity-icon svg{
  width:100%;
  height:100%;
  display:block;
}
.amenity-label{
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#8f7643;
}
.teaser-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.teaser-card{
  min-height:130px;
  padding:18px;
  border:1px solid rgba(166,127,52,.14);
  background:rgba(255,255,255,.16);
}
.teaser-title{
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#a67f34;
  margin-bottom:12px;
}
.teaser-text{
  font-size:13px;
  line-height:1.65;
  color:#735f36;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.gallery-item{
  min-height:150px;
  border:1px solid rgba(166,127,52,.14);
  overflow:hidden;
  background:rgba(166,127,52,.08);
}
.gallery-item img{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
}
.gallery-locked{

  justify-content:center;
  text-align:center;
  padding:18px;
  color:#a67f34;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  line-height:1.7;
}
.lock-box{

  padding:22px;

  font-size:14px;
  line-height:1.75;
}
.timeline-item{

.timeline-desc{

  line-height:1.7;
  color:#735f36;
}
.events-grid{

  grid-template-columns:repeat(2,1fr);

.event-desc{

  line-height:1.7;

  letter-spacing:.16em;
}
.success-link:hover{background:#a67f34;color:#fff}
.form-title{
  font-size:24px;
  font-weight:300;
  letter-spacing:.08em;
  color:#a67f34;
  margin-bottom:16px;

.form-intro{

  line-height:1.8;
  color:#735f36;
  margin-bottom:24px;
}

  padding-top:22px;
  border-top:1px solid rgba(166,127,52,.16);

.form-section-title{
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#a67f34;
  margin-bottom:16px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.field.full{grid-column:1 / -1}
input,textarea,select{
  width:100%;
  padding:15px 16px;
  margin-bottom:15px;
  border:1px solid rgba(166,127,52,.25);
  background:rgba(255,252,244,.35);
  color:#7f6430;
  font-size:14px;
  outline:none;
  font-family:inherit;
}
textarea{min-height:120px;resize:vertical}
select{appearance:none;cursor:pointer}
.consent-box{

  padding:16px;
  border:1px solid rgba(166,127,52,.18);
  background:rgba(255,252,244,.22);

.consent-label{

  font-size:12px;
  line-height:1.55;

  background:rgba(255,255,255,.20);
  font-size:11px;
  line-height:1.65;
  color:#7f6430;
}
button{
  width:100%;
  padding:15px;
  border:1px solid rgba(166,127,52,.42);
  background:rgba(255,252,244,.22);
  color:#a67f34;
  text-transform:uppercase;
  font-size:11px;
  font-weight:500;
  letter-spacing:.24em;
  cursor:pointer;

button:hover{background:#a67f34;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.status{
  margin-top:16px;
  min-height:20px;
  font-size:13px;
  line-height:1.6;
}
.success{color:#4f7f45}
.error{color:#9c2f2f}
.warning{color:#a67f34;font-weight:600}
.empty{
  text-align:center;
  padding:90px 20px;
  border:1px solid rgba(166,127,52,.18);
  background:rgba(255,255,255,.10);
  color:#8f7643;
}
html[dir="rtl"] body{direction:rtl}
html[dir="rtl"] .header,
html[dir="rtl"] .main-grid,
html[dir="rtl"] .form-grid,
html[dir="rtl"] .data-grid{direction:rtl}
@media(max-width:1050px){
  .hero,.main-grid{grid-template-columns:1fr}
  .teaser-grid{grid-template-columns:1fr}
}
@media(max-width:780px){
  .header{padding:28px 24px;flex-direction:column;gap:18px}
  .nav{justify-content:center;gap:18px}
  .page{padding:38px 22px 80px}
  .form-grid,.data-grid,.gallery,.events-grid{grid-template-columns:1fr}
  .timeline-item{grid-template-columns:1fr}
  .panel{padding:26px}
}
</style>
</head>

["fr","de","es","ar"].forEach(function(lang){
  UI_TRANSLATIONS[lang] = Object.assign({}, UI_TRANSLATIONS.en, UI_TRANSLATIONS[lang] || {});
});

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeLanguage(value){
  const clean = String(value || "en").trim().toLowerCase().slice(0,2);
  return SUPPORTED_LANGUAGES.includes(clean) ? clean : "en";
}

function dict(key){
  return (UI_TRANSLATIONS[currentLanguage] && UI_TRANSLATIONS[currentLanguage][key]) || UI_TRANSLATIONS.en[key] || key;
}

function applyDirection(){
  document.documentElement.lang = currentLanguage;
  document.documentElement.dir = currentLanguage === "ar" ? "rtl" : "ltr";
}

function applyStaticTranslations(){
  applyDirection();
  if(languageSelect) languageSelect.value = currentLanguage;

  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const key = el.getAttribute("data-i18n");
    el.textContent = dict(key);
  });

  if(!currentOpportunity){
    pageContent.textContent = dict("loading_opportunity");
  }
}

function normalizeGallery(value){
  if(!value)return [];
  if(Array.isArray(value))return value.filter(Boolean);
  try{
    const parsed=JSON.parse(value);
    return Array.isArray(parsed)?parsed.filter(Boolean):[];
  }catch(e){
    return [];
  }
}

function fmtDate(v){
  if(!v)return "";
  try{
    return new Date(v).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});
  }catch(e){
    return v;
  }
}

function commercialLabel(status){
  const s = status || "available";
  if(s === "sold") return dict("sold_status");
  if(s === "reserved") return dict("reserved_status");
  if(s === "under_negotiation") return dict("under_negotiation");
  return dict("available");
}

function isSold(data){
  return (data.commercial_status || "available") === "sold";
}

function eventTypeLabel(type){
  const map = {
    selling_party:"Selling Party",
    closing_party:"Closing Party",
    welcome_party:"Welcome Party",
    past_party:"Party avvenuto",
    upcoming_party:"Party in programma",
    investor_tour:"Investor Tour",
    site_visit:"Site Visit",
    private_dinner:"Private Dinner"
  };
  return map[type] || type || "Evento";
}

function cover(data){
  return data.cover_image || normalizeGallery(data.gallery_images)[0] || "";
}

function publicGallery(data){
  const gallery = normalizeGallery(data.gallery_images);
  const all = [data.cover_image].concat(gallery).filter(Boolean);
  return [...new Set(all)].slice(0,6);
}

function lockedGalleryCount(data){
  const gallery = normalizeGallery(data.gallery_images);
  return Math.max(0, gallery.length - 5);
}

function teaserText(data){
  if(data.ai_summary) return data.ai_summary;
  if(data.analysis_summary) return data.analysis_summary;
  return "L’analisi preliminare evidenzia un potenziale interessante in termini di posizionamento, valorizzazione e domanda qualificata. La versione completa è disponibile nel Dossier Riservato.";
}

/* Market/Tourism teaser: usano SOLO metriche non finanziarie dal dossier verificato
   (__dossier_data, popolato da loadSafeDossierMetrics -- niente real_estate_market/adr).
   Se il dossier non è ancora disponibile per questa opportunità, restano i testi generici
   di sempre: non promettono mai un dato che non c'è davvero. */
function marketTeaserText(data){
  const dossier = data.__dossier_data;
  if(dossier && dossier.sources_count) return dict("market_teaser_with_data");
  return dict("market_teaser_generic");
}
function tourismTeaserText(data){
  const dossier = data.__dossier_data;
  if(dossier && dossier.tourism_arrivals){
    return dict("tourism_teaser_with_arrivals").replace("{arrivals}", new Intl.NumberFormat(currentLanguage === "it" ? "it-IT" : currentLanguage).format(dossier.tourism_arrivals));
  }
  return dict("tourism_teaser_generic");
}

function timelineFor(data){
  const timeline = data.opportunity_timeline || [];
  const events = (data.immonova_events || []).map(function(e){
    return {
      created_at:e.event_date || e.created_at,
      timeline_type:e.event_type,
      title:eventTypeLabel(e.event_type),
      description:e.title || e.short_description || e.description || "",
      visibility:"public"
    };
  });

  const soldStep = isSold(data) && data.sold_at ? [{
    created_at:data.sold_at,
    timeline_type:"sold",
    title:dict("investment_completed"),
    description:dict("investment_completed_desc"),
    visibility:"public"
  }] : [];

  return timeline.concat(events).concat(soldStep)
    .filter(x => (x.visibility || "public") === "public")
    .sort((a,b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
}

/* Traduce il CONTENUTO specifico di questa scheda (titolo, categoria, tipologia,
   descrizioni, titoli/descrizioni degli eventi collegati) -- diverso dal dizionario fisso
   dell'interfaccia: qui il testo cambia per ogni opportunità, quindi la cache è per
   scheda+lingua, non globale. Location/indirizzi/venue NON vengono mai tradotti: sono nomi
   di luogo, tradurli li renderebbe sbagliati. Se la traduzione fallisce per qualsiasi motivo,
   la pagina mostra semplicemente il testo originale in italiano -- non deve mai bloccarsi. */
async function getRenderData(data){
  if(!data || currentLanguage === "it") return data;

  const cacheKey = "immonova_public_content_" + data.id + "_" + currentLanguage + "_v1";
  try{
    const cached = localStorage.getItem(cacheKey);
    if(cached){ const parsed = JSON.parse(cached); if(parsed && typeof parsed === "object") return parsed; }
  }catch(e){}

  const events = (data.immonova_events || []).slice(0,6);
  const eventTexts = events.map(e => [e.title || "", e.short_description || "", e.description || ""]);

  const texts = [
    data.title || "", data.category || "", data.investment_type || "",
    data.short_description || "", data.full_description || "",
    ...eventTexts.flat()
  ];

  try{
    const result = await client.functions.invoke("translate-public-content", {
      body:{
        language: currentLanguage,
        source_language: "it",
        context: "IMMONOVA luxury real estate investment opportunity page: property title, category, investment type, short and full description, and linked event titles/descriptions. Preserve property names and place names as-is, do not translate them.",
        texts: texts
      }
    });

    if(result.error || !result.data || !result.data.success || !Array.isArray(result.data.translations)){
      console.warn("Traduzione contenuto scheda non riuscita, mostro italiano:", result.error || result.data);
      return data;
    }

    const t = result.data.translations;
    const allEvents = data.immonova_events || [];
    const translatedEvents = allEvents.map(function(e, i){
      if(i >= 6) return e;
      const base = 5 + i * 3;
      return Object.assign({}, e, {
        title: t[base] != null ? t[base] : e.title,
        short_description: t[base + 1] != null ? t[base + 1] : e.short_description,
        description: t[base + 2] != null ? t[base + 2] : e.description
      });
    });

    const translated = Object.assign({}, data, {
      title: t[0] != null ? t[0] : data.title,
      category: t[1] != null ? t[1] : data.category,
      investment_type: t[2] != null ? t[2] : data.investment_type,
      short_description: t[3] != null ? t[3] : data.short_description,
      full_description: t[4] != null ? t[4] : data.full_description,
      immonova_events: translatedEvents
    });

    try{ localStorage.setItem(cacheKey, JSON.stringify(translated)); }catch(e){}
    return translated;
  }catch(e){
    console.warn("Traduzione contenuto scheda fallita (non bloccante), mostro italiano:", e);
    return data;
  }
}

async function loadOpportunity(){
  if(!id){
    pageContent.innerHTML = dict("no_opportunity");
    return;
  }

  const { data, error } = await client
    .from("opportunities")
    .select("*, immonova_events(*), opportunity_timeline(*)")
    .eq("id", id)
    .or("published.eq.true,commercial_status.eq.sold")
    .single();

  if(error || !data){
    pageContent.innerHTML = dict("unavailable");
    return;
  }

  currentOpportunity = data;
  data.__dossier_data = await loadSafeDossierMetrics(id);
  await renderOpportunity(data);
}

/* Recupera SOLO le metriche del dossier che non sono cifre di prezzo/investimento (arrivi
   turistici, popolazione, conteggi di punti d'interesse verificati) -- MAI real_estate_market
   (valore al m²) o adr/tourism_pricing (tariffe), che restano riservate al dossier completo.
   Se il report non esiste ancora, o la query fallisce, la pagina pubblica funziona comunque
   con le card generiche di fallback: questa funzione non deve mai bloccare il caricamento. */
async function loadSafeDossierMetrics(opportunityId){
  try{
    const { data, error } = await client
      .from("opportunity_reports")
      .select("report_json")
      .eq("opportunity_id", opportunityId)
      .order("generated_at", { ascending:false })
      .limit(1)
      .maybeSingle();

    if(error || !data || !data.report_json || !data.report_json.dossier_data) return null;

    const d = data.report_json.dossier_data;
    const metricValue = (section, field) => {
      const bucket = d[section];
      if(!bucket) return null;
      const f = bucket[field];
      if(!f || typeof f !== "object" || !("value" in f)) return null;
      const n = Number(f.value);
      return Number.isFinite(n) ? n : null;
    };

    return {
      tourism_arrivals: metricValue("tourism","arrivals"),
      population: metricValue("demography","population"),
      hospitality_count: (d.hospitality && Array.isArray(d.hospitality.items)) ? d.hospitality.items.length : null,
      sources_count: countVerifiedSources(d)
    };
  }catch(e){
    console.warn("Dossier metrics non disponibili (non bloccante):", e);
    return null;
  }
}

/* Conta le fonti verificate PRESENTI nel dossier, ignorando esplicitamente le sezioni
   finanziarie -- usato solo per dire "basato su N fonti verificate", mai per mostrare i valori
   veri e propri di quelle sezioni. */
function countVerifiedSources(dossierData){
  const EXCLUDED_FINANCIAL_SECTIONS = ["real_estate_market","adr","tourism_pricing"];
  let count = 0;
  Object.keys(dossierData || {}).forEach(section => {
    if(EXCLUDED_FINANCIAL_SECTIONS.includes(section)) return;
    const bucket = dossierData[section];
    if(!bucket || typeof bucket !== "object") return;
    Object.keys(bucket).forEach(field => {
      if(field === "summary" || field === "items" || field === "count") return;
      const f = bucket[field];
      if(f && typeof f === "object" && "value" in f) count++;
    });
  });
  return count;
}

async function rerenderCurrentOpportunity(){
  applyStaticTranslations();
  if(currentOpportunity) await renderOpportunity(currentOpportunity);
}

async function submitInquiry(e){
  e.preventDefault();

  const status = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  status.className = "status";
  status.textContent = dict("sending_status");
  submitBtn.disabled = true;
  submitBtn.textContent = dict("sending");

  try{
    const firstName = document.getElementById("first_name").value.trim();
    const lastName = document.getElementById("last_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const country = document.getElementById("country").value.trim();
    const company = document.getElementById("company").value.trim();
    const budgetRange = document.getElementById("budget_range").value.trim();
    const preferredLanguage = normalizeLanguage(document.getElementById("preferred_language").value || currentLanguage);
    const investorType = document.getElementById("investor_type").value.trim();
    const message = document.getElementById("message").value.trim();
    const ndaAccepted = document.getElementById("nda_accepted").checked;
    const privacyAccepted = document.getElementById("privacy_accepted").checked;

    if(!firstName || !lastName || !email || !phone || !country || !preferredLanguage || !investorType || !message){
      throw new Error(dict("required_error"));
    }

    const consentComplete = ndaAccepted && privacyAccepted;

    const payload = {
      opportunity_id: currentOpportunity.id,
      opportunity_title: currentOpportunity.title || null,
      first_name:firstName,
      last_name:lastName,
      full_name:firstName + " " + lastName,
      email:email,
      phone:phone,
      country:country,
      company:company || null,
      budget_range:budgetRange || null,
      preferred_language:preferredLanguage,
      investor_type:investorType,
      message:
        "Opportunity: " + (currentOpportunity.title || "") +
        " | Category: " + (currentOpportunity.category || "") +
        " | Location: " + (currentOpportunity.location || "") +
        " | Preferred language: " + preferredLanguage +
        " | Investor type: " + investorType +
        " | Country: " + country +
        " | Budget range: " + (budgetRange || "-") +
        " | Company: " + (company || "-") +
        " | Message: " + message,
      nda_accepted:ndaAccepted,
      nda_accepted_at:ndaAccepted ? new Date().toISOString() : null,
      nda_text_version:"IMMONOVA_NDA_PUBLIC_V1",
      privacy_accepted:privacyAccepted,
      privacy_accepted_at:privacyAccepted ? new Date().toISOString() : null,
      request_completed:consentComplete,
      completion_status: "pending_review",
      approved:false,
      dossier_sent:false,
      status:"pending",
      request_status:"pending",
      user_agent:navigator.userAgent || null,
      source_page:window.location.href,
      created_at:new Date().toISOString(),
      updated_at:new Date().toISOString()
    };

    const { error } = await client.from("investor_requests").insert([payload]);
    if(error) throw error;

    try{
      await client.functions.invoke("dossier-request-email", {
        body:{ request: payload }
      });
    }catch(mailError){
      console.warn("Email notification failed:", mailError);
    }

    if(consentComplete){
      status.className = "status success";
      status.textContent = dict("success");
    }else{
      status.className = "status warning";
      status.textContent = dict("consent_missing_warning");
    }
    e.target.reset();

    const preferredLanguageSelect = document.getElementById("preferred_language");
    if(preferredLanguageSelect) preferredLanguageSelect.value = currentLanguage;

  }catch(error){
    status.className = "status error";
    status.textContent = error.message || dict("send_error");
  }

  submitBtn.disabled = false;
  submitBtn.textContent = dict("submit");
}
