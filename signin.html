<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi | IMMONOVA</title>
<meta name="robots" content="noindex" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
<meta name="theme-color" content="#a67f34" />

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#7f6430;display:flex;align-items:center;justify-content:center;padding:32px}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),#f4ecdf}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);background-size:230px 199px;opacity:.30}
.card{max-width:420px;width:100%;background:rgba(255,255,255,.5);border:1px solid rgba(166,127,52,.22);padding:44px 34px;box-shadow:0 24px 70px rgba(127,100,48,.10)}
.logo{font-size:22px;letter-spacing:.35em;color:#a67f34;font-weight:300;text-align:center;margin-bottom:6px}
.brand-sub{font-size:9px;letter-spacing:.22em;color:#a58139;text-transform:uppercase;text-align:center;margin-bottom:30px}
h1{font-size:19px;font-weight:500;color:#5c4a20;margin-bottom:22px;text-align:center}
.field{margin-bottom:16px}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8f7643;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid rgba(166,127,52,.30);background:rgba(255,255,255,.55);color:#5c4a20;font-size:14px;font-family:inherit;outline:none}
button{width:100%;margin-top:10px;padding:14px;border:1px solid #a67f34;background:#a67f34;color:#fff;text-transform:uppercase;font-size:12px;letter-spacing:.16em;cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:16px;min-height:20px;font-size:12.5px;line-height:1.6}
.error{color:#9c2f2f}
.success{color:#4f7f45}
.alt{margin-top:20px;text-align:center;font-size:12.5px;color:#8f7643}
.alt a{color:#a67f34}
.forgot{display:block;margin-top:12px;text-align:right;font-size:11.5px;color:#a58139;cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:underline}
</style>
</head>

<body>
<div class="card">
  <div class="logo">IMMONOVA</div>
  <div class="brand-sub">Off Market • Consulting</div>
  <h1>Accedi al tuo account</h1>

  <form id="signinForm">
    <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
    <button type="button" class="forgot" id="forgotBtn">Password dimenticata?</button>
    <button type="submit" id="submitBtn">Accedi</button>
  </form>

  <div id="status" class="status"></div>
  <button type="button" id="resendBtn" class="alt" style="display:none;background:none;border:none;text-decoration:underline;cursor:pointer;color:#a67f34;font-size:12.5px;font-family:inherit;padding:0">Invia di nuovo l'email di conferma</button>
  <div class="alt">Non hai un account? <a href="signup.html">Registrati</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var form = document.getElementById("signinForm");
var statusBox = document.getElementById("status");
var submitBtn = document.getElementById("submitBtn");

var params = new URLSearchParams(window.location.search);
var redirectTo = params.get("redirect") || "favorites.html";

function setStatus(msg, type){
  statusBox.textContent = msg || "";
  statusBox.className = "status " + (type || "");
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;

  submitBtn.disabled = true;
  setStatus("Accesso in corso...", "");

  try{
    var res = await client.auth.signInWithPassword({ email: email, password: password });
    if(res.error) throw res.error;

    setStatus("Accesso effettuato. Reindirizzamento...", "success");
    setTimeout(function(){ window.location.href = redirectTo; }, 700);
  }catch(error){
    var message = error.message || "Errore durante l'accesso.";
    setStatus(message, "error");

    // Supabase segnala così un account creato ma mai confermato via email.
    if(/email not confirmed/i.test(message)){
      var resendBtn = document.getElementById("resendBtn");
      resendBtn.style.display = "";
      resendBtn.dataset.email = email;
    }
  }

  submitBtn.disabled = false;
});

document.getElementById("resendBtn").addEventListener("click", async function(){
  var btn = this;
  var email = btn.dataset.email;
  if(!email) return;

  btn.disabled = true;
  setStatus("Invio email di conferma in corso...", "");

  try{
    var res = await client.auth.resend({ type: "signup", email: email });
    if(res.error) throw res.error;
    setStatus("Email di conferma inviata di nuovo. Controlla anche la cartella spam.", "success");
  }catch(error){
    setStatus(error.message || "Errore durante l'invio.", "error");
  }

  btn.disabled = false;
});

document.getElementById("forgotBtn").addEventListener("click", async function(){
  var email = document.getElementById("email").value.trim();
  if(!email){
    setStatus("Inserisci prima la tua email nel campo sopra.", "error");
    return;
  }
  try{
    var res = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/reset-password.html"
    });
    if(res.error) throw res.error;
    setStatus("Ti abbiamo inviato un'email per reimpostare la password.", "success");
  }catch(error){
    setStatus(error.message || "Errore durante l'invio.", "error");
  }
});
</script>
</body>
</html>
