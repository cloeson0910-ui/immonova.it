<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Palazzo storico in centro storico Gallipoli — Dossier IMMONOVA</title>
<meta name="description" content="Laden Sie das vertrauliche Immobilien-Dossier von Palazzo storico in centro storico Gallipoli herunter.">
<meta property="og:type" content="website">
<meta property="og:title" content="Palazzo storico in centro storico Gallipoli — Dossier IMMONOVA">
<meta property="og:description" content="Laden Sie das vertrauliche Immobilien-Dossier herunter.">
<meta property="og:image" content="https://immonova-consulting.it/dossier/opportunity-34-de-cover.jpg">
<meta property="og:image:secure_url" content="https://immonova-consulting.it/dossier/opportunity-34-de-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="940">
<meta property="og:image:height" content="588">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Palazzo storico in centro storico Gallipoli — Dossier IMMONOVA">
<meta name="twitter:image" content="https://immonova-consulting.it/dossier/opportunity-34-de-cover.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;background:#f7f1e6;color:#4a3c1d;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
  .card{max-width:480px;width:100%;background:#fffaf0;border:1px solid rgba(166,127,52,.25);border-radius:4px;overflow:hidden;box-shadow:0 24px 60px rgba(127,100,48,.12)}
  .card .cover-wrap{width:100%;aspect-ratio:1.6;overflow:hidden;background:#efe6d2}
  .card .cover-wrap img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
  .card-body{padding:28px}
  .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a67f34;font-weight:600;margin:0 0 8px}
  h1{font-size:20px;margin:0 0 18px;line-height:1.3}
  p.lead{font-size:13px;line-height:1.5;color:#6b6353;margin:0 0 16px}
  label.field-label{display:block;font-size:11px;font-weight:600;color:#8a7a56;letter-spacing:.03em;margin:0 0 4px}
  input[type=email],input[type=text]{width:100%;font-size:15px;padding:12px 14px;border:1px solid #ddd3bd;border-radius:6px;margin-bottom:12px;box-sizing:border-box;font-family:inherit}
  input#otpCode{font-size:22px;letter-spacing:5px;text-align:center}
  label.nda{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;color:#6b6353;margin:0 0 16px;cursor:pointer}
  label.nda input{margin-top:2px;flex:0 0 auto}
  label.nda a{color:#a67f34}
  button.btn{display:block;width:100%;padding:14px 22px;background:#a67f34;color:#fffaf0;text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;border-radius:2px;border:none;cursor:pointer;font-family:inherit}
  button.btn:hover{background:#8f6d2c}
  button.btn:disabled{opacity:.5;cursor:default}
  .msg{margin-top:12px;font-size:12px;text-align:center}
  .msg.err{color:#b23b3b}
  .msg.ok{color:#2f7d4f}
  .step{display:block}
  .step.hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="cover-wrap"><img src="https://immonova-consulting.it/dossier/opportunity-34-de-cover.jpg" alt=""></div>
    <div class="card-body">
      <p class="kicker">IMMONOVA · Investment Book</p>
      <h1>Palazzo storico in centro storico Gallipoli</h1>

      <div class="step" id="stepEmail">
        <p class="lead">Um auf das vertrauliche Dossier zuzugreifen, geben Sie Ihre E-Mail-Adresse ein: Wir senden Ihnen einen Verifizierungscode, der 60 Minuten gültig ist.</p>
        <label class="field-label" for="otpName">Gesendet von (optional)</label>
        <input type="text" id="otpName" placeholder="Ihr Name oder der Name der Person, die Ihnen den Link geteilt hat" autocomplete="name">
        <input type="email" id="otpEmail" placeholder="Ihre E-Mail-Adresse" autocomplete="email">
        <label class="nda"><input type="checkbox" id="ndaCheck">Ich habe gelesen und akzeptiere die<a href="https://immonova-consulting.it/nda.html" target="_blank" rel="noopener">Vereinbarung zur Vertraulichkeit (NDA)</a></label>
        <button type="button" class="btn" id="sendCodeBtn" disabled>Code senden</button>
      </div>

      <div class="step hidden" id="stepCode">
        <p class="lead" id="codeStepLead"></p>
        <input type="text" id="otpCode" maxlength="6" inputmode="numeric" placeholder="______">
        <button type="button" class="btn" id="verifyCodeBtn">Überprüfen und herunterladen</button>
      </div>

      <div class="msg" id="otpMsg"></div>
    </div>
  </div>

<script>
(function(){
  var S = {"sendLabel":"Code senden","sendingLabel":"Wird gesendet...","sentNotice":"Code gesendet. Überprüfen Sie Ihre E-Mail (auch Spam) und geben Sie ihn hier ein.","codeLabel":"Verifizierungscode","verifyLabel":"Überprüfen und herunterladen","verifyingLabel":"Überprüfung läuft...","wrongCode":"Code ungültig.","expired":"Code abgelaufen, fordern Sie einen neuen an.","maxAttempts":"Zu viele falsche Versuche. Fordern Sie einen neuen Code an.","sendError":"Wir konnten den Code nicht senden. Bitte versuchen Sie es später erneut.","verifyError":"Fehler bei der Verifizierung, bitte versuchen Sie es erneut.","invalidEmail":"Bitte geben Sie eine gültige E-Mail-Adresse ein.","ndaRequired":"Sie müssen der Vereinbarung zur Vertraulichkeit zustimmen, um fortzufahren."};
  var FN_BASE = "https://bpzzmitmbavcmcasswbu.supabase.co/functions/v1";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwenptaXRtYmF2Y21jYXNzd2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDk1ODQsImV4cCI6MjA5NzM4NTU4NH0.SkPicFpfYe69rI0JmASqm-jif-Ov3gQ0Mu20UbrYawY";
  var PDF_URL = "https://bpzzmitmbavcmcasswbu.supabase.co/storage/v1/object/public/dossier-pdfs/opportunity-34/1792739711706_dossier_IMMONOVA_Palazzo_storico_in_centro_storico_Gallipoli_de.pdf";
  var OPPORTUNITY_ID = "34";
  var otpId = null;

  var stepEmail = document.getElementById("stepEmail");
  var stepCode = document.getElementById("stepCode");
  var msg = document.getElementById("otpMsg");
  var sendBtn = document.getElementById("sendCodeBtn");
  var verifyBtn = document.getElementById("verifyCodeBtn");
  var ndaCheck = document.getElementById("ndaCheck");
  var nameInput = document.getElementById("otpName");

  /* Automatico: se chi ha condiviso il link ha usato il pulsante "Copia link"/"Invia su
     WhatsApp" dell'admin, l'URL contiene già ?by=<email dell'admin loggato> (vedi
     dossierShareUrlForSending() in dossier-send.html). Lo leggiamo qui e precompiliamo da
     soli il campo "Inviato da": nessuno deve scrivere nulla a mano. Resta comunque
     modificabile per i link condivisi senza quel parametro (es. link più vecchi già in
     circolazione prima di questa modifica). */
  try{
    var byParam = new URLSearchParams(location.search).get("by");
    if(byParam && nameInput && !nameInput.value) nameInput.value = byParam;
  }catch(e){}

  ndaCheck.addEventListener("change", function(){ sendBtn.disabled = !ndaCheck.checked; });

  function fnHeaders(){
    return { "Content-Type": "application/json", "apikey": ANON_KEY, "Authorization": "Bearer " + ANON_KEY };
  }

  function setMsg(text, isErr){
    msg.textContent = text || "";
    msg.className = "msg" + (text ? (isErr ? " err" : " ok") : "");
  }

  function deviceMeta(){
    return {
      platform_hint: navigator.platform || null,
      screen: screen.width + "x" + screen.height,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
  }

  sendBtn.addEventListener("click", async function(){
    var name = document.getElementById("otpName").value.trim();
    var email = document.getElementById("otpEmail").value.trim();
    if(!ndaCheck.checked){ setMsg(S.ndaRequired, true); return; }
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      setMsg(S.invalidEmail, true);
      return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = S.sendingLabel;
    setMsg("", false);
    try{
      var res = await fetch(FN_BASE + "/otp-generate", {
        method: "POST",
        headers: fnHeaders(),
        body: JSON.stringify(Object.assign({
          purpose: "dossier", target_type: "opportunity", target_id: OPPORTUNITY_ID,
          recipient_email: email, recipient_name: name || null, target_pdf_url: PDF_URL, nda_accepted: true
        }, deviceMeta()))
      });
      var data = await res.json();
      if(res.ok && data && data.ok){
        otpId = data.otp_id;
        stepEmail.className = "step hidden";
        stepCode.className = "step";
        document.getElementById("codeStepLead").textContent = S.sentNotice;
        setMsg("", false);
      } else {
        setMsg(S.sendError, true);
        sendBtn.disabled = false;
        sendBtn.textContent = S.sendLabel;
      }
    }catch(e){
      setMsg(S.sendError, true);
      sendBtn.disabled = false;
      sendBtn.textContent = S.sendLabel;
    }
  });

  verifyBtn.addEventListener("click", async function(){
    var code = document.getElementById("otpCode").value.trim();
    if(!otpId || code.length !== 6){ setMsg(S.verifyError, true); return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = S.verifyingLabel;
    try{
      var res = await fetch(FN_BASE + "/otp-verify", {
        method: "POST",
        headers: fnHeaders(),
        body: JSON.stringify(Object.assign({ otp_id: otpId, code: code }, deviceMeta()))
      });
      var data = await res.json();
      if(res.ok && data && data.ok){
        setMsg("", false);
        location.href = FN_BASE + "/dossier-download?otp_id=" + encodeURIComponent(otpId);
      } else {
        var reasons = { wrong_code: S.wrongCode, expired: S.expired, max_attempts: S.maxAttempts };
        setMsg((data && reasons[data.reason]) || S.verifyError, true);
        verifyBtn.disabled = false;
        verifyBtn.textContent = S.verifyLabel;
      }
    }catch(e){
      setMsg(S.verifyError, true);
      verifyBtn.disabled = false;
      verifyBtn.textContent = S.verifyLabel;
    }
  });
})();
</script>
</body>
</html>
