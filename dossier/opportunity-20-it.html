<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Villa Speranza — Dossier IMMONOVA</title>
<meta name="description" content="Scarica il dossier immobiliare riservato di Villa Speranza.">
<meta property="og:type" content="website">
<meta property="og:title" content="Villa Speranza — Dossier IMMONOVA">
<meta property="og:description" content="Scarica il dossier immobiliare riservato.">
<meta property="og:image" content="https://immonova-consulting.it/dossier/opportunity-20-it-cover.jpg">
<meta property="og:image:secure_url" content="https://immonova-consulting.it/dossier/opportunity-20-it-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Villa Speranza — Dossier IMMONOVA">
<meta name="twitter:image" content="https://immonova-consulting.it/dossier/opportunity-20-it-cover.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;background:#f7f1e6;color:#4a3c1d;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
  .card{max-width:480px;width:100%;background:#fffaf0;border:1px solid rgba(166,127,52,.25);border-radius:4px;overflow:hidden;box-shadow:0 24px 60px rgba(127,100,48,.12)}
  .card .cover-wrap{width:100%;aspect-ratio:1.6;overflow:hidden;background:#efe6d2}
  .card .cover-wrap img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
  .card-body{padding:28px}
  .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a67f34;font-weight:600;margin:0 0 8px}
  h1{font-size:20px;margin:0 0 18px;line-height:1.3}
  p.lead{font-size:13px;line-height:1.5;color:#6b6353;margin:0 0 16px}
  input[type=email],input[type=text]{width:100%;font-size:15px;padding:12px 14px;border:1px solid #ddd3bd;border-radius:6px;margin-bottom:12px;box-sizing:border-box;font-family:inherit}
  input#otpCode{font-size:22px;letter-spacing:5px;text-align:center}
  label.nda{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;color:#6b6353;margin:0 0 16px;cursor:pointer}
  label.nda input{margin-top:2px;flex:0 0 auto}
  label.nda a{color:#a67f34}
  button.btn{display:block;width:100%;padding:14px 22px;background:#a67f34;color:#fffaf0;text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;border-radius:2px;border:none;cursor:pointer;font-family:inherit}
  button.btn:hover{background:#8f6d2c}
  button.btn:disabled{opacity:.5;cursor:default}
  .msg{margin-top:12px;font-size:12px;text-align:center}
  .msg.err{color:#b23b3b}
  .msg.ok{color:#2f7d4f}
  .step{display:block}
  .step.hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="cover-wrap"><img src="https://immonova-consulting.it/dossier/opportunity-20-it-cover.jpg" alt=""></div>
    <div class="card-body">
      <p class="kicker">IMMONOVA · Investment Book</p>
      <h1>Villa Speranza</h1>

      <div class="step" id="stepEmail">
        <p class="lead">Per accedere al dossier riservato, inserisci la tua email: ti invieremo un codice di verifica valido 60 minuti.</p>
        <input type="email" id="otpEmail" placeholder="La tua email" autocomplete="email">
        <label class="nda"><input type="checkbox" id="ndaCheck">Ho letto e accetto l&#039;<a href="https://immonova-consulting.it/nda.html" target="_blank" rel="noopener">accordo di riservatezza (NDA)</a></label>
        <button type="button" class="btn" id="sendCodeBtn" disabled>Invia codice</button>
      </div>

      <div class="step hidden" id="stepCode">
        <p class="lead" id="codeStepLead"></p>
        <input type="text" id="otpCode" maxlength="6" inputmode="numeric" placeholder="______">
        <button type="button" class="btn" id="verifyCodeBtn">Verifica e scarica</button>
      </div>

      <div class="msg" id="otpMsg"></div>
    </div>
  </div>

<script>
(function(){
  var S = {"sendLabel":"Invia codice","sendingLabel":"Invio in corso...","sentNotice":"Codice inviato. Controlla la tua email (anche spam) e inseriscilo qui sotto.","codeLabel":"Codice di verifica","verifyLabel":"Verifica e scarica","verifyingLabel":"Verifica in corso...","wrongCode":"Codice errato.","expired":"Codice scaduto, richiedine uno nuovo.","maxAttempts":"Troppi tentativi errati. Richiedi un nuovo codice.","sendError":"Non siamo riusciti a inviare il codice. Riprova tra poco.","verifyError":"Errore durante la verifica, riprova.","invalidEmail":"Inserisci un indirizzo email valido.","ndaRequired":"Devi accettare l'accordo di riservatezza per continuare."};
  var FN_BASE = "https://bpzzmitmbavcmcasswbu.supabase.co/functions/v1";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwenptaXRtYmF2Y21jYXNzd2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MDk1ODQsImV4cCI6MjA5NzM4NTU4NH0.SkPicFpfYe69rI0JmASqm-jif-Ov3gQ0Mu20UbrYawY";
  var PDF_URL = "https://bpzzmitmbavcmcasswbu.supabase.co/storage/v1/object/public/dossier-pdfs/opportunity-20/1791924135763_dossier_IMMONOVA_Villa_Speranza_it.pdf";
  var OPPORTUNITY_ID = "20";
  var otpId = null;

  var stepEmail = document.getElementById("stepEmail");
  var stepCode = document.getElementById("stepCode");
  var msg = document.getElementById("otpMsg");
  var sendBtn = document.getElementById("sendCodeBtn");
  var verifyBtn = document.getElementById("verifyCodeBtn");
  var ndaCheck = document.getElementById("ndaCheck");

  ndaCheck.addEventListener("change", function(){ sendBtn.disabled = !ndaCheck.checked; });

  function fnHeaders(){
    return { "Content-Type": "application/json", "apikey": ANON_KEY, "Authorization": "Bearer " + ANON_KEY };
  }

  function setMsg(text, isErr){
    msg.textContent = text || "";
    msg.className = "msg" + (text ? (isErr ? " err" : " ok") : "");
  }

  function deviceMeta(){
    return {
      platform_hint: navigator.platform || null,
      screen: screen.width + "x" + screen.height,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
  }

  sendBtn.addEventListener("click", async function(){
    var email = document.getElementById("otpEmail").value.trim();
    if(!ndaCheck.checked){ setMsg(S.ndaRequired, true); return; }
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      setMsg(S.invalidEmail, true);
      return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = S.sendingLabel;
    setMsg("", false);
    try{
      var res = await fetch(FN_BASE + "/otp-generate", {
        method: "POST",
        headers: fnHeaders(),
        body: JSON.stringify(Object.assign({
          purpose: "dossier", target_type: "opportunity", target_id: OPPORTUNITY_ID,
          recipient_email: email, target_pdf_url: PDF_URL, nda_accepted: true
        }, deviceMeta()))
      });
      var data = await res.json();
      if(res.ok && data && data.ok){
        otpId = data.otp_id;
        stepEmail.className = "step hidden";
        stepCode.className = "step";
        document.getElementById("codeStepLead").textContent = S.sentNotice;
        setMsg("", false);
      } else {
        setMsg(S.sendError, true);
        sendBtn.disabled = false;
        sendBtn.textContent = S.sendLabel;
      }
    }catch(e){
      setMsg(S.sendError, true);
      sendBtn.disabled = false;
      sendBtn.textContent = S.sendLabel;
    }
  });

  verifyBtn.addEventListener("click", async function(){
    var code = document.getElementById("otpCode").value.trim();
    if(!otpId || code.length !== 6){ setMsg(S.verifyError, true); return; }
    verifyBtn.disabled = true;
    verifyBtn.textContent = S.verifyingLabel;
    try{
      var res = await fetch(FN_BASE + "/otp-verify", {
        method: "POST",
        headers: fnHeaders(),
        body: JSON.stringify(Object.assign({ otp_id: otpId, code: code }, deviceMeta()))
      });
      var data = await res.json();
      if(res.ok && data && data.ok){
        setMsg("", false);
        location.href = FN_BASE + "/dossier-download?otp_id=" + encodeURIComponent(otpId);
      } else {
        var reasons = { wrong_code: S.wrongCode, expired: S.expired, max_attempts: S.maxAttempts };
        setMsg((data && reasons[data.reason]) || S.verifyError, true);
        verifyBtn.disabled = false;
        verifyBtn.textContent = S.verifyLabel;
      }
    }catch(e){
      setMsg(S.verifyError, true);
      verifyBtn.disabled = false;
      verifyBtn.textContent = S.verifyLabel;
    }
  });
})();
</script>
</body>
</html>
