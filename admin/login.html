<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMONOVA Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}

body{
  overflow:hidden;
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}

.background{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}

.background::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.3;
}

.background::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 20%,rgba(120,90,45,.08),transparent 16%),
    radial-gradient(circle at 66% 70%,rgba(120,90,45,.06),transparent 18%),
    repeating-radial-gradient(circle at center,rgba(120,90,45,.035) 0 1px,transparent 1px 4px);
  opacity:.06;
  mix-blend-mode:multiply;
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:420px;
  max-width:90vw;
  padding:52px 46px;
  text-align:center;
  border:1px solid rgba(165,129,57,.18);
  background:rgba(255,255,255,.08);
}

.logo{
  font-size:28px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a58139;
  margin-bottom:12px;
}

.subtitle{
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:40px;
}

input{
  width:100%;
  padding:15px 16px;
  margin-bottom:16px;
  border:1px solid rgba(165,129,57,.25);
  background:rgba(255,252,244,.35);
  color:#7f6430;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:rgba(127,100,48,.55);
}

.password-field{
  position:relative;
  margin-bottom:16px;
}

.password-field input{
  margin-bottom:0;
  padding-right:46px;
}

.toggle-password{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:44px;
  border:none !important;
  background:transparent !important;
  box-shadow:none !important;
  outline:none !important;
  backdrop-filter:none !important;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a58139;
  padding:0;
  margin:0;
}

.toggle-password:hover,
.toggle-password:focus,
.toggle-password:active{
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  outline:none !important;
}
.toggle-password svg{
  width:19px;
  height:19px;
}

button{
  width:100%;
  margin-top:8px;
  padding:14px 24px;
  border:1px solid rgba(165,129,57,.42);
  background:rgba(255,252,244,.22);
  backdrop-filter:blur(8px);
  color:#a58139;
  text-transform:uppercase;
  font-size:11px;
  font-weight:500;
  letter-spacing:.24em;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:rgba(255,252,244,.38);
}

.error{
  margin-top:18px;
  min-height:18px;
  color:#9c2f2f;
  font-size:13px;
}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">
  <div class="card">

    <div class="logo">IMMONOVA</div>
    <div class="subtitle">Admin Access</div>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required>
      <div class="password-field">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="password" aria-label="Mostra password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" id="loginBtn">Login</button>
    </form>

    <div id="error" class="error"></div>

    <a href="#" id="recoverLink" style="display:block;margin-top:22px;font-size:11px;letter-spacing:.12em;color:#a58139;text-decoration:underline;cursor:pointer">Recupera credenziali</a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("error");
  const loginBtn = document.getElementById("loginBtn");
  const recoverLink = document.getElementById("recoverLink");

  /* Occhio mostra/nascondi password: semplice toggle del type dell'input. */
  var EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_SLASH = '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 1-3.1 3.8M6.2 6.2A13.7 13.7 0 0 0 1 12s4 7 11 7a10.6 10.6 0 0 0 4.2-.85"/>';

  document.querySelectorAll(".toggle-password").forEach(function(btn){
    btn.addEventListener("click", function(){
      var input = document.getElementById(btn.getAttribute("data-target"));
      var svg = btn.querySelector("svg");
      var showing = input.type === "text";
      input.type = showing ? "password" : "text";
      svg.innerHTML = showing ? EYE_OPEN : EYE_SLASH;
      btn.setAttribute("aria-label", showing ? "Mostra password" : "Nascondi password");
    });
  });

  /* Registra l'accesso in immonova_access_logs. Non deve MAI bloccare il login: se la
     tabella non esiste ancora (migrazione SQL non eseguita) o la scrittura fallisce per
     qualsiasi motivo, l'errore viene solo loggato in console e l'utente entra comunque. */
  async function logAccess(user, profile){
    try{
      await client.from("immonova_access_logs").insert({
        user_id: user.id,
        email: user.email || null,
        full_name: (profile && profile.full_name) || null,
        role: (profile && profile.role) || null,
        user_agent: navigator.userAgent || null
      });
    }catch(e){
      console.warn("Registrazione accesso non riuscita (non bloccante):", e);
    }
  }

  /* "Recupera credenziali": usa il sistema di reset password nativo di Supabase (invia
     un'email con un link sicuro, senza far girare password in chiaro). L'utente arriva su
     set-password.html già con una sessione di recovery valida grazie al link ricevuto. */
  recoverLink.addEventListener("click", async function(e){
    e.preventDefault();
    errorBox.style.color = "#9c2f2f";
    errorBox.textContent = "";

    const email = document.getElementById("email").value.trim();

    if(!email){
      errorBox.textContent = "Inserisci la tua email nel campo qui sopra, poi clicca di nuovo su \u201cRecupera credenziali\u201d.";
      return;
    }

    recoverLink.textContent = "Invio in corso...";

    const redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, "set-password.html");

    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });

    recoverLink.textContent = "Recupera credenziali";

    if(error){
      errorBox.textContent = error.message;
      return;
    }

    errorBox.style.color = "#4f7f45";
    errorBox.textContent = "Ti abbiamo inviato una email con il link per impostare una nuova password.";
  });

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    errorBox.textContent = "";
    loginBtn.textContent = "Loading...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      loginBtn.textContent = "Login";
      errorBox.textContent = error.message;
      return;
    }

    let profile = null;

    if (data && data.user) {
      try{
        const profileResult = await client
          .from("profiles")
          .select("full_name,role,must_change_password,active")
          .eq("id", data.user.id)
          .single();
        profile = profileResult.data || null;
      }catch(e){
        console.warn("Lettura profilo non riuscita (non bloccante):", e);
      }

      /* Se l'admin ha disattivato questo utente (colonna "active" = false su profiles), la
         password è comunque corretta -- il blocco va fatto qui esplicitamente, subito dopo il
         login riuscito, altrimenti "Non attivo" in users.html resta solo un'etichetta senza
         nessun effetto reale sull'accesso. Se la colonna non esiste ancora (migrazione non
         eseguita), profile.active è undefined e l'accesso resta consentito come prima. */
      if(profile && profile.active === false){
        await client.auth.signOut();
        loginBtn.textContent = "Login";
        errorBox.textContent = "Questo account è stato disattivato. Contatta un amministratore.";
        return;
      }

      await logAccess(data.user, profile);
    }

    /* Se l'admin ha creato questo account con una password temporanea (must_change_password
       = true), l'utente viene forzato a impostarne una propria prima di poter usare il
       pannello. Se la colonna non esiste ancora (migrazione non eseguita), profile.must_change_password
       è undefined e si va normalmente in dashboard. */
    if(profile && profile.must_change_password === true){
      window.location.href = "set-password.html?forced=1";
      return;
    }

    window.location.href = "dashboard.html";
  });
});
</script>

</body>
</html>
