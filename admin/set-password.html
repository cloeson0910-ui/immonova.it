<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMONOVA Admin | Imposta Password</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}

body{
  overflow:hidden;
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}

.background{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}

.background::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.3;
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:440px;
  max-width:90vw;
  padding:52px 46px;
  text-align:center;
  border:1px solid rgba(165,129,57,.18);
  background:rgba(255,255,255,.08);
}

.logo{
  font-size:28px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a58139;
  margin-bottom:12px;
}

.subtitle{
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:16px;
}

.intro{
  font-size:13px;
  line-height:1.7;
  color:#7f6430;
  margin-bottom:32px;
}

label{
  display:block;
  text-align:left;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:15px 16px;
  margin-bottom:16px;
  border:1px solid rgba(165,129,57,.25);
  background:rgba(255,252,244,.35);
  color:#7f6430;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:rgba(127,100,48,.55);
}

.hint{
  text-align:left;
  font-size:11px;
  color:#8f7643;
  margin:-8px 0 16px;
  line-height:1.5;
}

button{
  width:100%;
  margin-top:8px;
  padding:14px 24px;
  border:1px solid rgba(165,129,57,.42);
  background:rgba(255,252,244,.22);
  backdrop-filter:blur(8px);
  color:#a58139;
  text-transform:uppercase;
  font-size:11px;
  font-weight:500;
  letter-spacing:.24em;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:rgba(255,252,244,.38);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  margin-top:18px;
  min-height:18px;
  font-size:13px;
  line-height:1.6;
}

.error{color:#9c2f2f}
.success{color:#4f7f45}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">
  <div class="card">

    <div class="logo">IMMONOVA</div>
    <div class="subtitle" id="subtitleText">Imposta Password</div>
    <p class="intro" id="introText">
      Scegli una nuova password per il tuo account. Dovrai usarla per accedere da ora in poi.
    </p>

    <form id="setPasswordForm">
      <label for="newPassword">Nuova password</label>
      <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
      <div class="hint">Almeno 6 caratteri.</div>

      <label for="confirmPassword">Conferma nuova password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>

      <button type="submit" id="submitBtn">Salva Password</button>
    </form>

    <div id="message" class="message"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("setPasswordForm");
  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");
  const subtitleText = document.getElementById("subtitleText");
  const introText = document.getElementById("introText");

  function setMessage(text, type){
    messageBox.className = "message " + (type || "");
    messageBox.textContent = text || "";
  }

  /* Questa pagina serve a DUE flussi distinti, riconosciuti così:
     1) Link "Recupera credenziali" -> Supabase aggiunge parametri di recovery all'URL
        (type=recovery) e la sessione viene stabilita automaticamente dalla libreria
        supabase-js leggendo l'hash dell'URL. In questo caso non serve login preventivo.
     2) Redirect automatico da login.html perché profiles.must_change_password = true ->
        l'utente ha GIA' una sessione valida (ha appena fatto login con la password
        temporanea), quindi va semplicemente verificato che la sessione esista. */
  const { data:{ session } } = await client.auth.getSession();

  if(!session){
    setMessage("Link non valido o scaduto. Richiedi un nuovo link da \u201cRecupera credenziali\u201d nella pagina di login.", "error");
    form.style.display = "none";
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const isForced = params.get("forced") === "1";

  if(isForced){
    subtitleText.textContent = "Primo Accesso";
    introText.textContent = "Per motivi di sicurezza devi impostare una tua password personale prima di continuare.";
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    setMessage("", "");

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(newPassword.length < 6){
      setMessage("La password deve avere almeno 6 caratteri.", "error");
      return;
    }

    if(newPassword !== confirmPassword){
      setMessage("Le due password non coincidono.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Salvataggio...";

    const { error:updateError } = await client.auth.updateUser({ password:newPassword });

    if(updateError){
      submitBtn.disabled = false;
      submitBtn.textContent = "Salva Password";
      setMessage(updateError.message, "error");
      return;
    }

    /* Se l'utente arrivava dal flusso "primo accesso obbligato", spegne il flag così
       non gli viene richiesto di nuovo ai prossimi login. Se profiles.must_change_password
       non esiste ancora (migrazione non eseguita), l'errore viene ignorato: la password
       è comunque stata cambiata con successo, che è la cosa che conta. */
    try{
      const { data:{ user } } = await client.auth.getUser();
      if(user){
        await client.from("profiles").update({ must_change_password:false }).eq("id", user.id);
      }
    }catch(e){
      console.warn("Aggiornamento must_change_password non riuscito (non bloccante):", e);
    }

    setMessage("Password aggiornata correttamente. Reindirizzamento...", "success");

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1200);
  });
});
</script>

</body>
</html>
