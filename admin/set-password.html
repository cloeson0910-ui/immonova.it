<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMONOVA Admin | Imposta Password</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}

body{
  overflow:hidden;
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}

.background{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}

.background::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.3;
}

.container{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:440px;
  max-width:90vw;
  padding:52px 46px;
  text-align:center;
  border:1px solid rgba(165,129,57,.18);
  background:rgba(255,255,255,.08);
}

.logo{
  font-size:28px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a58139;
  margin-bottom:12px;
}

.subtitle{
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:16px;
}

.intro{
  font-size:13px;
  line-height:1.7;
  color:#7f6430;
  margin-bottom:32px;
}

label{
  display:block;
  text-align:left;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#a58139;
  margin-bottom:7px;
}

.password-field{
  position:relative;
  margin-bottom:16px;
}

.password-field input{
  margin-bottom:0;
  padding-right:46px;
}

.toggle-password{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:44px;
  border:0;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a58139;
  padding:0;
}

.toggle-password svg{
  width:19px;
  height:19px;
}

input{
  width:100%;
  padding:15px 16px;
  margin-bottom:16px;
  border:1px solid rgba(165,129,57,.25);
  background:rgba(255,252,244,.35);
  color:#7f6430;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:rgba(127,100,48,.55);
}

.hint{
  text-align:left;
  font-size:11px;
  color:#8f7643;
  margin:-8px 0 16px;
  line-height:1.5;
}

button[type="submit"]{
  width:100%;
  margin-top:8px;
  padding:14px 24px;
  border:1px solid rgba(165,129,57,.42);
  background:rgba(255,252,244,.22);
  backdrop-filter:blur(8px);
  color:#a58139;
  text-transform:uppercase;
  font-size:11px;
  font-weight:500;
  letter-spacing:.24em;
  cursor:pointer;
  transition:.3s;
}

button[type="submit"]:hover{
  background:rgba(255,252,244,.38);
}

button[type="submit"]:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  margin-top:18px;
  min-height:18px;
  font-size:13px;
  line-height:1.6;
}

.error{color:#9c2f2f}
.success{color:#4f7f45}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">
  <div class="card">

    <div class="logo">IMMONOVA</div>
    <div class="subtitle" id="subtitleText">Imposta Password</div>
    <p class="intro" id="introText">
      Scegli una nuova password per il tuo account. Dovrai usarla per accedere da ora in poi.
    </p>

    <form id="setPasswordForm">
      <label for="newPassword">Nuova password</label>
      <div class="password-field">
        <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
        <button type="button" class="toggle-password" data-target="newPassword" aria-label="Mostra password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="hint">Almeno 6 caratteri.</div>

      <label for="confirmPassword">Conferma nuova password</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostra password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" id="submitBtn">Salva Password</button>
    </form>

    <div id="message" class="message"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("setPasswordForm");
  const messageBox = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");
  const subtitleText = document.getElementById("subtitleText");
  const introText = document.getElementById("introText");

  function setMessage(text, type){
    messageBox.className = "message " + (type || "");
    messageBox.textContent = text || "";
  }

  /* Occhio mostra/nascondi password: semplice toggle del type dell'input, nessuna logica
     legata al salvataggio. EYE_OPEN/EYE_SLASH sono i due tracciati SVG scambiati al click. */
  var EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_SLASH = '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 1-3.1 3.8M6.2 6.2A13.7 13.7 0 0 0 1 12s4 7 11 7a10.6 10.6 0 0 0 4.2-.85"/>';

  document.querySelectorAll(".toggle-password").forEach(function(btn){
    btn.addEventListener("click", function(){
      var input = document.getElementById(btn.getAttribute("data-target"));
      var svg = btn.querySelector("svg");
      var showing = input.type === "text";
      input.type = showing ? "password" : "text";
      svg.innerHTML = showing ? EYE_OPEN : EYE_SLASH;
      btn.setAttribute("aria-label", showing ? "Mostra password" : "Nascondi password");
    });
  });

  /* Questa pagina serve a DUE flussi distinti, riconosciuti così:
     1) Link "Recupera credenziali" -> Supabase aggiunge parametri di recovery all'URL
        (type=recovery) e la sessione viene stabilita automaticamente dalla libreria
        supabase-js leggendo l'hash dell'URL. In questo caso non serve login preventivo.
     2) Redirect automatico da login.html perché profiles.must_change_password = true ->
        l'utente ha GIA' una sessione valida (ha appena fatto login con la password
        temporanea), quindi va semplicemente verificato che la sessione esista. */
  const { data:{ session } } = await client.auth.getSession();

  if(!session){
    setMessage("Link non valido o scaduto. Richiedi un nuovo link da \u201cRecupera credenziali\u201d nella pagina di login.", "error");
    form.style.display = "none";
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const isForced = params.get("forced") === "1";

  if(isForced){
    subtitleText.textContent = "Primo Accesso";
    introText.textContent = "Per motivi di sicurezza devi impostare una tua password personale prima di continuare.";
  }

  /* Lezione riutilizzata da users.html: su risposta non-2xx di una edge function, il
     messaggio vero va letto da result.error.context, non da result.error.message. */
  async function extractEdgeFunctionErrorMessage(error){
    try{
      if(error && error.context && typeof error.context.text==="function"){
        var raw=await error.context.text();
        try{ var parsed=JSON.parse(raw); return parsed.error||parsed.message||raw||error.message; }
        catch(parseErr){ return raw||error.message; }
      }
    }catch(e){}
    return (error&&error.message)||String(error);
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    setMessage("", "");

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(newPassword.length < 6){
      setMessage("La password deve avere almeno 6 caratteri.", "error");
      return;
    }

    if(newPassword !== confirmPassword){
      setMessage("Le due password non coincidono.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Salvataggio...";

    const { error:updateError } = await client.auth.updateUser({ password:newPassword });

    if(updateError){
      submitBtn.disabled = false;
      submitBtn.textContent = "Salva Password";
      setMessage(updateError.message, "error");
      return;
    }

    /* BUG RISOLTO: prima questa scrittura andava diretta dal browser su "profiles" e falliva
       silenziosamente se le regole di sicurezza (RLS) non permettevano a un utente normale di
       modificare la propria riga -- la password cambiava comunque, ma il flag restava acceso
       per sempre, rimandando l'utente qui ad ogni accesso successivo. Ora passa da una edge
       function con permessi pieni (clear-must-change-password), che non dipende dalle RLS. */
    try{
      const { data:{ session:currentSession } } = await client.auth.getSession();
      const result = await client.functions.invoke("clear-must-change-password", {});

      if(result.error){
        var msg = await extractEdgeFunctionErrorMessage(result.error);
        console.warn("Spegnimento must_change_password non riuscito:", msg);
      }
    }catch(e){
      console.warn("Spegnimento must_change_password non riuscito:", e);
    }

    setMessage("Password aggiornata correttamente. Reindirizzamento...", "success");

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1200);
  });
});
</script>

</body>
</html>
