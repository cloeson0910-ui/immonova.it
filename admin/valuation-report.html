<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relazione di Valutazione | IMMONOVA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%}
body{
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  color:#4a3c1f;
  line-height:1.6;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.20) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.19) 87px,transparent 90px);
  background-size:230px 199px;
  opacity:.25;
}
.toolbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(244,236,223,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(166,127,52,.15);
}
.toolbar-left{display:flex;gap:12px;align-items:center}
.toolbar a,.toolbar button{
  padding:11px 18px;
  border:1px solid rgba(166,127,52,.32);
  background:rgba(255,255,255,.25);
  color:#a67f34;
  text-decoration:none;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:.12em;
  cursor:pointer;
  font-family:inherit;
}
.print-btn{background:#a67f34 !important;color:#fffaf0 !important}
.print-btn:hover{background:#8f6c2c !important}

.page{max-width:900px;margin:0 auto;padding:0 40px 90px}

.cover{text-align:center;padding:70px 20px 50px}
.cover-logo{font-size:36px;font-weight:300;letter-spacing:.4em;color:#a67f34;margin-bottom:12px}
.cover-sub{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#a58139;margin-bottom:44px}
.cover-kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#9a793c;margin-bottom:16px}
.cover-title{font-size:32px;font-weight:200;color:#4a3c1f;max-width:640px;margin:0 auto 12px;line-height:1.3}
.cover-meta{font-size:13px;color:#8f7643}

.section{margin-top:54px;page-break-inside:avoid}
.section-kicker{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#a58139;margin-bottom:8px}
.section-title{font-size:22px;font-weight:300;color:#a67f34;margin-bottom:18px}

.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.info-item{border-top:1px solid rgba(166,127,52,.18);padding-top:10px}
.info-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#a58139;margin-bottom:6px}
.info-value{font-size:14px;color:#4a3c1f}

.value-box{
  margin-top:16px;
  padding:36px;
  text-align:center;
  background:rgba(166,127,52,.10);
  border:1px solid rgba(166,127,52,.28);
}
.value-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8f7643;margin-bottom:12px}
.value-range{font-size:34px;color:#a67f34;font-weight:300}
.value-per-sqm{font-size:12px;color:#8f7643;margin-top:10px}

.method-text{font-size:13.5px;color:#5a4a2a;margin-bottom:18px;max-width:680px}

.comp-table{width:100%;border-collapse:collapse;margin-top:10px}
.comp-table th{
  text-align:left;
  padding:10px 12px;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#a58139;
  border-bottom:1px solid rgba(166,127,52,.25);
}
.comp-table td{
  padding:10px 12px;
  font-size:12.5px;
  color:#5a4a2a;
  border-bottom:1px solid rgba(166,127,52,.10);
}

.disclaimer-box{
  margin-top:16px;
  padding:20px 24px;
  background:rgba(166,127,52,.06);
  border:1px solid rgba(166,127,52,.18);
  font-size:12px;
  color:#8f7643;
  line-height:1.7;
}

.cadastral-note{
  margin-bottom:16px;
  padding:16px 20px;
  background:rgba(143,91,40,.06);
  border-left:3px solid rgba(143,91,40,.4);
  font-size:12.5px;
  color:#5a4a2a;
  line-height:1.7;
}

.empty-state{
  padding:30px;
  text-align:center;
  color:#8f7643;
  font-size:13px;
  border:1px dashed rgba(166,127,52,.3);
}

.footer-note{margin-top:60px;text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a58139}

@media print{
  .toolbar{display:none}
  body::before,body::after{display:none}
  body{background:#fff}
  .page{max-width:none;padding:0 20mm}
  .section{margin-top:14mm;page-break-inside:avoid}
  .cover{padding:20mm 0 14mm}
}

@media(max-width:700px){
  .page{padding:0 20px 60px}
  .info-grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column;gap:10px;padding:14px 20px}
}
</style>
</head>

<body>

<div class="toolbar">
  <div class="toolbar-left">
    <a href="valuations.html">← Torna alle valutazioni</a>
    <a href="valuation-form.html" id="editLink">Modifica dati</a>
  </div>
  <button class="print-btn" onclick="window.print()">Stampa / Salva PDF</button>
</div>

<div class="page" id="pageContent">
  <div class="empty-state" style="margin-top:60px">Caricamento...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const params = new URLSearchParams(window.location.search);
const valuationId = params.get("id");
const pageContent = document.getElementById("pageContent");

function escapeHTML(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

function formatEuro(n){
  if(n === null || n === undefined) return "—";
  return new Intl.NumberFormat("it-IT").format(Math.round(n)) + " €";
}

function formatDate(v){
  if(!v) return "";
  try{ return new Date(v).toLocaleDateString("it-IT",{day:"2-digit",month:"long",year:"numeric"}); }
  catch(e){ return v; }
}

function infoItem(label, value){
  if(value === null || value === undefined || value === "") return "";
  return '<div class="info-item"><div class="info-label">' + escapeHTML(label) + '</div><div class="info-value">' + escapeHTML(value) + '</div></div>';
}

async function checkAuth(){
  const { data:{ session } } = await client.auth.getSession();
  if(!session){ window.location.href = "login.html"; return false; }
  return true;
}

async function loadAndRender(){
  if(!valuationId){
    pageContent.innerHTML = '<div class="empty-state" style="margin-top:60px">Nessuna valutazione selezionata.</div>';
    return;
  }

  document.getElementById("editLink").href = "valuation-form.html?id=" + encodeURIComponent(valuationId);

  var result = await client.from("immonova_property_valuations").select("*").eq("id", valuationId).single();
  if(result.error || !result.data){
    pageContent.innerHTML = '<div class="empty-state" style="margin-top:60px">Valutazione non trovata.</div>';
    return;
  }

  var v = result.data;
  var hasEstimate = v.estimated_value_min || v.estimated_value_max;
  var snap = v.comparables_snapshot || {};
  var internalComps = Array.isArray(snap.internal) ? snap.internal : [];

  var propertyMeta = [v.municipality, v.province, v.region].filter(Boolean).join(", ");

  var html = '';

  // Copertina
  html += '<div class="cover">'
    + '<div class="cover-logo">IMMONOVA</div>'
    + '<div class="cover-sub">Off Market · Consulting</div>'
    + '<div class="cover-kicker">Relazione di Valutazione Immobiliare</div>'
    + '<div class="cover-title">' + escapeHTML(v.property_title || (v.category || "Immobile") + ", " + (v.municipality || "")) + '</div>'
    + '<div class="cover-meta">' + escapeHTML(propertyMeta) + (v.created_at ? ' · Preparata il ' + escapeHTML(formatDate(v.created_at)) : '') + '</div>'
    + '</div>';

  // Riepilogo immobile
  html += '<div class="section">'
    + '<div class="section-kicker">L\'Immobile</div>'
    + '<div class="section-title">Caratteristiche</div>'
    + '<div class="info-grid">'
    + infoItem("Categoria", v.category)
    + infoItem("Indirizzo", v.address)
    + infoItem("Comune", v.municipality)
    + infoItem("Superficie interna", v.internal_size ? v.internal_size + " mq" : "")
    + infoItem("Superficie terreno", v.land_size ? v.land_size + " mq" : "")
    + infoItem("Camere", v.bedrooms)
    + infoItem("Bagni", v.bathrooms)
    + infoItem("Anno costruzione", v.construction_year)
    + infoItem("Classe energetica", v.energy_class)
    + infoItem("Stato", v.property_condition)
    + '</div>'
    + '</div>';

  // Valore stimato
  html += '<div class="section">'
    + '<div class="section-kicker">La Stima</div>'
    + '<div class="section-title">Valore di Mercato Stimato</div>';

  if(hasEstimate){
    html += '<div class="value-box">'
      + '<div class="value-label">Intervallo di valore stimato</div>'
      + '<div class="value-range">' + formatEuro(v.estimated_value_min) + ' – ' + formatEuro(v.estimated_value_max) + '</div>'
      + (v.estimated_value_per_sqm ? '<div class="value-per-sqm">' + formatEuro(v.estimated_value_per_sqm) + ' / mq (media ponderata)</div>' : '')
      + '</div>';
  }else{
    html += '<div class="empty-state">Valutazione non ancora calcolata per questo immobile.</div>';
  }
  html += '</div>';

  // Metodologia
  html += '<div class="section">'
    + '<div class="section-kicker">Il Metodo</div>'
    + '<div class="section-title">Come È Stata Calcolata</div>'
    + '<p class="method-text">La stima combina due fonti indipendenti: le opportunità IMMONOVA già pubblicate nella stessa zona e categoria, e i dati di mercato pubblici disponibili per l\'area. Il metodo è comparativo: si osservano transazioni e proposte simili, se ne ricava un valore medio al metro quadro, e lo si applica alla superficie dell\'immobile.</p>';

  if(snap.internal_price_per_sqm || snap.market_price_per_sqm){
    html += '<div class="info-grid" style="margin-bottom:20px">'
      + infoItem("Media opportunità IMMONOVA comparabili", snap.internal_price_per_sqm ? formatEuro(snap.internal_price_per_sqm) + "/mq (" + internalComps.length + " annunci)" : "Nessun dato disponibile")
      + infoItem("Dato di mercato pubblico (zona)", snap.market_price_per_sqm ? formatEuro(snap.market_price_per_sqm) + "/mq" : "Nessun dato disponibile")
      + '</div>';
  }

  if(internalComps.length){
    html += '<table class="comp-table"><thead><tr><th>Opportunità comparabile</th><th>€/mq</th></tr></thead><tbody>'
      + internalComps.map(function(c){
          return '<tr><td>' + escapeHTML(c.title || ("Opportunità #" + c.id)) + '</td><td>' + formatEuro(c.pricePerSqm) + '</td></tr>';
        }).join("")
      + '</tbody></table>';
  }
  html += '</div>';

  // Dati catastali (separati)
  var hasCadastral = v.cadastral_category || v.cadastral_income || v.cadastral_surface || v.cadastral_sheet;
  if(hasCadastral){
    html += '<div class="section">'
      + '<div class="section-kicker">Riferimento Fiscale</div>'
      + '<div class="section-title">Dati Catastali</div>'
      + '<div class="cadastral-note">Il valore catastale è un dato fiscale, utilizzato per il calcolo di imposte e tasse: è per natura distinto dal valore di mercato riportato sopra, e i due non vanno confusi tra loro.</div>'
      + '<div class="info-grid">'
      + infoItem("Comune catastale", v.cadastral_municipality)
      + infoItem("Categoria catastale", v.cadastral_category)
      + infoItem("Rendita catastale", v.cadastral_income ? formatEuro(v.cadastral_income) : "")
      + infoItem("Superficie catastale", v.cadastral_surface ? v.cadastral_surface + " mq" : "")
      + infoItem("Foglio", v.cadastral_sheet)
      + infoItem("Particella", v.cadastral_parcel)
      + infoItem("Subalterno", v.cadastral_subalterno)
      + '</div>'
      + '</div>';
  }

  // Disclaimer
  html += '<div class="section">'
    + '<div class="disclaimer-box">Questa relazione è una stima indicativa basata su dati comparativi e di mercato disponibili al momento della sua preparazione. Non costituisce una perizia tecnica formale né sostituisce la valutazione di un tecnico abilitato. Il valore di un immobile può variare in base a fattori non rilevabili a distanza (stato di conservazione interno, vincoli specifici, trattative di mercato).</div>'
    + '</div>';

  html += '<div class="footer-note">IMMONOVA · Off Market Consulting</div>';

  pageContent.innerHTML = html;
}

(async function init(){
  if(await checkAuth()){
    await loadAndRender();
  }
})();
</script>

</body>
</html>
