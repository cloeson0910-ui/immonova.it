<!DOCTYPE html>
<html lang="it">
<head>
<link rel="stylesheet" href="../css/immonova-text-theme.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2b2416">
<title>IMMONOVA | Giornata</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#46371a;min-height:100vh}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px);background-size:230px 199px;opacity:.3}
.header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(166,127,52,.14);background:rgba(244,236,223,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;gap:12px;flex-wrap:wrap}
.brand{font-size:20px;letter-spacing:.16em;color:#5b461d;font-weight:300;text-decoration:none}
.nav a{padding:9px 14px;border:1px solid rgba(166,127,52,.28);border-radius:8px;color:#46371a;text-decoration:none;font-size:12px;margin-left:6px;background:rgba(255,255,255,.3)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 90px}
h1{font-size:26px;font-weight:300;color:#5c4a22}
h2{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#6b5a32;margin-bottom:12px}
.sub{font-size:13px;color:#56492d;margin:4px 0 18px;line-height:1.6}
.card{background:rgba(255,255,255,.6);border:1px solid rgba(166,127,52,.2);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6b5a32;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid rgba(166,127,52,.3);border-radius:7px;background:#fff;font-family:inherit;font-size:15px;color:#2b2b2b}
textarea{min-height:70px}
.btn{padding:11px 16px;border-radius:7px;border:1px solid rgba(166,127,52,.35);background:#a67f34;color:#fffaf0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.btn.sec{background:rgba(255,255,255,.7);color:#46371a}
.btn.sm{padding:6px 10px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.status{font-size:13px;min-height:18px}.status.err{color:#8a1f1f}.status.ok{color:#2b5a26}
.hidden{display:none!important}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:10px;border-radius:8px;border:2px solid transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;opacity:.45}
.seg button.on{opacity:1;border-color:#2b2416}
.s-aperta{background:#f6d4d4;color:#8a1f1f}.s-in_gestione{background:#f7e7b0;color:#6b5114}.s-chiusa{background:#d4ecd0;color:#245a1c}
.day{margin-top:20px}
details.day{margin-top:10px;background:rgba(255,255,255,.45);border:1px solid rgba(166,127,52,.22);border-radius:10px;padding:0 10px}
details.day>summary{list-style:none;cursor:pointer;padding:13px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#5c4a22;font-weight:600}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .chev{transition:transform .2s;display:inline-block;margin-right:6px}
details.day[open]>summary .chev{transform:rotate(90deg)}
details.day[open]{padding-bottom:6px}
.mini{display:flex;gap:4px;font-size:11px;text-transform:none;letter-spacing:0}
.mini span{padding:2px 7px;border-radius:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.item{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.75);border:1px solid rgba(166,127,52,.18);border-left:6px solid #ccc;border-radius:9px;padding:12px;margin-bottom:8px}
.item.aperta{border-left-color:#c0392b}.item.in_gestione{border-left-color:#e0b020}.item.chiusa{border-left-color:#3c9a3c}
.item .t{font-size:15px;font-weight:600;color:#2b2416}
.item .n{font-size:13px;color:#56492d;margin-top:4px;white-space:pre-wrap}
.item .m{font-size:12px;color:#7a6a45;margin-top:6px}
.time{font-size:15px;font-weight:600;min-width:48px;color:#5b461d}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.grow{flex:1;min-width:0}
.acts{display:flex;flex-direction:column;gap:5px}
.acts select{padding:6px;font-size:12px}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.counts span{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600}
mark{background:#f1d27a}
.pri{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:middle}
.p-alta{background:#2b2416;color:#f1d27a}.p-media{background:#e9dcc0;color:#5b461d}.p-bassa{background:#f3efe6;color:#8a7a55;border:1px solid #e0d4b8}
.par{font-size:12px;color:#7a6a45;margin-bottom:3px}.par a{color:#5b461d}
.prog{display:inline-block;width:80px;height:6px;background:#eadfca;border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}.prog i{display:block;height:100%;background:#3c9a3c}
.item.child{margin-left:22px}
@media(max-width:600px){.item{flex-wrap:wrap}.acts{flex-direction:row;width:100%}}

.hright{display:flex;gap:8px;align-items:center;margin-left:auto}
.quickbtn{display:none;padding:9px 12px;border-radius:8px;background:#a67f34;color:#fffaf0;text-decoration:none;font-size:13px;white-space:nowrap}
.navbtn{display:none;background:rgba(255,255,255,.5);border:1px solid rgba(166,127,52,.3);border-radius:8px;font-size:22px;line-height:1;padding:7px 12px;color:#46371a;cursor:pointer}
@media(max-width:820px){
  .header{flex-wrap:nowrap;position:sticky}
  .navbtn{display:block}
  .quickbtn{display:inline-block}
  .nav{display:none;position:absolute;top:100%;right:12px;left:12px;background:#fbf7ef;border:1px solid rgba(166,127,52,.3);border-radius:12px;box-shadow:0 12px 30px rgba(60,40,10,.18);padding:8px;flex-direction:column;z-index:50}
  .nav.open{display:flex}
  .nav a{margin:0;border:0;border-bottom:1px solid rgba(166,127,52,.15);border-radius:0;padding:14px 12px;font-size:15px;background:none}
  .nav a:last-child{border-bottom:0}
}
.rvw{margin-top:8px;padding:9px 11px;background:#fff7e0;border:1px solid #e8cf86;border-radius:8px;font-size:14px;line-height:1.6}.rvw .btn{margin:4px 4px 0 0}
</style>
</head>
<body>
<div class="header">
  <a class="brand" href="dashboard.html">IMMONOVA</a>
  <div class="hright"><a class="quickbtn" href="../collaboratore.html">⚡ Azioni rapide</a><button class="navbtn" id="navBtn" type="button" aria-label="Menu">☰</button></div>
  <div class="nav"><a href="diario.html">Diario</a><a href="diario-gantt.html">Gantt</a><a href="whatsapp.html">WhatsApp</a><a href="dashboard.html">Dashboard</a></div>
</div>
<div class="wrap">
  <h1>Giornata</h1>
  <p class="sub">Visione d'insieme di un giorno: tutte le attività, anche quelle chiuse.</p>
  <div class="card">
    <div class="row" style="margin-top:0;justify-content:space-between">
      <button class="btn sec" id="prevBtn" type="button">◀</button>
      <input id="day" type="date" style="flex:1;max-width:220px">
      <button class="btn sec" id="nextBtn" type="button">▶</button>
      <button class="btn sec" id="todayBtn" type="button">Oggi</button>
    </div>
    <h2 id="dayTitle" style="margin:16px 0 4px;font-size:16px;text-transform:none;letter-spacing:0"></h2>
    <div class="counts" id="counts"></div>
    <div id="dayProg" style="margin-top:10px"></div>
  </div>
  <div id="secDone"></div>
  <div id="secDue"></div>
  <div id="secRun"></div>
  <div class="row"><a class="btn" href="diario.html" style="text-decoration:none">+ Nuova attività</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script>
const client = window.supabaseClient;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LBL = { aperta:"🔴 Aperta", in_gestione:"🟡 In gestione", chiusa:"🟢 Chiusa" };
const PRI = { alta:"▲ Alta", media:"● Media", bassa:"▽ Bassa" };
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const itd = s => s ? s.split("-").reverse().join("/") : "";
let user = null, all = [];

async function init(){
  const { data:{ session } } = await client.auth.getSession();
  if(!session){ location.href = "login.html"; return; }
  user = session.user;
  $("day").value = new URLSearchParams(location.search).get("d") || ymd(new Date());
  $("day").onchange = load;
  $("prevBtn").onclick = () => shift(-1); $("nextBtn").onclick = () => shift(1);
  $("todayBtn").onclick = () => { $("day").value = ymd(new Date()); load(); };
  load();
}
function shift(n){ const d = new Date($("day").value + "T12:00:00"); d.setDate(d.getDate() + n); $("day").value = ymd(d); load(); }
async function load(){
  const d = $("day").value;
  history.replaceState(null, "", location.pathname + "?d=" + d);
  $("dayTitle").textContent = new Date(d + "T12:00:00").toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  const r = await client.from("immonova_diary").select("*").eq("user_id", user.id).limit(5000);
  if(r.error){ $("secDone").innerHTML = '<div class="card status err">Errore: ' + esc(r.error.message) + '</div>'; return; }
  all = r.data || [];
  const done = all.filter(a => a.activity_date === d).sort((a, b) => String(a.activity_time || "").localeCompare(String(b.activity_time || "")));
  const due = all.filter(a => a.due_date === d && a.activity_date !== d);
  const run = all.filter(a => a.activity_date < d && a.due_date && a.due_date > d && a.status !== "chiusa");
  const seen = done.concat(due);
  const c = { aperta:0, in_gestione:0, chiusa:0 }; seen.forEach(a => c[a.status]++);
  $("counts").innerHTML = '<span class="s-aperta">🔴 ' + c.aperta + ' aperte</span><span class="s-in_gestione">🟡 ' + c.in_gestione + ' in gestione</span><span class="s-chiusa">🟢 ' + c.chiusa + ' chiuse</span>';
  const pct = seen.length ? Math.round(c.chiusa / seen.length * 100) : 0;
  $("dayProg").innerHTML = seen.length ? '<span class="prog" style="width:160px"><i style="width:' + pct + '%"></i></span> ' + pct + '% della giornata chiusa' : "";
  $("secDone").innerHTML = section("Attività del giorno", done, true, "Nessuna attività registrata in questo giorno.");
  $("secDue").innerHTML = due.length ? section("🏁 In scadenza oggi", due, false) : "";
  $("secRun").innerHTML = run.length ? section("In corso (iniziate prima, scadono dopo)", run, false) : "";
}
function rootOf(id){ let cur = all.find(a => a.id === id), n = 0; while(cur && cur.parent_id && n++ < 50) cur = all.find(a => a.id === cur.parent_id) || null; return cur ? cur.id : id; }
function section(title, list, showTime, empty){
  return '<div class="card"><h2>' + title + ' (' + list.length + ')</h2>' + (list.length ? list.map(r => {
    const p = r.parent_id ? all.find(a => a.id === r.parent_id) : null;
    const ch = all.filter(a => a.parent_id === r.id), cd = ch.filter(a => a.status === "chiusa").length;
    return '<div class="item ' + r.status + '"><div class="time">' + (showTime ? (r.activity_time ? String(r.activity_time).slice(0, 5) : "—") : "📅") + '</div><div class="grow">' +
      (p ? '<div class="par">↳ parte di: ' + esc(p.title) + '</div>' : "") +
      '<div class="t">' + esc(r.title) + '<span class="pri p-' + (r.priority || "media") + '">' + PRI[r.priority || "media"] + '</span></div>' +
      (r.notes ? '<div class="n">' + esc(r.notes) + '</div>' : "") +
      '<div class="m">' + LBL[r.status] + (showTime ? "" : " · iniziata il " + itd(r.activity_date)) + (r.due_date ? " · 🏁 entro " + itd(r.due_date) : "") + '</div>' +
      ((r.mode || (r.people || []).length) ? '<div class="m">' + (r.mode ? "📍 " + esc(r.mode) + " · " : "") + (r.people || []).map(x => (x.waiting && r.status !== "chiusa" ? "⏳ " : "") + esc(x.name) + (x.role ? " (" + esc(x.role) + ")" : "") + (x.phone ? ' <a href="tel:' + esc(x.phone.replace(/[^0-9+]/g, "")) + '" style="text-decoration:none">📞</a>' : "")).join(", ") + '</div>' : "") +
      (r.status !== "chiusa" ? (r.people || []).map((x, pi) => x.review && x.last_reply ? '<div class="rvw">💬 <b>' + esc(x.name) + '</b> ha risposto su WhatsApp il ' + fdt(x.last_reply.at) + ': «' + esc(x.last_reply.text) + '»<br>Com\'è questa risposta? ' +
        '<button type="button" class="btn sec sm" onclick="markReply(\'' + r.id + '\',' + pi + ',false)">✓ Definitiva</button> ' +
        '<button type="button" class="btn sec sm" onclick="markReply(\'' + r.id + '\',' + pi + ',true)">✓ Definitiva e chiudi</button> ' +
        '<a class="btn sec sm" style="text-decoration:none" href="diario.html?id=' + r.id + '&parziale=' + pi + '">◐ Parziale</a></div>' : "").join("") : "") +
      (ch.length ? '<div class="m"><span class="prog"><i style="width:' + Math.round(cd / ch.length * 100) + '%"></i></span>' + cd + '/' + ch.length + ' sotto-attività chiuse</div>' : "") +
      '</div><div class="acts"><select onchange="setStatus(\'' + r.id + '\', this.value, this)">' +
      ["aperta","in_gestione","chiusa"].map(s => '<option value="' + s + '"' + (s === r.status ? " selected" : "") + '>' + LBL[s] + '</option>').join("") + '</select>' +
      '<a class="btn sec sm" style="text-decoration:none;text-align:center" href="diario.html?id=' + r.id + '">Apri</a>' +
      ((ch.length || r.parent_id) ? '<a class="btn sec sm" style="text-decoration:none;text-align:center" href="diario-gantt.html?root=' + rootOf(r.id) + '">Gantt</a>' : "") +
      '</div></div>';
  }).join("") : '<p class="sub">' + empty + '</p>') + '</div>';
}
const fdt = iso => new Date(iso).toLocaleString("it-IT", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
/* Risposta arrivata su WhatsApp: definitiva (eventualmente chiudendo) o parziale (si apre nel Diario). */
async function markReply(id, pi, close){
  const r = all.find(x => x.id === id); if(!r) return;
  const ps = (r.people || []).map((p, k) => k === pi ? Object.assign({}, p, { review:false, waiting:false, replied_at:p.replied_at || new Date().toISOString() }) : p);
  const p = ps[pi];
  const upd = { people:ps, notes:(r.notes ? r.notes.trim() + "\n" : "") + "[" + fdt(new Date().toISOString()) + "] Risposta definitiva di " + (p.name || "") + (p.last_reply ? ": " + p.last_reply.text : "") };
  if(close) upd.status = "chiusa";
  const res = await client.from("immonova_diary").update(upd).eq("id", id);
  if(res.error){ alert(res.error.message); return; } load();
}
async function setStatus(id, v, el){
  const r = await client.from("immonova_diary").update({ status:v }).eq("id", id);
  if(r.error){ alert(r.error.message); } load();
}
init();
</script>
<script>
(function(){ var b = document.getElementById("navBtn"), n = document.querySelector(".header .nav");
  b.onclick = function(e){ e.stopPropagation(); n.classList.toggle("open"); b.textContent = n.classList.contains("open") ? "✕" : "☰"; };
  document.addEventListener("click", function(e){ if(!n.contains(e.target)){ n.classList.remove("open"); b.textContent = "☰"; } });
})();
</script>
</body>
</html>
