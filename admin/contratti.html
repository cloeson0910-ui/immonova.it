<!DOCTYPE html>
<html lang="it">
<head>
<link rel="stylesheet" href="../css/immonova-text-theme.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMONOVA | Contratti</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#46371a;min-height:100vh}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px);background-size:230px 199px;opacity:.3}
.header{padding:18px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(166,127,52,.14);background:rgba(244,236,223,.85);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;gap:12px;flex-wrap:wrap}
.brand{font-size:20px;letter-spacing:.16em;color:#5b461d;font-weight:300;text-decoration:none}
.nav a{padding:9px 14px;border:1px solid rgba(166,127,52,.28);border-radius:8px;color:#46371a;text-decoration:none;font-size:12px;margin-left:6px;background:rgba(255,255,255,.3)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:26px;font-weight:300;letter-spacing:.04em;color:#5c4a22}
.sub{font-size:13px;color:#56492d;margin:4px 0 22px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{padding:10px 18px;border:1px solid rgba(166,127,52,.3);border-radius:8px;background:rgba(255,255,255,.35);cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#46371a;font-family:inherit}
.tab.on{background:#a67f34;color:#fffaf0}
.card{background:rgba(255,255,255,.55);border:1px solid rgba(166,127,52,.2);border-radius:12px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b5a32;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid rgba(166,127,52,.3);border-radius:7px;background:#fff;font-family:inherit;font-size:14px;color:#2b2b2b}
textarea{min-height:70px}
.btn{padding:11px 18px;border-radius:7px;border:1px solid rgba(166,127,52,.35);background:#a67f34;color:#fffaf0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.btn.sec{background:rgba(255,255,255,.5);color:#46371a}
.btn.red{background:#9c2f2f;border-color:#9c2f2f}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.status{font-size:13px;min-height:18px;margin-top:10px}
.status.err{color:#8a1f1f}.status.ok{color:#2b5a26}
.sheet{background:#fff;border:1px solid rgba(166,127,52,.2);border-radius:4px;padding:48px 56px;color:#222;font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.7;max-height:70vh;overflow:auto}
.sheet h1{font-size:18px;text-align:center;letter-spacing:.08em;margin-bottom:18px;color:#222}
.sheet h2{font-size:14px;text-align:center;margin:18px 0 10px}
.sheet h3{font-size:14px;margin:16px 0 6px}
.sheet p{margin-bottom:8px;text-align:justify}.sheet .c{text-align:center}
.sheet .sign-row{display:flex;justify-content:space-between;margin:30px 0}
.sheet .clauses{margin-top:22px;padding-top:14px;border-top:1px solid #ccc}
.sheet .allegato{margin-top:30px;padding-top:14px;border-top:2px solid #222}
.sheet table{width:100%;border-collapse:collapse;margin:10px 0}
.sheet th{background:#1b1b1b;color:#fff;padding:8px;text-align:left;font-size:12px}
.sheet td{border-bottom:1px solid #ddd;padding:8px;font-size:13px}.sheet td.num{text-align:right}
.sheet .small{font-size:11px;color:#555}
.sheet[contenteditable="true"]{outline:2px dashed #a67f34}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b5a32;padding:8px;border-bottom:1px solid rgba(166,127,52,.3)}
table.list td{padding:9px 8px;border-bottom:1px solid rgba(166,127,52,.15);vertical-align:middle}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px}
.b-sent{background:#f3e5bf;color:#6b5114}.b-signed{background:#d8ecd2;color:#245a1c}.b-cancelled{background:#eee;color:#666}
.small-btn{padding:6px 10px;font-size:11px;border-radius:6px;border:1px solid rgba(166,127,52,.35);background:#fff;cursor:pointer;margin-right:4px;font-family:inherit}
.hidden{display:none}
.hint{font-size:12px;color:#6b5a32;margin-top:6px}
@media(max-width:700px){.sheet{padding:24px 18px}}
</style>
</head>
<body>
<div class="header">
  <a class="brand" href="dashboard.html">IMMONOVA</a>
  <div class="nav"><a href="tabella-compensi.html">Tabella compensi</a><a href="dashboard.html">Dashboard</a></div>
</div>
<div class="wrap">
  <h1>Contratti</h1>
  <div class="sub">Segnalatori e agenzie partner: compili i dati, controlli il testo e invii il link di firma elettronica con OTP. Niente carta.</div>
  <div class="tabs">
    <button class="tab on" data-tab="new">Nuovo contratto</button>
    <button class="tab" data-tab="list">Archivio contratti</button>
  </div>

  <!-- NUOVO -->
  <section id="tab-new">
    <div class="card">
      <div class="grid">
        <div><label>Tipo di contratto</label>
          <select id="ctype"><option value="segnalatore">Segnalatore</option><option value="partner">Agenzia partner</option></select></div>
        <div><label>Email per la firma *</label><input id="f_email" type="email" placeholder="email@esempio.it"></div>
        <div><label>Penale riservatezza (€) *</label><input id="f_penale" type="number" min="0" step="any" placeholder="es. 25000"></div>
      </div>
    </div>

    <div class="card" id="box-seg">
      <div class="grid">
        <div><label>Nome e cognome *</label><input id="s_nome"></div>
        <div><label>Luogo di nascita</label><input id="s_luogo"></div>
        <div><label>Data di nascita</label><input id="s_data" type="date"></div>
        <div><label>Residenza (città)</label><input id="s_citta"></div>
        <div><label>Indirizzo</label><input id="s_indirizzo"></div>
        <div><label>Codice fiscale *</label><input id="s_cf" style="text-transform:uppercase"></div>
      </div>
      <div style="margin-top:14px"><label>Oggetto della segnalazione (immobile e/o potenziale acquirente) *</label>
        <textarea id="s_oggetto" placeholder="es. la disponibilità alla vendita dell'immobile sito in Ostuni (BR), contrada …"></textarea></div>
    </div>

    <div class="card hidden" id="box-par">
      <div class="grid">
        <div><label>Ragione sociale *</label><input id="p_rs"></div>
        <div><label>Sede legale (indirizzo, città)</label><input id="p_sede"></div>
        <div><label>P.IVA / C.F. *</label><input id="p_piva"></div>
        <div><label>Legale rappresentante *</label><input id="p_lr"></div>
        <div><label>N. REA / iscrizione CCIAA mediatori</label><input id="p_rea"></div>
        <div><label>PEC</label><input id="p_pec"></div>
      </div>
    </div>

    <div class="row">
      <button class="btn sec" id="previewBtn">Genera anteprima</button>
      <button class="btn sec hidden" id="editBtn">Modifica questo testo</button>
      <button class="btn sec hidden" id="saveTplBtn">Salva come testo base</button>
      <button class="btn hidden" id="sendBtn">Invia per la firma</button>
    </div>
    <div class="status" id="st"></div>
    <div class="hint" id="tabInfo"></div>
    <div class="card hidden" id="previewCard" style="margin-top:14px"><div class="sheet" id="sheet"></div></div>
  </section>

  <!-- ARCHIVIO -->
  <section id="tab-list" class="hidden">
    <div class="card">
      <table class="list"><thead><tr><th>Data</th><th>Tipo</th><th>Controparte</th><th>Email</th><th>Stato</th><th>Azioni</th></tr></thead>
      <tbody id="listBody"><tr><td colspan="6">Caricamento…</td></tr></tbody></table>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/owner-pages-guard.js"></script>
<script src="../js/contract-templates.js"></script>
<script>
const client = window.supabaseClient;
const FN = SUPABASE_URL + "/functions/v1/immonova-contract";
const SITE = "https://immonova-consulting.it";
let currentUser = null, compTable = null, savedTemplates = {}, generated = false;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const setSt = (t, cls) => { $("st").textContent = t || ""; $("st").className = "status " + (cls || ""); };
const type = () => $("ctype").value;

async function init(){
  const { data:{ session } } = await client.auth.getSession();
  if(!session){ location.href = "login.html"; return; }
  currentUser = session.user;
  if(!(await guardOwnerOnlyPage(client, currentUser.id))) return;
  const t = await client.from("immonova_compensation_tables").select("*").order("version", { ascending:false }).limit(1).maybeSingle();
  if(t.error){ setSt("Tabella compensi non trovata: esegui prima lo script SQL contratti-e-compensi.sql. (" + t.error.message + ")", "err"); }
  compTable = t.data || null;
  const tp = await client.from("immonova_contract_templates").select("template_key,content_html").in("template_key", ["segnalatore_v1","partner_v2"]);
  (tp.data || []).forEach(r => savedTemplates[r.template_key] = r.content_html);
  showTabInfo();
  loadList();
}

function showTabInfo(){
  if(!compTable){ $("tabInfo").textContent = ""; return; }
  const missing = type() === "segnalatore" && compTable.rows.some(r => r.segnalatore_eur == null || r.segnalatore_eur === "");
  $("tabInfo").innerHTML = "Allegato A: Tabella Compensi versione " + compTable.version + " del " + new Date(compTable.valid_from).toLocaleDateString("it-IT") +
    (missing ? ' — <b style="color:#8a1f1f">mancano i compensi fissi del segnalatore: compilali in <a href="tabella-compensi.html">Tabella compensi</a></b>' : "");
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  $("tab-new").classList.toggle("hidden", b.dataset.tab !== "new");
  $("tab-list").classList.toggle("hidden", b.dataset.tab !== "list");
  if(b.dataset.tab === "list") loadList();
}));

$("ctype").addEventListener("change", () => {
  $("box-seg").classList.toggle("hidden", type() !== "segnalatore");
  $("box-par").classList.toggle("hidden", type() !== "partner");
  resetPreview(); showTabInfo();
});
document.querySelectorAll("#tab-new input, #tab-new textarea").forEach(el => el.addEventListener("input", () => { if(generated) resetPreview(); }));

function resetPreview(){
  generated = false;
  $("previewCard").classList.add("hidden");
  ["editBtn","saveTplBtn","sendBtn"].forEach(id => $(id).classList.add("hidden"));
  $("sheet").contentEditable = "false";
}

function fmtDate(v){ return v ? new Date(v + "T00:00:00").toLocaleDateString("it-IT") : "[—]"; }
function eur(v){ return "Euro " + Number(v).toLocaleString("it-IT", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " (" + numberToWordsIt(Math.round(Number(v))) + "/00)"; }

function collect(){
  const email = $("f_email").value.trim();
  const pen = $("f_penale").value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw "Inserisci un'email valida per la firma.";
  if(pen === "" || Number(pen) <= 0) throw "Inserisci l'importo della penale per la riservatezza.";
  if(!compTable) throw "Tabella compensi non disponibile.";
  if(type() === "segnalatore"){
    const d = { nome:$("s_nome").value.trim(), luogo:$("s_luogo").value.trim(), data:$("s_data").value, citta:$("s_citta").value.trim(),
                indirizzo:$("s_indirizzo").value.trim(), cf:$("s_cf").value.trim().toUpperCase(), oggetto:$("s_oggetto").value.trim() };
    if(!d.nome || !d.cf || !d.oggetto) throw "Compila nome, codice fiscale e oggetto della segnalazione.";
    if(compTable.rows.some(r => r.segnalatore_eur == null || r.segnalatore_eur === "")) throw "Prima compila i compensi fissi del segnalatore in Tabella compensi.";
    const cp = "il Sig./la Sig.ra <b>" + esc(d.nome) + "</b>, nato/a a " + esc(d.luogo || "[—]") + " il " + fmtDate(d.data) +
      ", residente in " + esc(d.citta || "[—]") + ", " + esc(d.indirizzo || "[—]") + ", Codice Fiscale " + esc(d.cf) + ", email " + esc(email);
    return { d, name:d.nome, cp, oggetto:esc(d.oggetto), email, pen:Number(pen) };
  } else {
    const d = { rs:$("p_rs").value.trim(), sede:$("p_sede").value.trim(), piva:$("p_piva").value.trim(), lr:$("p_lr").value.trim(),
                rea:$("p_rea").value.trim(), pec:$("p_pec").value.trim() };
    if(!d.rs || !d.piva || !d.lr) throw "Compila ragione sociale, P.IVA e legale rappresentante.";
    const cp = "<b>" + esc(d.rs) + "</b>, con sede legale in " + esc(d.sede || "[—]") + ", Partita IVA/C.F. " + esc(d.piva) +
      (d.rea ? ", iscritta al REA/CCIAA n. " + esc(d.rea) : "") + (d.pec ? ", PEC " + esc(d.pec) : "") +
      ", in persona del legale rappresentante pro tempore, Sig./Sig.ra " + esc(d.lr) + ", email " + esc(email);
    return { d, name:d.rs, cp, oggetto:"", email, pen:Number(pen) };
  }
}

function buildHtml(x){
  const T = window.IMMONOVA_CONTRACT_TEMPLATES[type()];
  let html = savedTemplates[T.key] || T.html;
  const today = new Date().toLocaleDateString("it-IT", { day:"numeric", month:"long", year:"numeric" });
  return html.split("{{CONTROPARTE}}").join(x.cp)
    .split("{{OGGETTO}}").join(x.oggetto)
    .split("{{PENALE_NDA}}").join(eur(x.pen))
    .split("{{DATA}}").join(today)
    .split("{{VERSIONE_TABELLA}}").join("versione " + compTable.version + " del " + new Date(compTable.valid_from).toLocaleDateString("it-IT"))
    .split("{{ALLEGATO_A}}").join(window.immonovaRenderCompTable(compTable, type()));
}

$("previewBtn").addEventListener("click", () => {
  try{
    const x = collect();
    $("sheet").innerHTML = buildHtml(x);
    $("previewCard").classList.remove("hidden");
    ["editBtn","sendBtn","saveTplBtn"].forEach(id => $(id).classList.remove("hidden"));
    $("saveTplBtn").classList.add("hidden");
    generated = true;
    setSt("Anteprima pronta: controlla il testo, poi invia per la firma.", "ok");
    $("previewCard").scrollIntoView({ behavior:"smooth" });
  }catch(e){ setSt(String(e), "err"); }
});

$("editBtn").addEventListener("click", () => {
  const on = $("sheet").contentEditable !== "true";
  $("sheet").contentEditable = on ? "true" : "false";
  $("editBtn").textContent = on ? "Fine modifica" : "Modifica questo testo";
  $("saveTplBtn").classList.toggle("hidden", !on);
  setSt(on ? "Puoi modificare il testo di questo contratto direttamente nel riquadro." : "Modifiche applicate a questo contratto.", "ok");
});

/* Salva il testo modificato come nuovo testo base, rimettendo i segnaposto al posto dei dati di questo contratto */
$("saveTplBtn").addEventListener("click", async () => {
  if(!confirm("Usare questo testo come base per tutti i prossimi contratti di questo tipo?")) return;
  try{
    const x = collect();
    let html = $("sheet").innerHTML;
    const al = $("sheet").querySelector(".allegato");
    if(al) html = html.replace(al.outerHTML, '<div class="allegato"><h2>ALLEGATO A – Tabella Compensi IMMONOVA</h2>{{ALLEGATO_A}}</div>');
    const tmp = document.createElement("div"); tmp.innerHTML = buildHtml(x);
    const rep = [[x.cp,"{{CONTROPARTE}}"],[eur(x.pen),"{{PENALE_NDA}}"],["versione " + compTable.version + " del " + new Date(compTable.valid_from).toLocaleDateString("it-IT"),"{{VERSIONE_TABELLA}}"]];
    if(x.oggetto) rep.push([x.oggetto, "{{OGGETTO}}"]);
    rep.push([new Date().toLocaleDateString("it-IT", { day:"numeric", month:"long", year:"numeric" }), "{{DATA}}"]);
    const norm = s => { const d = document.createElement("div"); d.innerHTML = s; return d.innerHTML; };
    rep.forEach(([v, k]) => { html = html.split(norm(v)).join(k); });
    const T = window.IMMONOVA_CONTRACT_TEMPLATES[type()];
    const r = await client.from("immonova_contract_templates").upsert({ template_key:T.key, title:T.title, content_html:html, updated_at:new Date().toISOString(), updated_by:currentUser.id }, { onConflict:"template_key" });
    if(r.error) throw r.error.message;
    savedTemplates[T.key] = html;
    setSt("Testo base salvato.", "ok");
  }catch(e){ setSt("Salvataggio non riuscito: " + e, "err"); }
});

$("sendBtn").addEventListener("click", async () => {
  let x; try{ x = collect(); }catch(e){ setSt(String(e), "err"); return; }
  if($("sheet").contentEditable === "true"){ setSt("Premi prima \"Fine modifica\".", "err"); return; }
  if(!confirm("Inviare il contratto a " + x.email + " per la firma?")) return;
  $("sendBtn").disabled = true; setSt("Invio in corso…");
  try{
    const { data:{ session } } = await client.auth.getSession();
    const r = await fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + session.access_token, apikey:SUPABASE_ANON_KEY },
      body: JSON.stringify({ action:"send", contract_type:type(), counterparty:x.d, counterparty_email:x.email, counterparty_name:x.name,
        subject: type() === "segnalatore" ? x.d.oggetto : null, penalty_nda_eur:x.pen, compensation_table_id:compTable.id, body_html:$("sheet").innerHTML }) });
    const out = await r.json();
    if(!r.ok || !out.ok) throw out.error || ("HTTP " + r.status);
    setSt(out.email_sent ? "Inviato a " + x.email + ". Link di firma: " + out.link : "Contratto salvato ma email NON inviata (" + (out.email_detail || "") + "). Puoi mandare tu il link: " + out.link, out.email_sent ? "ok" : "err");
    resetPreview();
  }catch(e){ setSt("Errore: " + e, "err"); }
  $("sendBtn").disabled = false;
});

async function loadList(){
  const r = await client.from("immonova_contracts").select("id,token,contract_type,counterparty_name,counterparty_email,status,sent_at,signed_at,created_at").order("created_at", { ascending:false }).limit(200);
  const tb = $("listBody");
  if(r.error){ tb.innerHTML = '<tr><td colspan="6">' + esc(r.error.message) + '</td></tr>'; return; }
  if(!r.data.length){ tb.innerHTML = '<tr><td colspan="6">Nessun contratto ancora.</td></tr>'; return; }
  const lab = { sent:"In attesa di firma", signed:"Firmato", cancelled:"Annullato" };
  tb.innerHTML = r.data.map(c => {
    const link = SITE + "/firma-contratto.html?t=" + c.token;
    return "<tr><td>" + new Date(c.created_at).toLocaleDateString("it-IT") + "</td><td>" + ({ partner:"Agenzia partner", segnalatore:"Segnalatore", nda_visita:"NDA visita" }[c.contract_type] || c.contract_type) +
      "</td><td>" + esc(c.counterparty_name) + "</td><td>" + esc(c.counterparty_email) + '</td><td><span class="badge b-' + c.status + '">' + lab[c.status] +
      (c.signed_at ? " " + new Date(c.signed_at).toLocaleString("it-IT") : "") + "</span></td><td>" +
      '<button class="small-btn" onclick="window.open(\'' + link + '\',\'_blank\')">Apri / PDF</button>' +
      '<button class="small-btn" onclick="navigator.clipboard.writeText(\'' + link + '\');this.textContent=\'Copiato\'">Copia link</button>' +
      (c.status === "sent" ? '<button class="small-btn" onclick="act(\'resend\',\'' + c.id + '\')">Reinvia</button><button class="small-btn" onclick="act(\'cancel\',\'' + c.id + '\')">Annulla</button>' : "") +
      "</td></tr>";
  }).join("");
}

async function act(action, id){
  if(action === "cancel" && !confirm("Annullare questo contratto? Il link di firma smetterà di funzionare.")) return;
  const { data:{ session } } = await client.auth.getSession();
  const r = await fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + session.access_token, apikey:SUPABASE_ANON_KEY }, body:JSON.stringify({ action, id }) });
  const out = await r.json().catch(() => ({}));
  alert(out.ok ? (action === "resend" ? "Email reinviata." : "Contratto annullato.") : ("Errore: " + (out.error || out.email_detail || r.status)));
  loadList();
}

/* importo in lettere (interi) */
function numberToWordsIt(n){
  const u=["","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
  const d=["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
  function lt1000(x){ let s=""; const c=Math.floor(x/100), r=x%100;
    if(c) s += (c===1?"cento":u[c]+"cento");
    if(r<20) s += u[r]; else { let t=d[Math.floor(r/10)], o=r%10; if(o===1||o===8) t=t.slice(0,-1); s += t+u[o]; }
    return s; }
  if(n===0) return "zero";
  let s="", mil=Math.floor(n/1e6), mig=Math.floor((n%1e6)/1000), r=n%1000;
  if(mil) s += mil===1?"unmilione":lt1000(mil)+"milioni";
  if(mig) s += mig===1?"mille":lt1000(mig)+"mila";
  s += lt1000(r);
  return s;
}
init();
</script>
</body>
</html>
