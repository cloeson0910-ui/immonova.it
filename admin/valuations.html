<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valutazioni Immobiliari | IMMONOVA Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  color:#7f6430;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.30;
}
.header{
  padding:30px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(166,127,52,.12);
  background:rgba(244,236,223,.72);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:10;
}
.logo{text-decoration:none;color:#a67f34}
.logo-main{font-size:24px;font-weight:600;letter-spacing:.35em}
.logo-sub{margin-top:6px;font-size:9px;font-weight:700;letter-spacing:.18em;color:#a58139}
.header-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.header-actions a,.logout{
  padding:10px 20px;
  border:1px solid rgba(166,127,52,.25);
  background:rgba(255,255,255,.25);
  cursor:pointer;
  color:#a67f34;
  text-decoration:none;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.header-actions a:hover,.logout:hover{background:#a67f34;color:#fff}
.container{max-width:1450px;margin:auto;padding:40px}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#9a793c;margin-bottom:12px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.title{font-size:42px;font-weight:200;letter-spacing:.05em;color:#a67f34}
.subtitle{font-size:15px;line-height:1.8;color:#8f7643;max-width:820px;margin-bottom:28px}
.primary-link{
  display:inline-block;
  padding:14px 22px;
  border:1px solid rgba(166,127,52,.42);
  background:#a67f34;
  color:#fffaf0;
  text-decoration:none;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:.18em;
}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.search{
  flex:1;
  min-width:280px;
  padding:14px 16px;
  border:1px solid rgba(166,127,52,.22);
  background:rgba(255,255,255,.25);
  color:#7f6430;
  outline:none;
  font-size:14px;
}
.status{margin-bottom:22px;min-height:20px;font-size:13px}
.success{color:#4f7f45}
.error{color:#9c2f2f}
.table-wrapper{
  background:rgba(255,255,255,.20);
  backdrop-filter:blur(8px);
  border:1px solid rgba(166,127,52,.15);
  overflow:auto;
  box-shadow:0 24px 70px rgba(127,100,48,.07);
}
table{width:100%;border-collapse:collapse;min-width:1000px}
th{
  text-align:left;
  padding:16px;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  border-bottom:1px solid rgba(166,127,52,.15);
  white-space:nowrap;
}
td{
  padding:16px;
  border-bottom:1px solid rgba(166,127,52,.08);
  vertical-align:top;
  font-size:13px;
  line-height:1.6;
}
.badge{
  display:inline-block;
  padding:6px 9px;
  border:1px solid rgba(166,127,52,.25);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:rgba(255,255,255,.22);
  color:#a67f34;
  white-space:nowrap;
}
.actions{display:flex;flex-direction:column;gap:6px;min-width:100px}
.action-btn{
  padding:8px 10px;
  border:1px solid rgba(166,127,52,.28);
  background:rgba(255,255,255,.20);
  color:#a67f34;
  cursor:pointer;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-family:inherit;
  text-decoration:none;
  text-align:center;
}
.action-btn:hover{background:#a67f34;color:#fff}
.action-btn.danger{border-color:rgba(156,47,47,.35);color:#9c2f2f}
.action-btn.danger:hover{background:#9c2f2f;color:#fff}
.empty{padding:40px;text-align:center;opacity:.7}
@media(max-width:700px){
  .header{flex-direction:column;gap:18px}
  .container{padding:28px 22px}
}
</style>
</head>

<body>

<header class="header">
<a href="../index.html" class="logo">
<div class="logo-main">IMMONOVA</div>
<div class="logo-sub">OFF MARKET • CONSULTING</div>
</a>
<div class="header-actions">
<a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
<button class="logout" id="logoutBtn" data-i18n="logout">Logout</button>
</div>
</header>

<div class="container">

<div class="kicker" data-i18n="kicker">Valutazioni Immobiliari</div>

<div class="title-row">
<div><h1 class="title" data-i18n="title">Valutazioni</h1></div>
<a class="primary-link" href="valuation-form.html" data-i18n="btn_new">Nuova Valutazione</a>
</div>

<p class="subtitle" data-i18n="subtitle">
Tutte le valutazioni immobiliari registrate per i venditori.
</p>

<div class="toolbar">
<input type="text" id="searchInput" class="search" data-i18n="search_placeholder" placeholder="Cerca per venditore, comune, categoria...">
</div>

<div id="status" class="status"></div>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th data-i18n="th_seller">Venditore</th>
<th data-i18n="th_property">Immobile</th>
<th data-i18n="th_location">Comune</th>
<th data-i18n="th_estimate">Stima</th>
<th data-i18n="th_date">Registrata il</th>
<th data-i18n="th_actions">Azioni</th>
</tr>
</thead>
<tbody id="valuationsTable">
<tr><td colspan="6" class="empty" data-i18n="loading">Caricamento...</td></tr>
</tbody>
</table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const table = document.getElementById("valuationsTable");
const statusBox = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

let currentUser = null;
let currentUserLanguage = "it";
let allValuations = [];

var UI_STRINGS = {
  nav_dashboard:"Dashboard", logout:"Logout",
  kicker:"Valutazioni Immobiliari", title:"Valutazioni", btn_new:"Nuova Valutazione",
  subtitle:"Tutte le valutazioni immobiliari registrate per i venditori.",
  search_placeholder:"Cerca per venditore, comune, categoria...",
  th_seller:"Venditore", th_property:"Immobile", th_location:"Comune", th_estimate:"Stima", th_date:"Registrata il", th_actions:"Azioni",
  loading:"Caricamento...", loading_error:"Errore nel caricamento.", empty_none:"Nessuna valutazione presente.",
  no_estimate:"Non calcolata",
  action_edit:"Modifica", action_report:"Vedi Relazione", action_delete:"Elimina",
  confirm_delete:"Eliminare definitivamente questa valutazione?",
  msg_deleting:"Eliminazione in corso...", msg_deleted:"Valutazione eliminata."
};

var LANGUAGE_LABELS = { it:"Italiano", en:"English", fr:"Fran\u00e7ais", de:"Deutsch", es:"Espa\u00f1ol", ar:"\u0627\u0644\u0639\u0631\u0628\u064a\u0629" };
var T = UI_STRINGS;

function i18nCacheKey(lang){ return "immonova_i18n_valuations_list_" + lang + "_v1"; }

async function loadTranslatedStrings(lang){
  if(lang === "it") return UI_STRINGS;
  var cacheKey = i18nCacheKey(lang);
  try{
    var cached = localStorage.getItem(cacheKey);
    if(cached){ var parsed = JSON.parse(cached); if(parsed && typeof parsed === "object") return parsed; }
  }catch(e){}

  var keys = Object.keys(UI_STRINGS);
  var texts = keys.map(function(k){ return UI_STRINGS[k]; });

  var result = await client.functions.invoke("translate-public-content", {
    body:{ language: lang, source_language: "it", context: "IMMONOVA luxury real estate investment website. Admin list of property valuations for sellers.", texts: texts }
  });

  if(result.error || !result.data || !result.data.success || !Array.isArray(result.data.translations)){
    console.error("Traduzione valuations non riuscita, uso italiano come fallback:", result.error || result.data);
    return UI_STRINGS;
  }

  var translations = result.data.translations;
  var translated = {};
  keys.forEach(function(k, i){ translated[k] = translations[i] != null ? translations[i] : UI_STRINGS[k]; });
  try{ localStorage.setItem(cacheKey, JSON.stringify(translated)); }catch(e){}
  return translated;
}

function renderTranslatedStaticText(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var key = el.getAttribute("data-i18n");
    if(T[key]) el.textContent = T[key];
  });
}

async function applyLanguage(lang){
  currentUserLanguage = lang || "it";
  document.documentElement.lang = currentUserLanguage;
  T = await loadTranslatedStrings(currentUserLanguage);
  renderTranslatedStaticText();
}

async function loadUserLanguage(){
  var result = await client.from("profiles").select("language").eq("id", currentUser.id).single();
  if(result.error){ await applyLanguage("it"); return; }
  await applyLanguage((result.data && result.data.language) || "it");
}

async function checkAuth(){
  const { data:{ session } } = await client.auth.getSession();
  if(!session){ window.location.href = "login.html"; return false; }
  currentUser = session.user;
  return true;
}

function escapeHTML(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

function setStatus(message, type){
  statusBox.className = "status " + (type || "");
  statusBox.textContent = message || "";
}

function formatEstimate(m){
  if(!m.estimated_value_min && !m.estimated_value_max) return T.no_estimate;
  var fmt = function(n){ return new Intl.NumberFormat("it-IT").format(Math.round(n)) + " €"; };
  return fmt(m.estimated_value_min) + " – " + fmt(m.estimated_value_max);
}

function formatDateShort(v){
  if(!v) return "";
  try{ return new Date(v).toLocaleDateString(currentUserLanguage==="it"?"it-IT":currentUserLanguage,{day:"2-digit",month:"2-digit",year:"numeric"}); }
  catch(e){ return v; }
}

async function loadValuations(){
  var result = await client.from("immonova_property_valuations").select("*").order("created_at",{ascending:false});

  if(result.error){
    table.innerHTML = '<tr><td colspan="6" class="empty">' + escapeHTML(T.loading_error) + '</td></tr>';
    return;
  }

  allValuations = result.data || [];
  applyFilter();
}

function applyFilter(){
  var query = (searchInput.value || "").trim().toLowerCase();
  var filtered = allValuations.filter(function(v){
    if(!query) return true;
    return [v.seller_first_name, v.seller_last_name, v.municipality, v.category, v.property_title].some(function(f){
      return String(f || "").toLowerCase().includes(query);
    });
  });
  renderTable(filtered);
}

function renderTable(data){
  if(!data.length){
    table.innerHTML = '<tr><td colspan="6" class="empty">' + escapeHTML(T.empty_none) + '</td></tr>';
    return;
  }

  table.innerHTML = data.map(function(v){
    return '<tr>'
      + '<td><strong>' + escapeHTML(v.seller_first_name + " " + v.seller_last_name) + '</strong>' + (v.seller_phone ? '<br>' + escapeHTML(v.seller_phone) : '') + '</td>'
      + '<td>' + escapeHTML(v.property_title || "") + (v.category ? '<br><span class="badge">' + escapeHTML(v.category) + '</span>' : '') + '</td>'
      + '<td>' + escapeHTML(v.municipality || "") + (v.province ? ' (' + escapeHTML(v.province) + ')' : '') + '</td>'
      + '<td>' + escapeHTML(formatEstimate(v)) + '</td>'
      + '<td>' + escapeHTML(formatDateShort(v.created_at)) + '</td>'
      + '<td><div class="actions">'
        + '<a class="action-btn" href="valuation-report.html?id=' + encodeURIComponent(v.id) + '">' + escapeHTML(T.action_report) + '</a>'
        + '<a class="action-btn" href="valuation-form.html?id=' + encodeURIComponent(v.id) + '">' + escapeHTML(T.action_edit) + '</a>'
        + '<button type="button" class="action-btn danger" onclick="deleteValuation(' + v.id + ')">' + escapeHTML(T.action_delete) + '</button>'
      + '</div></td>'
      + '</tr>';
  }).join("");
}

window.deleteValuation = async function(id){
  if(!confirm(T.confirm_delete)) return;
  setStatus(T.msg_deleting, "");
  var result = await client.from("immonova_property_valuations").delete().eq("id", id);
  if(result.error){
    setStatus(result.error.message, "error");
    return;
  }
  setStatus(T.msg_deleted, "success");
  await loadValuations();
};

searchInput.addEventListener("input", applyFilter);

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await client.auth.signOut();
  window.location.href = "../index.html";
});

(async function init(){
  if(await checkAuth()){
    await loadUserLanguage();
    await loadValuations();
  }
})();
</script>

</body>
</html>
