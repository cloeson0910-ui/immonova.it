<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#735f36}

.container{max-width:900px;margin:auto;padding:38px 24px 80px}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#9a793c;margin-bottom:10px}
.title{font-size:32px;font-weight:200;letter-spacing:.06em;color:#a67f34}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 18px;border:1px solid #a67f34;background:#a67f34;color:white;text-decoration:none;letter-spacing:.16em;text-transform:uppercase;font-size:10px;cursor:pointer}
.btn.secondary{background:transparent;color:#a67f34}
.btn.btn-busy{background:#e0a83a!important;border-color:#e0a83a!important;color:#3a2c0d!important;cursor:wait!important}

.link-row.visible{display:flex}
.link-row .link-label{color:#a67f34;font-weight:600;white-space:nowrap}
.link-row input{flex:1;min-width:220px;padding:9px 10px;border:1px solid rgba(166,127,52,.25);background:rgba(255,255,255,.6);color:#7f6430;font-size:12px;font-family:inherit}
.link-row .copy-btn{padding:9px 14px;border:1px solid rgba(166,127,52,.4);background:#a67f34;color:#fffaf0;text-transform:uppercase;letter-spacing:.1em;font-size:10px;cursor:pointer}

/* ---- Traduzione: stessa logica sicura già in uso nel dossier completo (una chiamata per
   singolo testo, cosi' un eventuale disallineamento della traduzione non contamina le altre
   chiavi) — qui semplificata perché le stringhe fisse sono poche. ---- */
async function translateOneText(lang, text, context){
  if(!text) return text;
  try{
    var url = String(SUPABASE_URL||"").replace(/\/+$/,"")+"/functions/v1/translate-public-content";
    var res = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY},body:JSON.stringify({
      language: lang, source_language: "it", context: context||"", texts: [text]
    })});
    if(!res.ok) return text;
    var result = await res.json();
    if(!result || !result.success || !Array.isArray(result.translations) || result.translations.length!==1) return text;
    var raw = result.translations[0];
    return raw==null ? text : raw;
  }catch(e){
    console.warn("[i18n] traduzione fallita per:",text.slice(0,50),e);
    return text;
  }
}

  var keys = Object.keys(UI_IT);
  var CONCURRENCY = 6;
  var out = Object.assign({}, UI_IT);
  var idx = 0;
  async function worker(){
    while(idx < keys.length){
      var i = idx++; var k = keys[i];
      if(!UI_IT[k]){ continue; }
      out[k] = await translateOneText(CURRENT_LANG, UI_IT[k], "scheda immobile one-sheet");
    }
  }
  var titlePromise = translateOneText(CURRENT_LANG, titleIt, "titolo scheda immobile one-sheet");
  var descPromise = descIt ? translateOneText(CURRENT_LANG, descIt, "descrizione breve scheda immobile one-sheet") : Promise.resolve("");
  await Promise.all(Array.from({length:CONCURRENCY}, worker).concat([titlePromise, descPromise]));
  T = out;
  TRANSLATED_TITLE = await titlePromise;
  TRANSLATED_DESC = await descPromise;
}

function escapeHTML(v){
  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function clean(v){ v = (v==null?"":String(v)).trim(); return v || ""; }
function getTitle(){ return TRANSLATED_TITLE || clean(opportunity && opportunity.title) || "Immobile IMMONOVA"; }
function getDescription(){ return TRANSLATED_DESC || clean(opportunity && opportunity.short_description); }
function getAddress(){
  var o = opportunity||{};
  return clean(o.formatted_address) || [o.address,o.locality,o.province].filter(Boolean).join(", ");
}
function getPrice(){
  var o = opportunity||{};
  var raw = clean(o.price);
  if(!raw) return "";
  var digits = raw.replace(/[^0-9]/g,"");
  if(!digits) return raw; // il campo non contiene numeri riconoscibili: mostro il testo com'è
  var num = parseInt(digits,10);
  if(!Number.isFinite(num)) return raw;
  return "€ " + num.toLocaleString("it-IT");
}
function normalizeGallery(raw){
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.filter(Boolean);
  if(typeof raw==="string"){ try{ var p=JSON.parse(raw); return Array.isArray(p)?p.filter(Boolean):[]; }catch(e){ return []; } }
  return [];
}
function getCoverImage(){
  var o = opportunity||{};
  if(clean(o.cover_image)) return clean(o.cover_image);
  var gal = normalizeGallery(o.gallery_images);
  return gal[0] || "";
}
/* Fino a 3 foto (copertina + prime immagini della galleria, senza ripetere la copertina) da
   mostrare in alto come striscia, ciascuna intera e senza deformazioni. */
function getPhotoSet(){
  var o = opportunity||{};
  var cover = getCoverImage();
  var gal = normalizeGallery(o.gallery_images).map(clean).filter(Boolean);
  var set = [];
  if(cover) set.push(cover);
  gal.forEach(function(url){ if(set.length<3 && set.indexOf(url)===-1) set.push(url); });
  return set.slice(0,3);
}

function renderSheet(){
  var o = opportunity;
  if(!o){ sheetBox.innerHTML = '<div style="padding:42px;color:#9c2f2f">Opportunità non trovata.</div>'; return; }
  var cover = getCoverImage();
  var addr = getAddress();
  var price = getPrice();
  var desc = getDescription();
  var lat = Number(o.latitude), lng = Number(o.longitude);
  var hasCoords = Number.isFinite(lat) && Number.isFinite(lng);

  var featItems = FEATURES.filter(function(f){ return o[f.col] === true; }).map(function(f){
    return '<div class="feat-item"><span class="ic">'+ICONS[f.icon]+'</span><span>'+escapeHTML(T[f.key])+'</span></div>';
  }).join("");

  var addrLabel = ADDRESS_LABELS[CURRENT_LANG] || ADDRESS_LABELS.it;
  var mapHTML = hasCoords
    ? '<div class="map-row">' +
        '<img class="map-frame" id="mapImg" data-lat="'+escapeHTML(String(lat))+'" data-lng="'+escapeHTML(String(lng))+'" alt="Mappa posizione immobile">' +
        '<div class="map-address-panel">' +
          '<div class="map-address-label">'+escapeHTML(addrLabel)+'</div>' +
          '<div class="map-address-text">'+escapeHTML(addr || "—")+'</div>' +
        '</div>' +
      '</div>'
    : (addr ? '<div class="map-address-panel standalone"><div class="map-address-label">'+escapeHTML(addrLabel)+'</div><div class="map-address-text">'+escapeHTML(addr)+'</div></div>' : "");

  var photos = getPhotoSet();
  var photoStripHTML = photos.length
    ? '<div class="photo-strip">' + photos.map(function(url){
        return '<div class="photo-box"><div class="photo-box-img" style="background-image:url(&quot;'+escapeHTML(url)+'&quot;)"></div></div>';
      }).join("") + '</div>'
    : "";

  sheetBox.innerHTML =
    '<div class="sheet" id="sheetPrintable">' +
      '<div class="sheet-header-block">' +
        '<div class="sheet-brand">'+escapeHTML(T.brand_kicker)+'</div>' +
        '<div class="sheet-title">'+escapeHTML(getTitle())+'</div>' +
        (addr ? '<div class="sheet-address">'+escapeHTML(addr)+'</div>' : '') +
        (price ? '<div class="sheet-price">'+escapeHTML(price)+'</div>' : '') +
      '</div>' +
      photoStripHTML +
      '<div class="sheet-body">' +
        (desc ? '<div class="sheet-desc">'+escapeHTML(desc)+'</div><div class="sheet-rule"></div>' : '') +
        '<div class="core-row">' +
          (Number.isFinite(Number(o.bedrooms)) && o.bedrooms>0 ? '<div class="core-chip"><span class="ic">'+ICONS.bed+'</span><div><div class="cv">'+escapeHTML(String(o.bedrooms))+'</div><div class="cl">'+escapeHTML(T.label_bedrooms)+'</div></div></div>' : '') +
          (Number.isFinite(Number(o.bathrooms)) && o.bathrooms>0 ? '<div class="core-chip"><span class="ic">'+ICONS.bath+'</span><div><div class="cv">'+escapeHTML(String(o.bathrooms))+'</div><div class="cl">'+escapeHTML(T.label_bathrooms)+'</div></div></div>' : '') +
          (Number.isFinite(Number(o.internal_size)) && o.internal_size>0 ? '<div class="core-chip"><span class="ic">'+ICONS.size+'</span><div><div class="cv">'+escapeHTML(String(o.internal_size))+'</div><div class="cl">'+escapeHTML(T.label_internal_size)+'</div></div></div>' : '') +
          (Number.isFinite(Number(o.land_size)) && o.land_size>0 ? '<div class="core-chip"><span class="ic">'+ICONS.land+'</span><div><div class="cv">'+escapeHTML(String(o.land_size))+'</div><div class="cl">'+escapeHTML(T.label_land_size)+'</div></div></div>' : '') +
        '</div>' +
        (featItems ? '<div class="feat-grid">'+featItems+'</div>' : '') +
        mapHTML +
      '</div>' +
      '<div class="sheet-footer"><span>IMMONOVA'+(GENERATION_STAMP?' &middot; '+escapeHTML(GENERATION_STAMP):'')+'</span><span>'+escapeHTML(T.footer_confidential)+'</span></div>' +
    '</div>';

  if(hasCoords) loadMapImage();
}

async function loadMapImage(){
  var img = document.getElementById("mapImg");
  if(!img) return;
  var lat = img.getAttribute("data-lat"), lng = img.getAttribute("data-lng");
  try{
    var url = SUPABASE_URL+"/functions/v1/static-map-proxy?lat="+encodeURIComponent(lat)+"&lng="+encodeURIComponent(lng)+"&zoom=15&size=1200x600&scale=2";
    var res = await fetch(url,{headers:{"Authorization":"Bearer "+SUPABASE_ANON_KEY,"apikey":SUPABASE_ANON_KEY}});
    if(!res.ok){ console.warn("Mappa non caricata:",res.status); return; }
    var blob = await res.blob();
    img.src = URL.createObjectURL(blob);
  }catch(e){ console.warn("Mappa: errore fetch",e); }
}

function setStatus(msg, cls){ statusBox.textContent = msg||""; statusBox.className = "status"+(cls?" "+cls:""); }

function waitForImagesToLoad(root, timeoutMs){
  timeoutMs = timeoutMs || 8000;
  var imgs = Array.prototype.slice.call((root||document).querySelectorAll("img"));
  return Promise.all(imgs.map(function(img){
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(function(resolve){
      var done=false;
      function finish(){ if(!done){ done=true; resolve(); } }
      img.addEventListener("load",finish,{once:true});
      img.addEventListener("error",finish,{once:true});
      setTimeout(finish,timeoutMs);
    });
  }));
}

function slugify(s){
  return String(s||"immobile").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60) || "immobile";
}

/* Estrae il path interno dello Storage bucket "dossier-pdfs" da un URL pubblico, per poter
   cancellare il PDF precedente prima di caricare quello nuovo (senza questo, ogni "Genera
   link" lascerebbe il vecchio file abbandonato nel bucket, occupando spazio inutilmente). */
function extractDossierPdfsStoragePath(publicUrl){
  var marker = "/dossier-pdfs/";
  var idx = String(publicUrl||"").indexOf(marker);
  if(idx === -1) return null;
  var path = publicUrl.slice(idx + marker.length).split("?")[0];
  try{ path = decodeURIComponent(path); }catch(e){}
  return path || null;
}

/* Le immagini di sfondo (CSS background-image, usate per le foto della striscia in alto) non
   sono <img> e quindi waitForImagesToLoad non le aspetta — senza questo preload esplicito
   html2canvas può catturare la pagina prima che il browser abbia scaricato le foto,
   producendo riquadri vuoti. */
function waitForBackgroundImagesToLoad(root, timeoutMs){
  timeoutMs = timeoutMs || 8000;
  var els = Array.prototype.slice.call((root||document).querySelectorAll(".photo-box-img"));
  return Promise.all(els.map(function(el){
    var bg = el.style.backgroundImage || "";
    var m = bg.match(/url\((['"]?)(.*?)\1\)/);
    if(!m || !m[2]) return Promise.resolve();
    return new Promise(function(resolve){
      var done=false;
      function finish(){ if(!done){ done=true; resolve(); } }
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = finish;
      img.onerror = finish;
      img.src = m[2];
      setTimeout(finish, timeoutMs);
    });
  }));
}

async function generateOneSheetPdfBlob(){
  var mapImg = document.getElementById("mapImg");
  if(mapImg){
    var waited=0;
    while(waited<5000 && String(mapImg.src||"").indexOf("blob:")!==0 && mapImg.hasAttribute("data-lat")){
      await new Promise(function(r){ setTimeout(r,100); });
      waited+=100;
    }
  }
  var el = document.getElementById("sheetPrintable");
  if(!el) throw new Error("Scheda non trovata da esportare.");
  await waitForImagesToLoad(el, 8000);
  await waitForBackgroundImagesToLoad(el, 8000);
  var canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:"#ffffff"});
  var imgData = canvas.toDataURL("image/jpeg", 0.94);
  // La pagina PDF viene dimensionata esattamente sulla proporzione del contenuto reale
  // (una sola scheda, non un modulo A4 standard) cosi' non resta mai mezza vuota in basso
  // quando il contenuto e' piu' corto di una A4 intera, ne' viene tagliato quando e' piu' lungo.
  var pageWidthMM = 210;
  var ratio = canvas.height / canvas.width;
  var pageHeightMM = pageWidthMM * ratio;
  var MAX_HEIGHT_MM = 420; // doppia A4: oltre questo limite si passa a piu' pagine standard
  var pdf, w = pageWidthMM, h = pageHeightMM;
  if(pageHeightMM <= MAX_HEIGHT_MM){
    pdf = new window.jspdf.jsPDF({orientation:"portrait", unit:"mm", format:[pageWidthMM, pageHeightMM]});
    pdf.addImage(imgData, "JPEG", 0, 0, w, h);
  }else{
    pdf = new window.jspdf.jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    var pageH = 297;
    var pages = Math.ceil(h / pageH);
    for(var i=0;i<pages;i++){
      if(i>0) pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, -(i*pageH), w, h);
    }
  }
  return pdf.output("blob");
}

function renderLinkRow(url){
  if(!url){ linkRow.className="link-row"; linkRow.innerHTML=""; return; }
  linkRow.className = "link-row visible";
  linkRow.innerHTML =
    '<span class="link-label">Link scheda:</span>'+
    '<input type="text" id="shareLinkInput" readonly value="'+escapeHTML(url)+'" onclick="this.select()">'+
    '<button type="button" class="copy-btn" id="copyLinkBtn">Copia link</button>'+
    '<span class="copy-feedback" id="copyFeedback"></span>';
  document.getElementById("copyLinkBtn").addEventListener("click", async function(){
    var fb = document.getElementById("copyFeedback");
    try{ await navigator.clipboard.writeText(url); fb.textContent = "Copiato ✓"; }
    catch(e){ window.prompt("Copia manualmente il link:", url); }
    setTimeout(function(){ if(fb) fb.textContent=""; }, 2500);
  });
}

/* Elenco dei link già generati per lingua (salvati in opportunity.onesheet_links), cosi' non
   serve rigenerare ogni volta: se per una lingua esiste già un link, basta copiarlo. */
function renderLangLinksPanel(){
  var links = (opportunity && opportunity.onesheet_links) || {};
  var langs = Object.keys(links).filter(function(l){ return links[l] && links[l].share_url; });
  if(!langs.length){ langLinksPanel.hidden = true; langLinksList.innerHTML=""; return; }
  langs.sort();
  langLinksList.innerHTML = langs.map(function(lang){
    var entry = links[lang];
    var url = entry.share_url || entry.pdf_url;
    var dateLabel = "";
    if(entry.generated_at){
      try{ dateLabel = new Date(entry.generated_at).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){}
    }
    return '<div class="lang-links-row" data-lang="'+escapeHTML(lang)+'">'+
      '<span class="lang-tag">'+escapeHTML(lang.toUpperCase())+'</span>'+
      (dateLabel ? '<span class="lang-date">'+escapeHTML(dateLabel)+'</span>' : '')+
      '<a class="open-link" href="'+escapeHTML(url)+'" target="_blank" rel="noopener">Apri</a>'+
      '<button type="button" class="copy-btn" data-url="'+escapeHTML(url)+'">Copia link</button>'+
      '<span class="copy-feedback"></span>'+
    '</div>';
  }).join("");
  langLinksPanel.hidden = false;
  Array.prototype.forEach.call(langLinksList.querySelectorAll(".copy-btn"), function(btn){
    btn.addEventListener("click", async function(){
      var url = btn.getAttribute("data-url");
      var fb = btn.nextElementSibling;
      try{ await navigator.clipboard.writeText(url); if(fb) fb.textContent = "Copiato ✓"; }
      catch(e){ window.prompt("Copia manualmente il link:", url); }
      setTimeout(function(){ if(fb) fb.textContent=""; }, 2500);
    });
  });
}

async function generateOneSheetLink(){
  generateLinkBtn.disabled = true;
  var originalLabel = generateLinkBtn.textContent;
  generateLinkBtn.classList.add("btn-busy");
  generateLinkBtn.classList.remove("btn-success");
  generateLinkBtn.textContent = T.generating || "Generazione in corso...";
  try{
    // Timbro visibile con data/ora esatta di questa generazione, stampato nel footer della
    // scheda e quindi anche nel PDF: cosi' si vede subito, a occhio, se un PDF che si sta
    // guardando e' quello appena generato o uno vecchio (basta confrontare l'orario).
    GENERATION_STAMP = "Generata il " + new Date().toLocaleString("it-IT", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    await applyLanguage(CURRENT_LANG);
    renderSheet();
    await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
    setStatus("Generazione PDF in corso...","");
    var previousPdfUrl = (opportunity && opportunity.onesheet_pdf_url) || null;
    var pdfBlob = await generateOneSheetPdfBlob();
    var filename = "onesheet_IMMONOVA_"+slugify(getTitle())+"_"+CURRENT_LANG+".pdf";
    var path = "onesheet/opportunity-"+(opportunityId||"na")+"/"+Date.now()+"_"+filename;
    var upload = await client.storage.from("dossier-pdfs").upload(path, pdfBlob, {contentType:"application/pdf", upsert:true});
    if(upload.error) throw upload.error;
    var pub = client.storage.from("dossier-pdfs").getPublicUrl(path);
    var pdfUrl = pub.data.publicUrl;

    // Cancella il PDF della generazione precedente, ora che il nuovo è caricato con successo
    // (mai prima: se l'upload nuovo fallisse, non deve sparire l'unico PDF ancora valido).
    if(previousPdfUrl && previousPdfUrl !== pdfUrl){
      var previousPath = extractDossierPdfsStoragePath(previousPdfUrl);
      if(previousPath){
        try{
          var removeRes = await client.storage.from("dossier-pdfs").remove([previousPath]);
          if(removeRes.error) console.warn("Cancellazione PDF precedente fallita:", removeRes.error);
        }catch(removeErr){ console.warn("Cancellazione PDF precedente fallita:", removeErr); }
      }
    }

    // Il pulsante torna subito utilizzabile (non deve più aspettare la pubblicazione su
    // GitHub per sbloccarsi) — ma il link NON è ancora mostrato/copiabile: compare SOLO
    // quando la pagina con anteprima è davvero pronta e verificata, mai prima. Nessun link
    // "provvisorio" da copiare per sbaglio prima che sia pubblicato.
    renderLinkRow(null);
    generateLinkBtn.classList.remove("btn-busy");
    generateLinkBtn.classList.add("btn-success");
    generateLinkBtn.disabled = false;
    generateLinkBtn.textContent = originalLabel;
    setTimeout(function(){ generateLinkBtn.classList.remove("btn-success"); }, 3000);
    setStatus("PDF pronto. Pubblicazione del link con anteprima in corso...","");

    publishAndFinalize(pdfUrl, CURRENT_LANG); // non attesa: gira in background — mostrerà il link solo a pubblicazione confermata
  }catch(e){
    console.error(e);
    setStatus("Errore nella generazione: "+(e.message||e),"error");
    generateLinkBtn.classList.remove("btn-busy");
    generateLinkBtn.disabled = false;
    generateLinkBtn.textContent = originalLabel;
  }
}

// Tutta la pubblicazione su GitHub (compressione copertina + traduzione stringhe fisse +
// commit sul repo, poi attesa che la CDN di GitHub Pages serva davvero il contenuto nuovo)
// gira qui in background, SENZA bloccare il pulsante "Genera link": il PDF diretto è già
// copiabile da subito, questa funzione si limita ad "aggiornare" il link quando l'anteprima
// WhatsApp è pronta.
async function publishAndFinalize(pdfUrl, lang){
  var shareUrl = null;
  try{
    var publishResp = await fetch(String(SUPABASE_URL||"").replace(/\/+$/,"")+"/functions/v1/publish-onesheet-page",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY},
      body:JSON.stringify({
        opportunityId: opportunityId,
        title: getTitle(),
        coverUrl: getCoverImage(),
        pdfUrl: pdfUrl,
        lang: lang||"it"
      })
    });
    var publishData = await publishResp.json();
    if(publishResp.ok && publishData && publishData.url){ shareUrl = publishData.url; }
    else console.warn("Pubblicazione scheda su GitHub fallita:",publishData);
  }catch(publishErr){
    console.warn("Pubblicazione scheda su GitHub fallita:",publishErr);
  }

  var finalUrl = shareUrl || pdfUrl;

  if(!shareUrl){
    // Pubblicazione fallita: NESSUN link va mostrato/copiabile, nemmeno quello diretto al PDF —
    // il link compare solo quando la pagina con anteprima è confermata pubblicata, mai prima.
    if(lang === CURRENT_LANG) setStatus("PDF generato, ma la pubblicazione del link con anteprima non è riuscita: nessun link disponibile. Controlla la console e riprova.","error");
    return;
  }

  // Il link resta nascosto finché la pagina non è davvero raggiungibile su GitHub Pages CON IL
  // CONTENUTO NUOVO. Un semplice check.ok non basta quando si rigenera una scheda già pubblicata
  // in precedenza: il file esiste già a quell'URL, quindi risponde 200 SUBITO — ma il CDN di
  // GitHub Pages può ancora servire per alcuni minuti la versione precedente in cache. Per questo
  // si controlla che il corpo della risposta contenga davvero l'URL del PDF appena generato
  // (unico ad ogni generazione), non solo che la richiesta sia andata a buon fine. Solo a
  // verifica completata il link diventa visibile/copiabile.
  var attempts = 0, maxAttempts = 60;
  var confirmed = false;
  var cacheBustUrl = shareUrl + (shareUrl.indexOf("?")===-1 ? "?" : "&") + "_cb=" + Date.now();
  while(attempts < maxAttempts){
    attempts++;
    try{
      var check = await fetch(cacheBustUrl, {method:"GET", cache:"no-store"});
      if(check.ok){
        var checkText = await check.text();
        if(checkText.indexOf(pdfUrl) !== -1){ confirmed = true; break; }
      }
    }catch(e){}
    await new Promise(function(r){ setTimeout(r,3000); });
  }
  // Il link (sia quello mostrato in pagina che quello salvato/visibile nel pannello per lingua)
  // diventa visibile/copiabile SOLO ORA, dopo la conferma — mai prima, nemmeno "a scatola
  // chiusa" solo perché la richiesta di pubblicazione è andata a buon fine: se scade il tempo
  // massimo senza conferma, non si salva né si mostra nessun link.
  if(confirmed){
    try{
      var updatedLinks = Object.assign({}, (opportunity && opportunity.onesheet_links) || {});
      updatedLinks[lang||"it"] = { pdf_url: pdfUrl, share_url: shareUrl, generated_at: new Date().toISOString() };
      await client.from("opportunities").update({onesheet_pdf_url:pdfUrl, onesheet_share_url:shareUrl, onesheet_links:updatedLinks}).eq("id",opportunityId);
      if(opportunity){ opportunity.onesheet_pdf_url = pdfUrl; opportunity.onesheet_share_url = shareUrl; opportunity.onesheet_links = updatedLinks; }
      if(lang === CURRENT_LANG) renderLangLinksPanel();
    }catch(saveErr){ console.warn("Salvataggio link one-sheet fallito:",saveErr); }
  }

  if(lang === CURRENT_LANG){
    if(confirmed){
      renderLinkRow(finalUrl);
      setStatus("Link generato, con anteprima.","success");
    }else{
      renderLinkRow(null);
      setStatus("PDF pubblicato, ma non è stato possibile confermare che l'anteprima sia già aggiornata sulla CDN: riprova tra qualche minuto prima di copiare il link.","error");
    }
  }
}

langSelect.addEventListener("change", async function(){
  await applyLanguage(langSelect.value);
  renderSheet();
});
generateLinkBtn.addEventListener("click", generateOneSheetLink);
if(logoutBtn) logoutBtn.addEventListener("click", async function(){ await client.auth.signOut(); window.location.href="login.html"; });

async function checkAuth(){
  var { data:{ session } } = await client.auth.getSession();
  if(!session){ window.location.href = "login.html"; return false; }
  return true;
}

async function init(){
  var ok = await checkAuth();
  if(!ok) return;
  if(!opportunityId){ sheetBox.innerHTML = '<div style="padding:42px;color:#9c2f2f">ID opportunità mancante nell\'URL.</div>'; return; }
  editLink.href = "opportunity-edit.html?id="+encodeURIComponent(opportunityId);
  setStatus(T.loading,"");
  var res = await client.from("opportunities").select("*").eq("id", opportunityId).single();
  if(res.error || !res.data){
    setStatus("Errore nel caricamento dell'opportunità: "+(res.error?res.error.message:"non trovata"),"error");
    sheetBox.innerHTML = '<div style="padding:42px;color:#9c2f2f">Opportunità non trovata.</div>';
    return;
  }
  opportunity = res.data;
  pageTitleUpdate();
  setStatus("","");
  renderSheet();
  // Solo lo share_url (pagina con anteprima pubblicata e confermata su GitHub) rende il link
  // copiabile: mai il pdf_url grezzo come "ripiego", nemmeno al caricamento della pagina —
  // altrimenti una generazione precedente la cui pubblicazione era fallita resterebbe comunque
  // copiabile riaprendo semplicemente la scheda.
  if(opportunity.onesheet_share_url){
    renderLinkRow(opportunity.onesheet_share_url);
  }
  renderLangLinksPanel();
}
function pageTitleUpdate(){
  document.getElementById("pageTitle").textContent = getTitle();
  document.title = getTitle()+" — Scheda IMMONOVA";
}

init();
