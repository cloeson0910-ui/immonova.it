<!DOCTYPE html>
<html lang="it">
<head>
<link rel="stylesheet" href="../css/immonova-text-theme.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note Vocali | IMMONOVA Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}

body{
background:#f4ecdf;
font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
color:var(--c-46371a);
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
#f4ecdf;
}

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
background-size:230px 199px;
opacity:.30;
}

.header{
padding:30px 40px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(166,127,52,.12);
flex-wrap:wrap;
gap:18px;
}

.logo{font-size:24px;font-weight:300;letter-spacing:.35em;color:var(--c-5b461d)}

.header-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.header-actions a,
.logout{
padding:10px 20px;
border:1px solid rgba(166,127,52,.25);
background:rgba(255,255,255,.25);
cursor:pointer;
color:var(--c-5b461d);
text-decoration:none;
font-size:12px;
letter-spacing:.14em;
text-transform:uppercase;
}

.container{max-width:1400px;margin:auto;padding:40px}

.title{font-size:42px;font-weight:200;letter-spacing:.05em;color:var(--c-5b461d);margin-bottom:18px}

.subtitle{font-size:15px;line-height:1.8;color:var(--c-4f4125);max-width:760px;margin-bottom:28px}

.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}

.filters select, .filters input{
padding:10px 14px;
border:1px solid rgba(166,127,52,.25);
background:rgba(255,255,255,.25);
color:var(--c-5b461d);
font-size:12px;
outline:none;
}

.status-message{margin-bottom:18px;font-size:13px;min-height:18px}

.notes-grid{display:flex;flex-direction:column;gap:18px}

.note-card{
background:rgba(255,255,255,.22);
backdrop-filter:blur(8px);
border:1px solid rgba(166,127,52,.15);
padding:24px 28px;
}

.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}

.note-meta{font-size:12px;color:var(--c-4f4125)}
.note-meta strong{color:var(--c-46371a)}

.note-actions{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{
padding:8px 12px;
border:1px solid rgba(166,127,52,.28);
background:rgba(255,255,255,.3);
color:var(--c-5b461d);
cursor:pointer;
font-size:10px;
letter-spacing:.08em;
text-transform:uppercase;
font-family:inherit;
white-space:nowrap;
}
.action-btn:hover{background:#a67f34;color:var(--c-ffffff)}
.action-btn.danger{border-color:rgba(156,47,47,.35);color:var(--c-561a1a)}
.action-btn.danger:hover{background:#9c2f2f;color:var(--c-ffffff)}

.badge{
display:inline-block;
padding:5px 11px;
border:1px solid rgba(166,127,52,.3);
font-size:10px;
letter-spacing:.14em;
text-transform:uppercase;
color:var(--c-5b461d);
background:rgba(255,255,255,.3);
border-radius:999px;
margin-right:6px;
}

.note-transcript{
font-size:13px;
line-height:1.7;
color:var(--c-4a3c1f);
background:rgba(255,255,255,.4);
border:1px dashed rgba(166,127,52,.25);
padding:14px 16px;
margin-bottom:14px;
white-space:pre-wrap;
}

table.result{width:100%;border-collapse:collapse;font-size:13px}
table.result th,table.result td{text-align:left;padding:9px 12px;border-bottom:1px solid rgba(166,127,52,.1)}
table.result th{width:38%;color:var(--c-4f4125);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em}

.empty{padding:60px 20px;text-align:center;opacity:.7}

@media(max-width:900px){
.header{flex-direction:column;align-items:flex-start}
}
@media(max-width:600px){
.container{padding:20px}
.note-card{padding:18px}
}
</style>
</head>

<body>

<header class="header">
<div class="logo">IMMONOVA</div>
<div class="header-actions">
<a href="../collaboratore.html" class="mobile-quick-back" style="display:none">&larr; Funzioni rapide</a>
<a href="dashboard.html">Dashboard</a>
<a href="calendar.html">Calendario</a>
<a href="opportunities.html">Immobili</a>
<button class="logout" id="logoutBtn">Logout</button>
</div>
<style>@media(max-width:820px){.mobile-quick-back{display:inline-block!important}}</style>
</header>

<div class="container">

<h1 class="title">Note Vocali</h1>
<p class="subtitle">Tutte le note vocali registrate dai collaboratori dall'app, con trascrizione completa e i dati estratti automaticamente (paese, tipo immobile, camere, bagni, budget, parole chiave).</p>

<div id="statusMessage" class="status-message"></div>

<div class="filters">
  <select id="filterCategory">
    <option value="">Tutte le categorie</option>
    <option value="visita_immobile">Report visita immobile</option>
    <option value="nota_cliente">Nota su cliente/lead</option>
    <option value="generico">Appunto generico</option>
  </select>
  <select id="filterCollaborator">
    <option value="">Tutti i collaboratori</option>
  </select>
  <input type="text" id="filterSearch" placeholder="Cerca nella trascrizione...">
</div>

<div class="notes-grid" id="notesGrid">
  <div class="empty">Caricamento...</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let allNotes = [];

const CATEGORY_LABELS = {
  visita_immobile: "Report visita immobile",
  nota_cliente: "Nota su cliente/lead",
  generico: "Appunto generico"
};

async function checkAuth(){
  const { data:{ session } } = await client.auth.getSession();
  if(!session){
    window.location.href = "login.html";
    return false;
  }
  currentUser = session.user;
  return true;
}

function formatDate(value){
  if(!value) return "";
  const date = new Date(value);
  return date.toLocaleDateString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function escapeHTML(value){
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function populateCollaboratorFilter(notes){
  var sel = document.getElementById("filterCollaborator");
  var seen = {};
  var names = [];
  notes.forEach(function(n){
    var name = n.collaborator_name || "Sconosciuto";
    if(!seen[name]){ seen[name]=true; names.push(name); }
  });
  names.sort();
  sel.innerHTML = '<option value="">Tutti i collaboratori</option>' +
    names.map(function(n){ return '<option value="'+escapeHTML(n)+'">'+escapeHTML(n)+'</option>'; }).join("");
}

function renderNotes(){
  var grid = document.getElementById("notesGrid");
  var cat = document.getElementById("filterCategory").value;
  var collab = document.getElementById("filterCollaborator").value;
  var search = document.getElementById("filterSearch").value.trim().toLowerCase();

  var filtered = allNotes.filter(function(n){
    if(cat && n.category !== cat) return false;
    if(collab && (n.collaborator_name||"Sconosciuto") !== collab) return false;
    if(search && !(n.transcript||"").toLowerCase().includes(search)) return false;
    return true;
  });

  if(!filtered.length){
    grid.innerHTML = '<div class="empty">Nessuna nota vocale trovata con questi filtri.</div>';
    return;
  }

  grid.innerHTML = filtered.map(function(n){
    var rows = (n.extracted && n.extracted.table) ? n.extracted.table : [];
    var tableHtml = rows.map(function(r){
      return '<tr><th>'+escapeHTML(r.campo)+'</th><td>'+escapeHTML(r.valore)+'</td></tr>';
    }).join("");
    return '' +
      '<div class="note-card">' +
        '<div class="note-top">' +
          '<div class="note-meta"><span class="badge">'+escapeHTML(CATEGORY_LABELS[n.category]||n.category)+'</span> ' +
            '<strong>'+escapeHTML(n.collaborator_name||"Sconosciuto")+'</strong> &middot; '+formatDate(n.created_at) +
          '</div>' +
          '<div class="note-actions">' +
            '<button type="button" class="action-btn" onclick="exportNote(\''+n.id+'\',\'notizia\')">Esporta &rarr; Notizia</button>' +
            '<button type="button" class="action-btn" onclick="exportNote(\''+n.id+'\',\'mandato\')">Esporta &rarr; Mandato</button>' +
            '<button type="button" class="action-btn danger" onclick="deleteNote(\''+n.id+'\')">Elimina</button>' +
          '</div>' +
        '</div>' +
        '<div class="note-transcript">'+escapeHTML(n.transcript)+'</div>' +
        '<table class="result">'+tableHtml+'</table>' +
      '</div>';
  }).join("");
}

async function loadNotes(){
  var grid = document.getElementById("notesGrid");
  var status = document.getElementById("statusMessage");
  var res = await client
    .from("immonova_voice_notes")
    .select("id, collaborator_name, category, transcript, extracted, created_at")
    .order("created_at", { ascending:false })
    .limit(500);

  if(res.error){
    status.className = "status-message error";
    status.textContent = "Errore nel caricamento: " + res.error.message;
    grid.innerHTML = '<div class="empty">Errore nel caricamento delle note.</div>';
    return;
  }

  allNotes = res.data || [];
  status.textContent = "";
  populateCollaboratorFilter(allNotes);
  renderNotes();
}

async function deleteNote(id){
  if(!window.confirm("Eliminare definitivamente questa nota vocale e la tabella associata? L'operazione non è reversibile.")) return;
  var res = await client.from("immonova_voice_notes").delete().eq("id", id);
  if(res.error){
    window.alert("Errore durante l'eliminazione: " + res.error.message);
    return;
  }
  allNotes = allNotes.filter(function(n){ return n.id !== id; });
  populateCollaboratorFilter(allNotes);
  renderNotes();
}

function exportNote(id, target){
  var note = allNotes.find(function(n){ return n.id === id; });
  if(!note) return;
  var structured = (note.extracted && note.extracted.structured) ? note.extracted.structured : {};
  var localita = structured.localita || structured.regione || "";
  var dateLabel = formatDate(note.created_at);
  var nomeCliente = structured.nome_cliente || "";
  var nomeParts = nomeCliente ? nomeCliente.split(/\s+/) : [];
  var clientFirstName = nomeParts.length ? nomeParts[0] : "";
  var clientLastName = nomeParts.length > 1 ? nomeParts.slice(1).join(" ") : "";
  var payload = {
    target: target,
    source_note_id: note.id,
    title: "Nota vocale" + (localita ? " - " + localita : "") + " - " + dateLabel,
    body: note.transcript,
    address: localita,
    structured: structured,
    client_name: nomeCliente,
    client_first_name: clientFirstName,
    client_last_name: clientLastName,
    category: note.category,
    created_at: note.created_at
  };
  sessionStorage.setItem("immonova_voice_note_export", JSON.stringify(payload));
  var targetUrl = target === "notizia" ? "notizie.html" : "search-mandate-form.html";
  window.open(targetUrl, "_blank");
}

document.getElementById("filterCategory").addEventListener("change", renderNotes);
document.getElementById("filterCollaborator").addEventListener("change", renderNotes);
document.getElementById("filterSearch").addEventListener("input", renderNotes);

document.getElementById("logoutBtn").addEventListener("click", async function(){
  await client.auth.signOut();
  window.location.href = "login.html";
});

(async function init(){
  var ok = await checkAuth();
  if(!ok) return;
  await loadNotes();
})();
</script>

</body>
</html>
