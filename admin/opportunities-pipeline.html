<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposte | IMMONOVA Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#7f6430;padding-bottom:60px}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),#f4ecdf}
header{position:sticky;top:0;z-index:20;background:rgba(244,236,223,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(166,127,52,.18);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
header a.back{color:#a67f34;text-decoration:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(166,127,52,.28);padding:10px 16px}
header h1{font-size:18px;font-weight:300;letter-spacing:.1em;color:#a67f34;margin:0}
.container{max-width:1180px;margin:0 auto;padding:36px 32px 60px}
.panel{background:rgba(255,255,255,.24);border:1px solid rgba(166,127,52,.18);box-shadow:0 24px 70px rgba(127,100,48,.07);padding:26px 26px 28px;margin-bottom:24px}
.panel-title{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9a793c;margin-bottom:16px}
button,.btn{cursor:pointer;font-family:inherit}
.btn{padding:11px 16px;border:1px solid #a67f34;background:#a67f34;color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.secondary{background:rgba(255,255,255,.3);color:#a67f34}
.btn:disabled{opacity:.5;cursor:default}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.filters input[type="text"]{flex:1;min-width:220px;padding:12px 14px;border:1px solid rgba(166,127,52,.28);background:#fff;font-size:14px;font-family:inherit;color:#4a3c1f}
.filters select{padding:12px 14px;border:1px solid rgba(166,127,52,.28);background:#fff;font-size:13px;font-family:inherit;color:#4a3c1f}
.status-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chip{padding:7px 14px;border:1px solid rgba(166,127,52,.3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8f7643;cursor:pointer;background:rgba(255,255,255,.25)}
.chip.active{background:#a67f34;color:#fff;border-color:#a67f34}

.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
@media(max-width:900px){.summary-row{grid-template-columns:repeat(2,1fr)}}
.summary-card{background:rgba(255,255,255,.28);border:1px solid rgba(166,127,52,.18);padding:16px 18px}
.summary-card .sc-num{font-size:24px;color:#a67f34;font-weight:300}
.summary-card .sc-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8f7643;margin-top:4px}

.offer-list{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.offer-card{background:rgba(255,255,255,.3);border:1px solid rgba(166,127,52,.18);padding:18px 20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;cursor:pointer;transition:background .15s}
.offer-card:hover{background:rgba(255,255,255,.5)}
.offer-main{flex:1;min-width:240px}
.offer-title{font-size:15.5px;color:#4a3c1f;font-weight:600}
.offer-sub{font-size:12.5px;color:#8f7643;margin-top:4px}
.offer-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#8f7643;margin-top:10px}
.offer-meta strong{color:#4a3c1f}
.offer-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.badge{padding:5px 12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent}
.badge-bozza{background:rgba(143,118,67,.15);color:#8f7643;border-color:rgba(143,118,67,.3)}
.badge-inviata{background:rgba(166,127,52,.15);color:#a67f34;border-color:rgba(166,127,52,.35)}
.badge-accettata{background:rgba(81,122,79,.15);color:#4f7f45;border-color:rgba(81,122,79,.35)}
.badge-rifiutata{background:rgba(156,47,47,.12);color:#9c2f2f;border-color:rgba(156,47,47,.3)}
.badge-controfferta_ricevuta{background:rgba(166,100,52,.15);color:#a66434;border-color:rgba(166,100,52,.35)}
.badge-ritirata{background:rgba(143,118,67,.1);color:#8f7643;border-color:rgba(143,118,67,.25)}
.badge-scaduta{background:rgba(120,120,120,.15);color:#666;border-color:rgba(120,120,120,.3)}
.badge-controfferta-kind{background:rgba(74,60,31,.08);color:#4a3c1f;border:1px solid rgba(74,60,31,.2);padding:3px 9px;font-size:10px}
.expiry-warning{color:#9c2f2f;font-weight:600}

.empty-state,.loading-state{text-align:center;padding:60px 20px;color:#8f7643;font-size:13.5px}
.msg-box{margin-top:14px;font-size:12.5px;color:#8f7643}
.msg-box.error{color:#9c2f2f}
</style>
</head>
<body>

<header>
  <a href="dashboard.html" class="back">← Dashboard</a>
  <h1>🖋️ Proposte</h1>
  <button type="button" class="btn secondary" id="logoutBtn">Logout</button>
</header>

<div class="container">

  <div class="summary-row" id="summaryRow"></div>

  <div class="panel">
    <div class="panel-title">Proposte / Controfferte salvate</div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Cerca per immobile, proponente o venditore…">
      <select id="sortSelect">
        <option value="created_desc">Più recenti prima</option>
        <option value="created_asc">Meno recenti prima</option>
        <option value="expiry_asc">Scadenza più vicina prima</option>
        <option value="price_desc">Prezzo più alto prima</option>
      </select>
    </div>

    <div class="status-chips" id="statusChips"></div>

    <div class="msg-box" id="listMsg"></div>
    <div class="offer-list" id="offerList"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/site-branding.js"></script>

<script>
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var allOffers = [];
var opportunityById = {};
var activeStatus = "tutte";

var STATUS_LABELS = {
  bozza: "Bozza",
  inviata: "Inviata",
  accettata: "Accettata",
  rifiutata: "Rifiutata",
  controfferta_ricevuta: "Controfferta ricevuta",
  ritirata: "Ritirata",
  scaduta: "Scaduta"
};
var STATUS_ORDER = ["tutte","bozza","inviata","controfferta_ricevuta","accettata","rifiutata","ritirata","scaduta"];

function escapeHTML(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function fmtDate(d){ if(!d) return ""; try{ return new Date(d).toLocaleDateString("it-IT",{day:"2-digit",month:"long",year:"numeric"}); }catch(e){ return d; } }
function fmtPrice(p){ if(p == null || p === "") return ""; return "€ " + Number(p).toLocaleString("it-IT"); }
function fullBuyerName(o){ return [o.buyer_first_name, o.buyer_last_name].filter(Boolean).join(" ") || "—"; }
function fullSellerName(o){ return [o.seller_first_name, o.seller_last_name].filter(Boolean).join(" ") || "—"; }

async function checkAuth(){
  var result = await client.auth.getSession();
  if(result.error || !result.data.session){
    window.location.href = "login.html";
    return false;
  }
  currentUser = result.data.session.user;
  return true;
}

document.getElementById("logoutBtn").addEventListener("click", async function(){
  await client.auth.signOut();
  window.location.href = "login.html";
});

async function loadOffers(){
  var listMsg = document.getElementById("listMsg");
  var listBox = document.getElementById("offerList");
  listBox.innerHTML = '<div class="loading-state">Caricamento proposte…</div>';

  var result = await client
    .from("opportunity_offers")
    .select("id,opportunity_id,offer_kind,parent_offer_id,offered_price,buyer_first_name,buyer_last_name,seller_first_name,seller_last_name,status,offer_expires_at,created_at,notes")
    .order("created_at", { ascending: false });

  if(result.error){
    listMsg.className = "msg-box error";
    listMsg.textContent = "Errore nel caricamento delle proposte: " + result.error.message;
    listBox.innerHTML = "";
    return;
  }

  allOffers = result.data || [];

  var opportunityIds = Array.from(new Set(allOffers.map(function(o){ return o.opportunity_id; }).filter(Boolean)));
  opportunityById = {};
  if(opportunityIds.length){
    var oppResult = await client.from("opportunities").select("id,title,municipality,formatted_address,address").in("id", opportunityIds);
    (oppResult.data || []).forEach(function(o){ opportunityById[String(o.id)] = o; });
  }

  renderSummary();
  renderStatusChips();
  renderList();
}

function renderSummary(){
  var counts = { tutte: allOffers.length, in_corso: 0, accettata: 0, in_scadenza: 0 };
  var now = new Date();
  var soon = new Date(now.getTime() + 2*24*60*60*1000);
  allOffers.forEach(function(o){
    if(o.status === "bozza" || o.status === "inviata" || o.status === "controfferta_ricevuta") counts.in_corso++;
    if(o.status === "accettata") counts.accettata++;
    if((o.status === "bozza" || o.status === "inviata") && o.offer_expires_at){
      var exp = new Date(o.offer_expires_at);
      if(exp >= now && exp <= soon) counts.in_scadenza++;
    }
  });
  var box = document.getElementById("summaryRow");
  box.innerHTML =
    '<div class="summary-card"><div class="sc-num">' + counts.tutte + '</div><div class="sc-label">Totale proposte</div></div>' +
    '<div class="summary-card"><div class="sc-num">' + counts.in_corso + '</div><div class="sc-label">In corso</div></div>' +
    '<div class="summary-card"><div class="sc-num">' + counts.accettata + '</div><div class="sc-label">Accettate</div></div>' +
    '<div class="summary-card"><div class="sc-num">' + counts.in_scadenza + '</div><div class="sc-label">In scadenza (≤2 giorni)</div></div>' +
    '<div class="summary-card"><a href="offerta-form.html" class="btn" style="width:100%">+ Nuova proposta</a></div>';
}

function renderStatusChips(){
  var box = document.getElementById("statusChips");
  box.innerHTML = STATUS_ORDER.map(function(s){
    var label = s === "tutte" ? "Tutte" : (STATUS_LABELS[s] || s);
    var count = s === "tutte" ? allOffers.length : allOffers.filter(function(o){ return o.status === s; }).length;
    return '<div class="chip' + (activeStatus === s ? ' active' : '') + '" data-status="' + s + '">' + escapeHTML(label) + ' (' + count + ')</div>';
  }).join("");
  box.querySelectorAll(".chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      activeStatus = chip.getAttribute("data-status");
      renderStatusChips();
      renderList();
    });
  });
}

function renderList(){
  var listBox = document.getElementById("offerList");
  var q = document.getElementById("searchInput").value.trim().toLowerCase();
  var sortMode = document.getElementById("sortSelect").value;

  var filtered = allOffers.filter(function(o){
    if(activeStatus !== "tutte" && o.status !== activeStatus) return false;
    if(!q) return true;
    var opp = opportunityById[String(o.opportunity_id)];
    var haystack = [
      opp ? opp.title : "", opp ? opp.municipality : "",
      fullBuyerName(o), fullSellerName(o)
    ].join(" ").toLowerCase();
    return haystack.indexOf(q) !== -1;
  });

  filtered.sort(function(a, b){
    if(sortMode === "created_asc") return new Date(a.created_at) - new Date(b.created_at);
    if(sortMode === "price_desc") return (b.offered_price || 0) - (a.offered_price || 0);
    if(sortMode === "expiry_asc"){
      if(!a.offer_expires_at) return 1;
      if(!b.offer_expires_at) return -1;
      return new Date(a.offer_expires_at) - new Date(b.offer_expires_at);
    }
    return new Date(b.created_at) - new Date(a.created_at);
  });

  if(!filtered.length){
    listBox.innerHTML = '<div class="empty-state">Nessuna proposta trovata' + (q ? " per questa ricerca" : "") + '. <a href="offerta-form.html">Creane una nuova</a>.</div>';
    return;
  }

  var now = new Date();
  listBox.innerHTML = filtered.map(function(o){
    var opp = opportunityById[String(o.opportunity_id)];
    var propertyLabel = opp ? (opp.title + (opp.municipality ? " — " + opp.municipality : "")) : "Immobile #" + o.opportunity_id;
    var isCounter = o.offer_kind === "controfferta";
    var badgeClass = "badge-" + (o.status || "bozza");
    var expiryHTML = "";
    if((o.status === "bozza" || o.status === "inviata") && o.offer_expires_at){
      var exp = new Date(o.offer_expires_at);
      var daysLeft = Math.ceil((exp - now) / (24*60*60*1000));
      var isSoon = daysLeft <= 2;
      expiryHTML = '<span' + (isSoon ? ' class="expiry-warning"' : '') + '>Scade il ' + escapeHTML(fmtDate(o.offer_expires_at)) + (isSoon ? " ⚠" : "") + '</span>';
    }
    return '<div class="offer-card" data-offer-id="' + o.id + '">' +
      '<div class="offer-main">' +
        '<div class="offer-title">' + escapeHTML(propertyLabel) + (isCounter ? ' <span class="badge-controfferta-kind">Controfferta</span>' : '') + '</div>' +
        '<div class="offer-sub">Proponente: ' + escapeHTML(fullBuyerName(o)) + ' · Venditore: ' + escapeHTML(fullSellerName(o)) + '</div>' +
        '<div class="offer-meta">' +
          '<span><strong>' + escapeHTML(fmtPrice(o.offered_price) || "Prezzo n/d") + '</strong></span>' +
          '<span>Creata il ' + escapeHTML(fmtDate(o.created_at)) + '</span>' +
          (expiryHTML ? '<span>' + expiryHTML + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="offer-side">' +
        '<span class="badge ' + badgeClass + '">' + escapeHTML(STATUS_LABELS[o.status] || o.status) + '</span>' +
      '</div>' +
    '</div>';
  }).join("");

  listBox.querySelectorAll(".offer-card").forEach(function(card){
    card.addEventListener("click", function(){
      var id = card.getAttribute("data-offer-id");
      window.open("offer-detail.html?offer_id=" + encodeURIComponent(id), "_blank");
    });
  });
}

document.getElementById("searchInput").addEventListener("input", function(){ renderList(); });
document.getElementById("sortSelect").addEventListener("change", function(){ renderList(); });

(async function init(){
  var ok = await checkAuth();
  if(!ok) return;
  await loadOffers();
})();
</script>

</body>
</html>
