<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scheda Visita | IMMONOVA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f4ecdf;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#735f36}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),#f4ecdf}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px);background-size:230px 199px;opacity:.30}
.header{padding:22px 42px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(166,127,52,.14);background:rgba(244,236,223,.76);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
.logo{font-size:25px;letter-spacing:.18em;color:#a67f34;text-decoration:none;font-weight:300}.logo small{display:block;margin-top:6px;font-size:8px;font-weight:700;letter-spacing:.16em;color:#a58139}
.header-actions{display:flex;gap:12px;flex-wrap:wrap}.header-actions a,.header-actions button{padding:10px 15px;border:1px solid rgba(166,127,52,.28);background:rgba(255,255,255,.26);color:#a67f34;text-decoration:none;cursor:pointer;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.container{max-width:900px;margin:auto;padding:38px 24px 80px}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#9a793c;margin-bottom:10px}
.title{font-size:32px;font-weight:200;letter-spacing:.06em;color:#a67f34}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 18px;border:1px solid #a67f34;background:#a67f34;color:white;text-decoration:none;letter-spacing:.16em;text-transform:uppercase;font-size:10px;cursor:pointer}
.btn.secondary{background:transparent;color:#a67f34}
.btn.btn-busy{background:#e0a83a!important;border-color:#e0a83a!important;color:#3a2c0d!important;cursor:wait!important}
.btn.btn-success{background:#4f7f45!important;border-color:#4f7f45!important;color:#fff!important}
.status{min-height:22px;margin:16px 0 22px;font-size:13px}.error{color:#9c2f2f}.success{color:#4f7f45}
.link-row{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;margin-bottom:18px;border:1px solid rgba(166,127,52,.25);background:rgba(255,255,255,.30);font-size:12px;letter-spacing:.04em;color:#7f6430}
.link-row.visible{display:flex}
.link-row .link-label{color:#a67f34;font-weight:600;white-space:nowrap}
.link-row input{flex:1;min-width:220px;padding:9px 10px;border:1px solid rgba(166,127,52,.25);background:rgba(255,255,255,.6);color:#7f6430;font-size:12px;font-family:inherit}
.link-row .copy-btn{padding:9px 14px;border:1px solid rgba(166,127,52,.4);background:#a67f34;color:#fffaf0;text-transform:uppercase;letter-spacing:.1em;font-size:10px;cursor:pointer}
.link-row .copy-feedback{color:#4f7f45;font-weight:600}
.sheet{background:#fffdf8;border:1px solid rgba(166,127,52,.18);box-shadow:0 24px 70px rgba(127,100,48,.08);overflow:hidden}
.sheet-cover{position:relative;width:100%;height:300px;background:#e5d9bf}
.sheet-cover img{width:100%;height:100%;object-fit:cover;display:block}
.sheet-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(31,22,8,.82),rgba(31,22,8,.10) 55%)}
.sheet-cover-text{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 30px;color:#fff}
.sheet-brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#f1d27a;margin-bottom:10px}
.sheet-title{font-size:26px;font-weight:300;letter-spacing:.04em;line-height:1.2}
.sheet-address{font-size:12px;letter-spacing:.03em;color:#f1e6bd;margin-top:8px}
.sheet-body{padding:30px}
.sheet-desc{font-size:13.5px;line-height:1.7;color:#6f603f;margin-bottom:22px}
.sheet-rule{height:1px;background:linear-gradient(to right,rgba(166,127,52,.55),transparent);margin:0 0 20px}
.sheet-section-label{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#a58139;margin-bottom:14px}
.core-row{display:flex;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.core-chip{display:flex;align-items:center;gap:10px}
.core-chip .ic{width:26px;height:26px;flex:none;color:#a67f34}
.core-chip .ic svg{width:100%;height:100%}
.core-chip .cv{font-size:20px;font-weight:300;color:#a67f34;line-height:1}
.core-chip .cl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#8f7643;margin-top:2px}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;margin-bottom:22px}
.feat-item{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#5c4a20}
.feat-item .ic{width:18px;height:18px;flex:none;color:#a67f34}
.feat-item .ic svg{width:100%;height:100%}
.map-frame{width:100%;height:220px;border:1px solid rgba(166,127,52,.2);display:block;object-fit:cover;background:#e5d9bf;margin-bottom:6px}
.visit-block{border-top:2px solid rgba(166,127,52,.25);padding:30px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:20px}
.field-grid.single{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8f7643}
.field input,.field select,.field textarea{padding:10px 11px;border:1px solid rgba(166,127,52,.3);background:rgba(255,255,255,.65);color:#5c4a20;font-size:13px;font-family:inherit}
.field textarea{resize:vertical;min-height:60px}
.client-search-row{display:flex;gap:10px;margin-bottom:16px;align-items:flex-end;flex-wrap:wrap}
.client-search-row .field{flex:1;min-width:220px}
.client-hit-list{position:relative}
.client-hits{position:absolute;top:100%;left:0;right:0;z-index:5;background:#fffdf8;border:1px solid rgba(166,127,52,.3);max-height:200px;overflow-y:auto;box-shadow:0 10px 24px rgba(127,100,48,.15)}
.client-hits div{padding:9px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid rgba(166,127,52,.1)}
.client-hits div:hover{background:rgba(166,127,52,.08)}
.client-hits .none{color:#9a8a5f;cursor:default}
.client-hits .none:hover{background:none}
.consent-box{display:flex;gap:10px;align-items:flex-start;padding:16px;border:1px solid rgba(166,127,52,.25);background:rgba(255,255,255,.35);margin-bottom:20px}
.consent-box input{margin-top:3px;flex:none}
.consent-box .txt{font-size:11.5px;line-height:1.6;color:#5c4a20}
.sign-panel{margin-bottom:8px}
.sign-canvas-wrap{border:1px solid rgba(166,127,52,.35);background:#fffdf8;position:relative}
.sign-canvas-wrap canvas{width:100%;height:180px;display:block;touch-action:none;cursor:crosshair}
.sign-status{font-size:11px;color:#4f7f45;min-height:16px;margin-top:6px}
.sign-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clear-btn{padding:8px 14px;border:1px solid rgba(166,127,52,.4);background:transparent;color:#a67f34;text-transform:uppercase;letter-spacing:.1em;font-size:10px;cursor:pointer}
.submit-row{margin-top:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sheet-footer{padding:16px 32px;border-top:1px solid rgba(166,127,52,.14);display:flex;justify-content:space-between;align-items:center;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(166,127,52,.6)}
@media print{
  @page{size:A4;margin:0}
  html,body{width:210mm;min-height:297mm;background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,body::after,.header,.topbar,.actions,.status,.link-row,.submit-row,.clear-btn{display:none!important}
  .container{width:210mm;max-width:none;margin:0;padding:0}
  .sheet{border:0;box-shadow:none}
}
@media(max-width:700px){.header{flex-direction:column;gap:16px;padding:22px}.container{padding:28px 16px}.topbar{display:block}.actions{margin-top:18px}.sheet-body,.visit-block{padding:20px}.feat-grid{grid-template-columns:repeat(2,1fr)}.field-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <a class="logo" href="../index.html">IMMONOVA<small>OFF MARKET • CONSULTING</small></a>
  <div class="header-actions">
    <a href="dashboard.html">Dashboard</a>
    <a href="opportunities.html">Opportunità</a>
    <button id="logoutBtn" type="button">Logout</button>
  </div>
</header>
<main class="container">
  <div class="topbar">
    <div>
      <div class="kicker">Scheda Visita Immobile</div>
      <h1 class="title" id="pageTitle">Scheda Visita</h1>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="window.print()" type="button">Stampa / PDF</button>
      <a class="btn secondary" id="editLink" href="#">Torna alla proposta</a>
    </div>
  </div>
  <div id="linkRow" class="link-row"></div>
  <div id="status" class="status"></div>
  <section id="sheetBox"><div style="padding:42px;color:#8f7643">Caricamento...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/config.js"></script>
<script>
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var params = new URLSearchParams(window.location.search);
var opportunityId = params.get("id");
var statusBox = document.getElementById("status");
var sheetBox = document.getElementById("sheetBox");
var linkRow = document.getElementById("linkRow");
var editLink = document.getElementById("editLink");
var logoutBtn = document.getElementById("logoutBtn");
var opportunity = null;
var signaturePad = null;
var selectedInvestorId = null;

/* ---- Pittogrammi: stessi identici usati nella scheda one-sheet, per coerenza visiva. ---- */
var ICONS = {
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="M3 18v2M21 18v2"/><path d="M3 13h18"/><rect x="5" y="7" width="6" height="4" rx="1"/></svg>',
  bath:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12V6a2 2 0 0 1 2-2 2 2 0 0 1 2 2"/><path d="M3 12h18v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5v-2Z"/><path d="M7 19v2M17 19v2"/></svg>',
  pool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M2 12c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M5 8l3-4 3 4"/></svg>',
  garden:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21V9"/><path d="M12 9C7 9 5 6 5 3c5 0 7 2 7 6Z"/><path d="M12 13c5 0 7-3 7-6-5 0-7 2-7 6Z"/></svg>',
  garage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V9l9-6 9 6v12"/><path d="M3 21h18"/><path d="M7 21v-7h10v7"/></svg>',
  parking:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 16V8h3.2a2.4 2.4 0 0 1 0 4.8H9"/></svg>',
  terrace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21h18"/><path d="M5 21V10M19 21V10"/><path d="M5 10h14l-2-6H7l-2 6Z"/><path d="M9 21v-6M15 21v-6"/></svg>',
  balcony:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10h16"/><path d="M4 10v11M20 10v11"/><path d="M7 21v-5M11 21v-5M15 21v-5M17 21v-5"/><path d="M4 3v7"/></svg>',
  sea:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 18c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><circle cx="17" cy="6" r="3"/><path d="M3 13l9-8 9 8"/></svg>',
  historic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21h18"/><path d="M4 21V10M8 21V10M12 21V10M16 21V10M20 21V10"/><path d="M2 10l10-6 10 6"/></svg>',
  ac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M4.2 6.2l15.6 11.6M19.8 6.2 4.2 17.8"/><path d="M12 2l-2 2 2-.5 2 .5-2-2ZM12 22l-2-2 2 .5 2-.5-2 2Z"/></svg>',
  elevator:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="2" width="16" height="20" rx="1.4"/><path d="M10 8l2-2 2 2M10 16l2 2 2-2"/></svg>',
  fireplace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22c4-.6 6-3.2 6-6.4 0-2-1-3.4-2-4.6.2 1.4-.6 2.4-1.4 2.6.6-2.6-.6-5-3-6.6-.4 2-1.4 3-2.6 4-1.6 1.5-3 3.2-3 5.6C6 18.8 8 21.4 12 22Z"/></svg>',
  beach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 12s7-2 9 4c-5 2-9-1-9-4Z"/><path d="M12 12S5 10 3 16c5 2 9-1 9-4Z"/><path d="M12 12v10M9 22h6"/></svg>',
  solar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M3 8h18M3 12h18M9 4v12M15 4v12"/><path d="M9 20h6"/></svg>',
  charger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>',
  solarthermal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3.4"/><path d="M8 2v1.4M8 12.6V14M2 8h1.4M12.6 8H14M4 4l1 1M12 4l-1 1"/><path d="M13 14c1.8 2 1.8 4 0 6-1.8-2-1.8-4 0-6Z"/></svg>',
  battery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="18" height="10" rx="1.4"/><path d="M22 10v4"/><path d="M6 10v4M10 10v4"/></svg>',
  well:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 6 7.4 6 11a6 6 0 1 1-12 0c0-3.6 3-7 6-11Z"/></svg>',
  heating:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 4v16M12 4v16M16 4v16"/></svg>',
  habitability:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6l-8-3Z"/><path d="M9 12l2 2 4-4"/></svg>'
};

var FEATURES = [
  {col:"has_pool", icon:"pool", label:"Piscina"},
  {col:"has_sea_view", icon:"sea", label:"Vista mare"},
  {col:"has_beachfront", icon:"beach", label:"Fronte spiaggia"},
  {col:"has_garden", icon:"garden", label:"Giardino"},
  {col:"has_terrace", icon:"terrace", label:"Terrazza"},
  {col:"has_balcony", icon:"balcony", label:"Balcone"},
  {col:"has_garage", icon:"garage", label:"Garage"},
  {col:"has_parking_spot", icon:"parking", label:"Posto auto"},
  {col:"has_elevator", icon:"elevator", label:"Ascensore"},
  {col:"has_air_conditioning", icon:"ac", label:"Aria condizionata"},
  {col:"has_heating_system", icon:"heating", label:"Impianto di riscaldamento"},
  {col:"has_fireplace", icon:"fireplace", label:"Camino"},
  {col:"has_historic_center", icon:"historic", label:"Centro storico"},
  {col:"has_photovoltaic", icon:"solar", label:"Fotovoltaico"},
  {col:"has_solar_thermal", icon:"solarthermal", label:"Solare termico"},
  {col:"has_storage_battery", icon:"battery", label:"Accumulo batteria"},
  {col:"has_car_charger", icon:"charger", label:"Colonnina di ricarica"},
  {col:"has_artesian_well", icon:"well", label:"Pozzo artesiano"},
  {col:"has_habitability", icon:"habitability", label:"Abitabilità"}
];

function escapeHTML(v){
  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function clean(v){ v = (v==null?"":String(v)).trim(); return v || ""; }
function getTitle(){ return clean(opportunity && opportunity.title) || "Immobile IMMONOVA"; }
function getAddress(){
  var o = opportunity||{};
  return clean(o.formatted_address) || [o.address,o.locality,o.province].filter(Boolean).join(", ");
}
function normalizeGallery(raw){
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.filter(Boolean);
  if(typeof raw==="string"){ try{ var p=JSON.parse(raw); return Array.isArray(p)?p.filter(Boolean):[]; }catch(e){ return []; } }
  return [];
}
function getCoverImage(){
  var o = opportunity||{};
  if(clean(o.cover_image)) return clean(o.cover_image);
  var gal = normalizeGallery(o.gallery_images);
  return gal[0] || "";
}
function slugify(s){
  return String(s||"immobile").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60) || "immobile";
}
function todayISO(){
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,"0");
  var dd = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+mm+"-"+dd;
}

function renderSheet(){
  var o = opportunity;
  if(!o){ sheetBox.innerHTML = '<div style="padding:42px;color:#9c2f2f">Opportunità non trovata.</div>'; return; }
  var cover = getCoverImage();
  var addr = getAddress();
  var desc = clean(o.short_description);
  var lat = Number(o.latitude), lng = Number(o.longitude);
  var hasCoords = Number.isFinite(lat) && Number.isFinite(lng);

  var featItems = FEATURES.filter(function(f){ return o[f.col] === true; }).map(function(f){
    return '<div class="feat-item"><span class="ic">'+ICONS[f.icon]+'</span><span>'+escapeHTML(f.label)+'</span></div>';
  }).join("");

  var mapHTML = hasCoords
    ? '<img class="map-frame" id="mapImg" data-lat="'+escapeHTML(String(lat))+'" data-lng="'+escapeHTML(String(lng))+'" alt="Mappa posizione immobile">'
    : "";

  sheetBox.innerHTML =
    '<div class="sheet" id="sheetPrintable">' +
      '<div class="sheet-cover">' +
        (cover ? '<img src="'+escapeHTML(cover)+'" alt="" crossorigin="anonymous">' : '') +
        '<div class="sheet-cover-text">' +
          '<div class="sheet-brand">IMMONOVA — Off Market Consulting</div>' +
          '<div class="sheet-title">'+escapeHTML(getTitle())+'</div>' +
          (addr ? '<div class="sheet-address">'+escapeHTML(addr)+'</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="sheet-body">' +
        (desc ? '<div class="sheet-desc">'+escapeHTML(desc)+'</div><div class="sheet-rule"></div>' : '') +
        '<div class="core-row">' +
          (Number.isFinite(Number(o.bedrooms)) && o.bedrooms>0 ? '<div class="core-chip"><span class="ic">'+ICONS.bed+'</span><div><div class="cv">'+escapeHTML(String(o.bedrooms))+'</div><div class="cl">Camere</div></div></div>' : '') +
          (Number.isFinite(Number(o.bathrooms)) && o.bathrooms>0 ? '<div class="core-chip"><span class="ic">'+ICONS.bath+'</span><div><div class="cv">'+escapeHTML(String(o.bathrooms))+'</div><div class="cl">Bagni</div></div></div>' : '') +
        '</div>' +
        (featItems ? '<div class="feat-grid">'+featItems+'</div>' : '') +
        mapHTML +
      '</div>' +
      '<div class="visit-block">' +
        '<div class="sheet-section-label">Dati Cliente</div>' +
        '<div class="client-search-row">' +
          '<div class="field client-hit-list">' +
            '<label for="clientSearchInput">Cerca cliente già censito (nome, email o telefono)</label>' +
            '<input type="text" id="clientSearchInput" placeholder="Digita per cercare, oppure compila i campi qui sotto per un nuovo cliente...">' +
            '<div class="client-hits" id="clientHits" hidden></div>' +
          '</div>' +
          '<button type="button" class="btn secondary" id="clearClientBtn" style="padding:10px 14px">Nuovo cliente</button>' +
        '</div>' +
        '<div class="field-grid">' +
          '<div class="field"><label for="clientFirstName">Nome</label><input type="text" id="clientFirstName"></div>' +
          '<div class="field"><label for="clientLastName">Cognome</label><input type="text" id="clientLastName"></div>' +
          '<div class="field"><label for="clientEmail">Email</label><input type="email" id="clientEmail"></div>' +

async function loadMapImage(){
  var img = document.getElementById("mapImg");
  if(!img) return;
  var lat = img.getAttribute("data-lat"), lng = img.getAttribute("data-lng");
  try{
    var url = SUPABASE_URL+"/functions/v1/static-map-proxy?lat="+encodeURIComponent(lat)+"&lng="+encodeURIComponent(lng)+"&zoom=15&size=1200x600&scale=2";
    var res = await fetch(url,{headers:{"Authorization":"Bearer "+SUPABASE_ANON_KEY,"apikey":SUPABASE_ANON_KEY}});
    if(!res.ok){ console.warn("Mappa non caricata:",res.status); return; }
    var blob = await res.blob();
    img.src = URL.createObjectURL(blob);
  }catch(e){ console.warn("Mappa: errore fetch",e); }
}

/* Pannello firma touch/mouse: canvas ad alta densità (devicePixelRatio) con Pointer Events,
   identico a quello già in uso in offerta-form.html, per coerenza. */
function createSignaturePad(canvasId, statusId){
  var canvas = document.getElementById(canvasId);
  var statusEl = document.getElementById(statusId);
  var ctx = canvas.getContext("2d");
  var drawing = false;
  var hasStroke = false;
  var last = null;

  function resizeCanvas(){
    var ratio = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var prevData = hasStroke ? canvas.toDataURL() : null;
    canvas.width = Math.max(1, Math.round(rect.width * ratio));
    canvas.height = Math.max(1, Math.round(rect.height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#3f321c";
    if(prevData){
      var img = new Image();
      img.onload = function(){ ctx.drawImage(img, 0, 0, rect.width, rect.height); };
      img.src = prevData;
    }
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function pointerPos(e){
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener("pointerdown", function(e){
    drawing = true;
    hasStroke = true;
    last = pointerPos(e);
    canvas.setPointerCapture(e.pointerId);
    if(statusEl) statusEl.textContent = "";
  });
  canvas.addEventListener("pointermove", function(e){
    if(!drawing) return;
    var p = pointerPos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });
  function endStroke(){
    drawing = false;
    if(hasStroke && statusEl) statusEl.textContent = "Firma catturata ✓";
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointerleave", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  return {
    clear: function(){
      var rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      hasStroke = false;
      if(statusEl) statusEl.textContent = "";
    },
    isEmpty: function(){ return !hasStroke; },
    toDataURL: function(){ return hasStroke ? canvas.toDataURL("image/png") : ""; }
  };
}

/* ---- Ricerca cliente dalla tabella investors: digitando nome/email/telefono compaiono i
   risultati, cliccandone uno si autocompilano i campi e si registra il suo id (per aggiornarlo
   invece di duplicarlo al salvataggio). Se il cliente non è censito, si compilano a mano i
   campi sotto: al salvataggio viene creato come nuovo investor. ---- */
var clientSearchTimer = null;
function wireClientSearch(){
  var input = document.getElementById("clientSearchInput");
  var hitsBox = document.getElementById("clientHits");
  input.addEventListener("input", function(){
    var q = input.value.trim();
    selectedInvestorId = null;
    clearTimeout(clientSearchTimer);
    if(q.length < 2){ hitsBox.hidden = true; hitsBox.innerHTML = ""; return; }
    clientSearchTimer = setTimeout(async function(){
      try{
        var like = "%"+q.replace(/[%_]/g,"")+"%";
        var res = await client.from("investors")
          .select("id,first_name,last_name,email,phone")
          .or("first_name.ilike."+like+",last_name.ilike."+like+",email.ilike."+like+",phone.ilike."+like)
          .limit(8);
        if(res.error || !res.data || !res.data.length){
          hitsBox.innerHTML = '<div class="none">Nessun cliente censito trovato — compila i campi sotto per aggiungerlo.</div>';
          hitsBox.hidden = false;
          return;
        }
        hitsBox.innerHTML = res.data.map(function(inv){
          var name = [inv.first_name,inv.last_name].filter(Boolean).join(" ") || "(senza nome)";
          var sub = [inv.email,inv.phone].filter(Boolean).join(" · ");
          return '<div data-id="'+escapeHTML(String(inv.id))+'">'+escapeHTML(name)+(sub?' <span style="color:#9a8a5f">— '+escapeHTML(sub)+'</span>':'')+'</div>';
        }).join("");
        hitsBox.hidden = false;
        Array.prototype.forEach.call(hitsBox.querySelectorAll("div[data-id]"), function(row){
          row.addEventListener("click", function(){
            var inv = res.data.find(function(x){ return String(x.id)===row.getAttribute("data-id"); });
            if(!inv) return;
            selectedInvestorId = inv.id;
            document.getElementById("clientFirstName").value = inv.first_name||"";
            document.getElementById("clientLastName").value = inv.last_name||"";
            document.getElementById("clientEmail").value = inv.email||"";
            document.getElementById("clientPhone").value = inv.phone||"";
            input.value = [inv.first_name,inv.last_name].filter(Boolean).join(" ");
            hitsBox.hidden = true;
          });
        });
      }catch(e){ console.warn("Ricerca cliente fallita:",e); }
    }, 300);
  });
  document.addEventListener("click", function(e){
    if(!hitsBox.contains(e.target) && e.target!==input) hitsBox.hidden = true;
  });
}
function clearClientFields(){
  selectedInvestorId = null;
  document.getElementById("clientSearchInput").value = "";
  document.getElementById("clientFirstName").value = "";
  document.getElementById("clientLastName").value = "";
  document.getElementById("clientEmail").value = "";
  document.getElementById("clientPhone").value = "";
}

function setStatus(msg, cls){ statusBox.textContent = msg||""; statusBox.className = "status"+(cls?" "+cls:""); }

function waitForImagesToLoad(root, timeoutMs){
  timeoutMs = timeoutMs || 8000;
  var imgs = Array.prototype.slice.call((root||document).querySelectorAll("img"));
  return Promise.all(imgs.map(function(img){
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(function(resolve){
      var done=false;
      function finish(){ if(!done){ done=true; resolve(); } }
      img.addEventListener("load",finish,{once:true});
      img.addEventListener("error",finish,{once:true});
      setTimeout(finish,timeoutMs);
    });
  }));
}

async function generateVisitPdfBlob(){
  var mapImg = document.getElementById("mapImg");
  if(mapImg){
    var waited=0;
    while(waited<5000 && String(mapImg.src||"").indexOf("blob:")!==0 && mapImg.hasAttribute("data-lat")){
      await new Promise(function(r){ setTimeout(r,100); });
      waited+=100;
    }
  }
  var el = document.getElementById("sheetPrintable");
  if(!el) throw new Error("Scheda non trovata da esportare.");
  await waitForImagesToLoad(el, 8000);
  var canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:"#ffffff"});
  var imgData = canvas.toDataURL("image/jpeg", 0.92);
  var pdf = new window.jspdf.jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  var pageW = 210, pageH = 297;
  var ratio = canvas.height / canvas.width;
  var w = pageW, h = pageW * ratio;
  var pages = Math.ceil(h / pageH) || 1;
  if(pages <= 1){
    if(h > pageH){ h = pageH; w = pageH / ratio; }
    var x = (pageW - w) / 2;
    pdf.addImage(imgData, "JPEG", x, 0, w, h);
  }else{
    // Contenuto più lungo di una pagina A4 (scheda + dati cliente + firma): si spezza su più
    // pagine, ciascuna con lo stesso identico canvas ma traslato verticalmente.
    for(var i=0;i<pages;i++){
      if(i>0) pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, -(i*pageH), pageW, h);
    }
  }
  return pdf.output("blob");
}

function renderLinkRow(url){
  if(!url){ linkRow.className="link-row"; linkRow.innerHTML=""; return; }
  linkRow.className = "link-row visible";
  linkRow.innerHTML =
    '<span class="link-label">PDF scheda visita:</span>'+
    '<input type="text" id="shareLinkInput" readonly value="'+escapeHTML(url)+'" onclick="this.select()">'+
    '<button type="button" class="copy-btn" id="copyLinkBtn">Copia link</button>'+
    '<span class="copy-feedback" id="copyFeedback"></span>';
  document.getElementById("copyLinkBtn").addEventListener("click", async function(){
    var fb = document.getElementById("copyFeedback");
    try{ await navigator.clipboard.writeText(url); fb.textContent = "Copiato ✓"; }
    catch(e){ window.prompt("Copia manualmente il link:", url); }
    setTimeout(function(){ if(fb) fb.textContent=""; }, 2500);
  });
}

async function submitVisit(){
  var firstName = document.getElementById("clientFirstName").value.trim();
  var lastName = document.getElementById("clientLastName").value.trim();
  var email = document.getElementById("clientEmail").value.trim();
  var phone = document.getElementById("clientPhone").value.trim();
  var visitDate = document.getElementById("visitDate").value || todayISO();
  var consent = document.getElementById("privacyConsent").checked;
  var exclusivityConsent = document.getElementById("exclusivityConsent").checked;

  if(!firstName && !lastName){ setStatus("Inserisci almeno nome o cognome del cliente.","error"); return; }
  if(!consent){ setStatus("Il consenso privacy del cliente è obbligatorio.","error"); return; }
  if(!exclusivityConsent){ setStatus("L'accettazione della clausola di esclusiva post-visita è obbligatoria.","error"); return; }
  if(!signaturePad || signaturePad.isEmpty()){ setStatus("Serve la firma del cliente.","error"); return; }

  var submitBtn = document.getElementById("submitVisitBtn");
  submitBtn.disabled = true;
  submitBtn.classList.add("btn-busy");
  submitBtn.classList.remove("btn-success");
  var originalLabel = submitBtn.textContent;
  submitBtn.textContent = "Generazione in corso...";

  try{
    setStatus("Generazione PDF in corso...","");
    var pdfBlob = await generateVisitPdfBlob();
    var filename = "visita_IMMONOVA_"+slugify(getTitle())+"_"+slugify(lastName||firstName)+".pdf";
    var path = "visits/opportunity-"+(opportunityId||"na")+"/"+Date.now()+"_"+filename;
    var upload = await client.storage.from("dossier-pdfs").upload(path, pdfBlob, {contentType:"application/pdf", upsert:true});
    if(upload.error) throw upload.error;
    var pub = client.storage.from("dossier-pdfs").getPublicUrl(path);
    var pdfUrl = pub.data.publicUrl;

    var signatureDataUrl = signaturePad.toDataURL();
    var nowIso = new Date().toISOString();

    // Cliente: se selezionato dalla ricerca si aggiornano i suoi dati con quanto raccolto
    // durante la visita (senza sovrascrivere campi lasciati vuoti); se non è censito, si crea
    // una nuova riga in investors cosi' la lista clienti resta aggiornata.
    var investorId = selectedInvestorId;
    try{
      if(investorId){
        var updatePayload = {};
        if(firstName) updatePayload.first_name = firstName;
        if(lastName) updatePayload.last_name = lastName;
        if(email) updatePayload.email = email;
        if(phone) updatePayload.phone = phone;
        if(Object.keys(updatePayload).length){
          var updRes = await client.from("investors").update(updatePayload).eq("id", investorId);
          if(updRes.error) console.warn("Aggiornamento cliente esistente fallito:",updRes.error);
        }
      }else{
        var newInvestor = {
          first_name: firstName || null,
          last_name: lastName || null,
          email: email || null,
          phone: phone || null,
          is_investor: true
        };
        var insInvestorRes = await client.from("investors").insert(newInvestor).select().single();
        if(insInvestorRes.error){ console.warn("Creazione nuovo cliente fallita:",insInvestorRes.error); }
        else{ investorId = insInvestorRes.data.id; }
      }
    }catch(investorErr){ console.warn("Gestione cliente in investors fallita:",investorErr); }

    var insertRow = {
      opportunity_id: opportunityId,
      investor_id: investorId,
      client_first_name: firstName || null,
      client_last_name: lastName || null,
      client_email: email || null,
      client_phone: phone || null,
      visit_date: visitDate,
      privacy_consent: true,
      privacy_consent_at: nowIso,
      exclusivity_consent: true,
      signature_data_url: signatureDataUrl,
      pdf_url: pdfUrl
    };
    var { data: authData } = await client.auth.getUser();
    if(authData && authData.user) insertRow.created_by = authData.user.id;

    var insertRes = await client.from("property_visits").insert(insertRow).select().single();
    if(insertRes.error) throw insertRes.error;

    renderLinkRow(pdfUrl);

    // Invio automatico della scheda visita firmata al cliente, se ha lasciato un'email —
    // stesso meccanismo già in uso per i dossier (link di download, non allegato: i PDF
    // firmati possono superare il limite accettato dai server di posta dei clienti).
    var emailStatusSuffix = "";
    if(email){
      try{
        var emailResp = await fetch(String(SUPABASE_URL||"").replace(/\/+$/,"")+"/functions/v1/send-visit-email",{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY},
          body:JSON.stringify({
            to: email,
            client_name: [firstName,lastName].filter(Boolean).join(" "),
            opportunity_title: getTitle(),
            pdf_url: pdfUrl,
            visit_date: visitDate,
            language: (opportunity && opportunity.preferred_language) || "it"
          })
        });
        var emailData = await emailResp.json();
        if(!emailResp.ok || !emailData || !emailData.success){
          console.warn("Invio email cliente fallito:", emailData);
          emailStatusSuffix = " (email al cliente non inviata: "+((emailData&&emailData.error)||"errore sconosciuto")+")";
        }else{
          emailStatusSuffix = " Email inviata a "+email+".";
        }
      }catch(emailErr){
        console.warn("Invio email cliente fallito:", emailErr);
        emailStatusSuffix = " (email al cliente non inviata: "+(emailErr.message||emailErr)+")";
      }
    }else{
      emailStatusSuffix = " Nessuna email cliente inserita: nessun invio automatico effettuato.";
    }

    setStatus("Scheda visita salvata correttamente."+emailStatusSuffix, emailStatusSuffix.indexOf("non inviata")>-1 ? "error" : "success");
    submitBtn.classList.remove("btn-busy");
    submitBtn.classList.add("btn-success");
    setTimeout(function(){ submitBtn.classList.remove("btn-success"); }, 3000);
  }catch(e){
    console.error(e);
    setStatus("Errore nel salvataggio della visita: "+(e.message||e),"error");
    submitBtn.classList.remove("btn-busy");
  }
  submitBtn.disabled = false;
  submitBtn.textContent = originalLabel;
}

if(logoutBtn) logoutBtn.addEventListener("click", async function(){ await client.auth.signOut(); window.location.href="login.html"; });

async function checkAuth(){
  var { data:{ session } } = await client.auth.getSession();
  if(!session){ window.location.href = "login.html"; return false; }
  return true;
}

async function init(){
  var ok = await checkAuth();
  if(!ok) return;
  if(!opportunityId){ sheetBox.innerHTML = '<div style="padding:42px;color:#9c2f2f">ID opportunità mancante nell\'URL.</div>'; return; }
  editLink.href = "opportunityedit.html?id="+encodeURIComponent(opportunityId);
  setStatus("Caricamento...","");
  var res = await client.from("opportunities").select("*").eq("id", opportunityId).single();
  if(res.error || !res.data){
    setStatus("Errore nel caricamento dell'opportunità: "+(res.error?res.error.message:"non trovata"),"error");
    sheetBox.innerHTML = '<div style="padding:42px;color:#9c2f2f">Opportunità non trovata.</div>';
    return;
  }
  opportunity = res.data;
  pageTitleUpdate();
  setStatus("","");
  renderSheet();
}
function pageTitleUpdate(){
  document.getElementById("pageTitle").textContent = "Scheda Visita — "+getTitle();
  document.title = getTitle()+" — Scheda Visita IMMONOVA";
}

init();
