<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impostazioni Sito | IMMONOVA Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  color:#7f6430;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.30;
}
.header{
  padding:30px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(166,127,52,.12);
  background:rgba(244,236,223,.72);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:10;
}
.logo{ text-decoration:none; color:#a67f34; }
.logo-main{ font-size:24px; font-weight:600; letter-spacing:.35em; }
.logo-sub{ margin-top:6px; font-size:9px; font-weight:700; letter-spacing:.18em; color:#a58139; }
.header-actions{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.header-actions a,
.logout{
  padding:10px 20px;
  border:1px solid rgba(166,127,52,.25);
  background:rgba(255,255,255,.25);
  cursor:pointer;
  color:#a67f34;
  text-decoration:none;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.header-actions a:hover, .logout:hover{ background:#a67f34; color:#fff; }
.container{ max-width:760px; margin:auto; padding:40px; }
.kicker{ font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:#9a793c; margin-bottom:12px; }
.title{ font-size:42px; font-weight:200; letter-spacing:.05em; color:#a67f34; margin-bottom:18px; }
.subtitle{ font-size:15px; line-height:1.8; color:#8f7643; max-width:640px; margin-bottom:32px; }
.status{ margin-bottom:22px; min-height:20px; font-size:13px; }
.success{ color:#4f7f45; }
.error{ color:#9c2f2f; }
.panel{
  background:rgba(255,255,255,.20);
  backdrop-filter:blur(8px);
  border:1px solid rgba(166,127,52,.15);
  box-shadow:0 24px 70px rgba(127,100,48,.07);
  padding:34px;
}
.field{ margin-bottom:22px; }
.field label{
  display:block;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#8f7643;
  margin-bottom:9px;
}
.field .icon-row{ display:flex; align-items:center; gap:12px; }
.field .icon-row svg{ width:22px; height:22px; flex:none; color:#a67f34; }
.field input{
  flex:1;
  padding:14px 16px;
  border:1px solid rgba(166,127,52,.22);
  background:rgba(255,255,255,.35);
  color:#7f6430;
  outline:none;
  font-size:14px;
  font-family:inherit;
}
.field .hint{ margin-top:7px; font-size:11px; color:#8f7643; }
.actions{ margin-top:8px; }
.btn{
  padding:14px 24px;
  border:1px solid #a67f34;
  background:#a67f34;
  color:white;
  text-decoration:none;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:11px;
  cursor:pointer;
  font-family:inherit;
}
.btn:disabled{ opacity:.5; cursor:not-allowed; }
@media(max-width:700px){
  .header{ flex-direction:column; gap:18px; }
  .container{ padding:28px 22px; }
  .panel{ padding:24px; }
}
</style>
</head>

<body>

<header class="header">
  <a href="../index.html" class="logo">
    <div class="logo-main">IMMONOVA</div>
    <div class="logo-sub">OFF MARKET • CONSULTING</div>
  </a>
  <div class="header-actions">
    <a href="dashboard.html">Dashboard</a>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</header>

<div class="container">

  <div class="kicker">Area Admin</div>
  <h1 class="title">Impostazioni Sito</h1>
  <p class="subtitle">
    Gestisci qui i link ai profili social mostrati sul sito pubblico. Lascia un campo vuoto per nascondere quell'icona invece di mostrarla vuota.
  </p>

  <div id="status" class="status"></div>

  <div class="panel">
    <form id="settingsForm">

      <div class="field">
        <label for="instagram_url">Instagram</label>
        <div class="icon-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>
          <input type="url" id="instagram_url" placeholder="https://instagram.com/tuoprofilo">
        </div>
      </div>

      <div class="field">
        <label for="facebook_url">Facebook</label>
        <div class="icon-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M15 8h2V4h-2c-2.2 0-4 1.8-4 4v2H9v4h2v6h4v-6h2.5l.5-4H15V8c0-.3.2-1 1-1z"/></svg>
          <input type="url" id="facebook_url" placeholder="https://facebook.com/tuapagina">
        </div>
      </div>

      <div class="field">
        <label for="linkedin_url">LinkedIn</label>
        <div class="icon-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7.5" y1="10" x2="7.5" y2="17"/><circle cx="7.5" cy="6.8" r="0.9" fill="currentColor" stroke="none"/><path d="M11.5 17v-4.5c0-1.4 1-2.5 2.4-2.5s2.1 1 2.1 2.5V17"/><line x1="11.5" y1="10" x2="11.5" y2="17"/></svg>
          <input type="url" id="linkedin_url" placeholder="https://linkedin.com/company/tuaazienda">
        </div>
        <div class="hint">Questi link compaiono nell'header della pagina pubblica "Opportunities".</div>
      </div>

      <div class="actions">
        <button type="submit" class="btn" id="saveBtn">Salva Impostazioni</button>
      </div>

    </form>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const statusBox = document.getElementById("status");
const form = document.getElementById("settingsForm");
const saveBtn = document.getElementById("saveBtn");

function setStatus(message, type){
  statusBox.className = "status " + (type || "");
  statusBox.textContent = message || "";
}

async function checkAuth(){
  const { data:{ session }, error } = await client.auth.getSession();
  if(error || !session){
    window.location.href = "login.html";
    return false;
  }
  return true;
}

/* Solo gli admin possono vedere/modificare questa pagina -- gli altri ruoli vengono
   rimandati alla dashboard, coerente con le altre pagine riservate del pannello. */
async function checkAdminRole(){
  const { data:{ session } } = await client.auth.getSession();
  const result = await client.from("profiles").select("role").eq("id", session.user.id).single();
  if(result.error || !result.data || result.data.role !== "admin"){
    window.location.href = "dashboard.html";
    return false;
  }
  return true;
}

async function loadSettings(){
  setStatus("Caricamento impostazioni...", "");

  const result = await client.from("site_settings").select("*").eq("id", 1).maybeSingle();

  if(result.error){
    /* Se la tabella non esiste ancora (migrazione SQL non eseguita), non blocca la pagina:
       mostra i campi vuoti e lo dice chiaramente, invece di un errore generico. */
    var looksLikeMissingTable = /relation.*does not exist/i.test(result.error.message || "");
    if(looksLikeMissingTable){
      setStatus("Tabella site_settings non trovata: esegui la migrazione SQL prima di salvare.", "error");
    }else{
      setStatus("Errore caricamento: " + result.error.message, "error");
    }
    return;
  }

  if(result.data){
    document.getElementById("instagram_url").value = result.data.instagram_url || "";
    document.getElementById("facebook_url").value = result.data.facebook_url || "";
    document.getElementById("linkedin_url").value = result.data.linkedin_url || "";
  }

  setStatus("", "");
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  saveBtn.disabled = true;
  saveBtn.textContent = "Salvataggio...";
  setStatus("Salvataggio in corso...", "");

  const payload = {
    id: 1,
    instagram_url: document.getElementById("instagram_url").value.trim() || null,
    facebook_url: document.getElementById("facebook_url").value.trim() || null,
    linkedin_url: document.getElementById("linkedin_url").value.trim() || null,
    updated_at: new Date().toISOString()
  };

  const { error } = await client.from("site_settings").upsert(payload).eq("id", 1);

  saveBtn.disabled = false;
  saveBtn.textContent = "Salva Impostazioni";

  if(error){
    setStatus("Errore salvataggio: " + error.message, "error");
    return;
  }

  setStatus("Impostazioni salvate correttamente.", "success");
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await client.auth.signOut();
  window.location.href = "../index.html";
});

(async function init(){
  if(await checkAuth()){
    if(await checkAdminRole()){
      await loadSettings();
    }
  }
})();
</script>

</body>
</html>
