<html lang="it">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  background:#f4ecdf;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
  color:#7f6430;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.72) 0%,rgba(255,255,255,.34) 38%,rgba(244,236,223,.06) 72%),
    #f4ecdf;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(60deg,transparent 0 86px,rgba(188,149,78,.23) 87px,transparent 90px),
    repeating-linear-gradient(-60deg,transparent 0 86px,rgba(188,149,78,.22) 87px,transparent 90px),
    repeating-linear-gradient(0deg,transparent 0 148px,rgba(188,149,78,.13) 149px,transparent 152px);
  background-size:230px 199px;
  opacity:.30;
}
.header{
  padding:34px 52px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(166,127,52,.10);
  background:rgba(244,236,223,.62);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  font-size:24px;
  font-weight:300;
  letter-spacing:.35em;
  color:#a67f34;
  text-decoration:none;
}
.nav{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.nav a{text-decoration:none;color:#a67f34;font-size:11px;letter-spacing:.20em;text-transform:uppercase}

.language-select{position:relative}
.language-button{
  border:1px solid rgba(166,127,52,.28);
  background:rgba(255,255,255,.20);
  color:#a67f34;
  padding:9px 12px;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  cursor:pointer;
  font-family:inherit;
}
.language-menu{
  position:absolute;
  right:0;
  top:calc(100% + 10px);
  min-width:150px;
  border:1px solid rgba(166,127,52,.24);
  background:rgba(244,236,223,.96);
  backdrop-filter:blur(14px);
  box-shadow:0 22px 60px rgba(127,100,48,.12);
  display:none;
  z-index:30;
}
.language-menu.open{display:block}
.language-menu button{
  width:100%;
  border:0;
  border-bottom:1px solid rgba(166,127,52,.12);
  background:transparent;
  color:#a67f34;
  padding:12px 14px;
  text-align:left;
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
  cursor:pointer;
  font-family:inherit;
}
.language-menu button:last-child{border-bottom:0}

.container{max-width:720px;margin:0 auto;padding:64px 24px 100px}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#9a793c;margin-bottom:16px;text-align:center}
.title{font-size:clamp(34px,5vw,52px);font-weight:200;letter-spacing:.06em;color:#a67f34;text-transform:uppercase;margin-bottom:18px;text-align:center}
.subtitle{font-size:14px;line-height:1.85;color:#8f7643;text-align:center;margin-bottom:44px}

.form-wrapper{
  background:rgba(255,255,255,.24);
  border:1px solid rgba(166,127,52,.18);
  box-shadow:0 24px 70px rgba(127,100,48,.08);
  padding:40px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field.full{grid-column:1/-1}
label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8f7643}
input,textarea{
  width:100%;
  padding:14px 16px;
  border:1px solid rgba(166,127,52,.28);
  background:rgba(255,255,255,.55);
  color:#5c4a20;
  font-size:14px;
  font-family:inherit;
  outline:none;
}
textarea{min-height:150px;resize:vertical;line-height:1.6}

.submit-btn{
  width:100%;
  margin-top:8px;
  padding:16px;
  border:1px solid rgba(166,127,52,.42);
  background:#a67f34;
  color:#fff;
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:.2em;
  cursor:pointer;
  font-family:inherit;
}
.submit-btn:hover{background:#8f6c2c}
.submit-btn:disabled{opacity:.55;cursor:not-allowed}

.status{margin-top:18px;min-height:20px;font-size:13px;line-height:1.7;text-align:center}
.success{color:#4f7f45}
.error{color:#9c2f2f}

body[dir="rtl"] .grid,
body[dir="rtl"] .header{direction:rtl}

@media(max-width:700px){
  .header{padding:26px 22px;flex-direction:column;gap:16px}
  .container{padding:44px 20px 80px}
  .form-wrapper{padding:26px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">IMMONOVA</a>
  <nav class="nav">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="opportunities.html" data-i18n="nav_opportunities">Opportunities</a>
    <a href="success-stories.html" data-i18n="nav_success_stories">Success Stories</a>
    <a href="events.html" data-i18n="nav_events">Events</a>
    <a href="join-us.html" data-i18n="nav_join_us">Lavora con Noi</a>
    <div class="language-select">
      <button type="button" class="language-button" id="languageButton">IT</button>
      <div class="language-menu" id="languageMenu">
        <button type="button" data-lang="it">Italiano</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="fr">Français</button>
        <button type="button" data-lang="de">Deutsch</button>
        <button type="button" data-lang="es">Español</button>
        <button type="button" data-lang="ar">العربية</button>
      </div>
    </div>
  </nav>
</header>

<div class="container">
  <div class="kicker" data-i18n="kicker">Contattaci</div>
  <h1 class="title" data-i18n="title">Contact</h1>
  <p class="subtitle" data-i18n="subtitle">Hai una richiesta specifica? Scrivici: un nostro consulente ti risponderà personalmente entro 24 ore.</p>

  <form id="contactForm" class="form-wrapper">
    <div class="grid">
      <div class="field"><label data-i18n="label_first_name">Nome</label><input type="text" id="firstName" required></div>
      <div class="field"><label data-i18n="label_last_name">Cognome</label><input type="text" id="lastName" required></div>
    </div>
    <div class="field full"><label data-i18n="label_email">Email</label><input type="email" id="email" required></div>
    <div class="field full"><label data-i18n="label_phone">Telefono (facoltativo)</label><input type="tel" id="phone"></div>
    <div class="field full"><label data-i18n="label_message">Messaggio</label><textarea id="message" required></textarea></div>
    <button type="submit" class="submit-btn" id="submitBtn" data-i18n="btn_submit">Invia richiesta</button>
    <div id="status" class="status"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var form = document.getElementById("contactForm");
var statusBox = document.getElementById("status");
var submitBtn = document.getElementById("submitBtn");

var UI = {
  it:{ code:"IT", dir:"ltr", title_tag:"Contact | IMMONOVA",
    nav_home:"Home", nav_opportunities:"Opportunities", nav_success_stories:"Success Stories", nav_events:"Eventi", nav_join_us:"Lavora con Noi",
    kicker:"Contattaci", title:"Contact",
    subtitle:"Hai una richiesta specifica? Scrivici: un nostro consulente ti risponderà personalmente entro 24 ore.",
    label_first_name:"Nome", label_last_name:"Cognome", label_email:"Email", label_phone:"Telefono (facoltativo)", label_message:"Messaggio",
    btn_submit:"Invia richiesta", btn_sending:"Invio in corso...",
    msg_required:"Compila nome, cognome, email e messaggio.",
    msg_success:"Richiesta inviata. Controlla la tua email: ti abbiamo mandato una conferma.",
    msg_error:"Errore durante l'invio della richiesta." },
  en:{ code:"EN", dir:"ltr", title_tag:"Contact | IMMONOVA",
    nav_home:"Home", nav_opportunities:"Opportunities", nav_success_stories:"Success Stories", nav_events:"Events", nav_join_us:"Join Us",
    kicker:"Get in touch", title:"Contact",
    subtitle:"Have a specific request? Write to us: one of our advisors will personally respond within 24 hours.",
    label_first_name:"First name", label_last_name:"Last name", label_email:"Email", label_phone:"Phone (optional)", label_message:"Message",
    btn_submit:"Send request", btn_sending:"Sending...",
    msg_required:"Please fill in first name, last name, email and message.",
    msg_success:"Request sent. Check your email: we've sent you a confirmation.",
    msg_error:"Error sending the request." },
  fr:{ code:"FR", dir:"ltr", title_tag:"Contact | IMMONOVA",
    nav_home:"Accueil", nav_opportunities:"Opportunities", nav_success_stories:"Success Stories", nav_events:"Événements", nav_join_us:"Travailler avec nous",
    kicker:"Contactez-nous", title:"Contact",
    subtitle:"Une demande spécifique ? Écrivez-nous : un de nos conseillers vous répondra personnellement sous 24 heures.",
    label_first_name:"Prénom", label_last_name:"Nom", label_email:"Email", label_phone:"Téléphone (facultatif)", label_message:"Message",
    btn_submit:"Envoyer la demande", btn_sending:"Envoi en cours...",
    msg_required:"Veuillez remplir prénom, nom, email et message.",
    msg_success:"Demande envoyée. Vérifiez votre email : nous vous avons envoyé une confirmation.",
    msg_error:"Erreur lors de l'envoi de la demande." },
  de:{ code:"DE", dir:"ltr", title_tag:"Contact | IMMONOVA",
    nav_home:"Home", nav_opportunities:"Opportunities", nav_success_stories:"Success Stories", nav_events:"Events", nav_join_us:"Mit uns arbeiten",
    kicker:"Kontaktieren Sie uns", title:"Contact",
    subtitle:"Haben Sie ein konkretes Anliegen? Schreiben Sie uns: ein Berater antwortet Ihnen persönlich innerhalb von 24 Stunden.",
    label_first_name:"Vorname", label_last_name:"Nachname", label_email:"Email", label_phone:"Telefon (optional)", label_message:"Nachricht",
    btn_submit:"Anfrage senden", btn_sending:"Wird gesendet...",
    msg_required:"Bitte Vorname, Nachname, Email und Nachricht ausfüllen.",
    msg_success:"Anfrage gesendet. Prüfen Sie Ihre Email: wir haben Ihnen eine Bestätigung gesendet.",
    msg_error:"Fehler beim Senden der Anfrage." },
  es:{ code:"ES", dir:"ltr", title_tag:"Contact | IMMONOVA",
    nav_home:"Inicio", nav_opportunities:"Opportunities", nav_success_stories:"Success Stories", nav_events:"Eventos", nav_join_us:"Trabaja con nosotros",
    kicker:"Contáctanos", title:"Contact",
    subtitle:"¿Tienes una solicitud específica? Escríbenos: uno de nuestros asesores te responderá personalmente en 24 horas.",
    label_first_name:"Nombre", label_last_name:"Apellido", label_email:"Email", label_phone:"Teléfono (opcional)", label_message:"Mensaje",
    btn_submit:"Enviar solicitud", btn_sending:"Enviando...",
    msg_required:"Complete nombre, apellido, email y mensaje.",
    msg_success:"Solicitud enviada. Revise su email: le hemos enviado una confirmación.",
    msg_error:"Error al enviar la solicitud." },
  ar:{ code:"AR", dir:"rtl", title_tag:"Contact | IMMONOVA",
    nav_home:"الرئيسية", nav_opportunities:"الفرص", nav_success_stories:"قصص النجاح", nav_events:"الفعاليات", nav_join_us:"اعمل معنا",
    kicker:"تواصل معنا", title:"اتصل بنا",
    subtitle:"هل لديك طلب محدد؟ راسلنا: سيقوم أحد مستشارينا بالرد عليك شخصياً خلال 24 ساعة.",
    label_first_name:"الاسم", label_last_name:"اللقب", label_email:"البريد الإلكتروني", label_phone:"الهاتف (اختياري)", label_message:"الرسالة",
    btn_submit:"إرسال الطلب", btn_sending:"جارٍ الإرسال...",
    msg_required:"يرجى إدخال الاسم واللقب والبريد الإلكتروني والرسالة.",
    msg_success:"تم إرسال الطلب. تحقق من بريدك الإلكتروني: لقد أرسلنا لك تأكيداً.",
    msg_error:"خطأ أثناء إرسال الطلب." }
};

var currentLanguage = "it";

function dict(key){ return (UI[currentLanguage] && UI[currentLanguage][key]) || UI.it[key] || key; }

function applyLanguage(lang){
  currentLanguage = UI[lang] ? lang : "it";
  try{ sessionStorage.setItem("immonova_public_language", currentLanguage); }catch(e){}

  document.documentElement.lang = currentLanguage;
  document.body.setAttribute("dir", UI[currentLanguage].dir);
  document.title = UI[currentLanguage].title_tag;

  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var key = el.getAttribute("data-i18n");
    if(dict(key)) el.textContent = dict(key);
  });

  document.getElementById("languageButton").textContent = UI[currentLanguage].code;
  document.querySelectorAll("[data-lang]").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-lang") === currentLanguage);
  });
}

function setStatus(msg, type){
  statusBox.textContent = msg || "";
  statusBox.className = "status " + (type || "");
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  var firstName = document.getElementById("firstName").value.trim();
  var lastName = document.getElementById("lastName").value.trim();
  var email = document.getElementById("email").value.trim();
  var phone = document.getElementById("phone").value.trim();
  var message = document.getElementById("message").value.trim();

  if(!firstName || !lastName || !email || !message){
    setStatus(dict("msg_required"), "error");
    return;
  }

  submitBtn.disabled = true;
  setStatus(dict("btn_sending"), "");

  var fullName = firstName + " " + lastName;

  try{
    var insertRes = await client.from("immonova_contact_requests").insert({
      full_name: fullName,
      email: email,
      phone: phone || null,
      message: message,
      language: currentLanguage
    });
    if(insertRes.error) console.warn("Richiesta non salvata (non bloccante):", insertRes.error.message);

    var fnRes = await fetch(String(SUPABASE_URL||"").replace(/\/+$/,"") + "/functions/v1/immonova-contact-form", {
      method:"POST",
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ full_name: fullName, email: email, phone: phone, message: message, language: currentLanguage })
    });

    var data = await fnRes.json();
    if(!fnRes.ok || !data.ok) throw new Error(data.error || dict("msg_error"));

    setStatus(dict("msg_success"), "success");
    form.reset();
  }catch(error){
    setStatus(error.message || dict("msg_error"), "error");
  }

  submitBtn.disabled = false;
});

document.getElementById("languageButton").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("languageMenu").classList.toggle("open");
});
document.querySelectorAll("[data-lang]").forEach(function(btn){
  btn.addEventListener("click", function(){
    applyLanguage(btn.getAttribute("data-lang"));
    document.getElementById("languageMenu").classList.remove("open");
  });
});
document.addEventListener("click", function(){
  document.getElementById("languageMenu").classList.remove("open");
});

(function initLanguage(){
  var params = new URLSearchParams(window.location.search);
  var langParam = params.get("lang");
  var saved = null;
  try{ saved = sessionStorage.getItem("immonova_public_language"); }catch(e){}
  var browser = (navigator.language || "it").slice(0,2).toLowerCase();
  applyLanguage(langParam || saved || (UI[browser] ? browser : "it"));
})();
</script>

</body>
</html>
