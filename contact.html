var currentLanguage = "it";

function dict(key){ return (UI[currentLanguage] && UI[currentLanguage][key]) || UI.it[key] || key; }

function applyLanguage(lang){
  currentLanguage = UI[lang] ? lang : "it";
  try{ sessionStorage.setItem("immonova_public_language", currentLanguage); }catch(e){}

  document.documentElement.lang = currentLanguage;
  document.body.setAttribute("dir", UI[currentLanguage].dir);
  document.title = UI[currentLanguage].title_tag;

  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var key = el.getAttribute("data-i18n");
    if(dict(key)) el.textContent = dict(key);
  });

  document.getElementById("languageButton").textContent = UI[currentLanguage].code;
  document.querySelectorAll("[data-lang]").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-lang") === currentLanguage);
  });
}

function setStatus(msg, type){
  statusBox.textContent = msg || "";
  statusBox.className = "status " + (type || "");
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  var topic = document.getElementById("topic").value;
  var firstName = document.getElementById("firstName").value.trim();
  var lastName = document.getElementById("lastName").value.trim();
  var email = document.getElementById("email").value.trim();
  var phone = document.getElementById("phone").value.trim();
  var message = document.getElementById("message").value.trim();

  if(!firstName || !lastName || !email || !message){
    setStatus(dict("msg_required"), "error");
    return;
  }

  submitBtn.disabled = true;
  setStatus(dict("btn_sending"), "");

  var fullName = firstName + " " + lastName;

  /* Per "Richiesta" e "Valutazione" i campi aggiuntivi (zona, tipo investimento, categorie,
     budget, dimensioni) vengono aggiunti in coda al messaggio con etichette chiare, così
     arrivano leggibili nell'email ad amministrazione senza dover cambiare lo schema della
     tabella per ogni singolo campo. */
  var fullMessage = message;
  if(topic === "richiesta" || topic === "valutazione"){
    var area = document.getElementById("area").value.trim();
    var investmentType = document.getElementById("investmentType").value.trim();
    var categories = Array.prototype.slice.call(document.querySelectorAll("#categoryChecks input[type=checkbox]:checked")).map(function(c){ return c.value; });
    var amenities = Array.prototype.slice.call(document.querySelectorAll("#amenityChecks input[type=checkbox]:checked")).map(function(c){ return c.value; });
    var budgetMin = document.getElementById("budgetMin").value.trim();
    var budgetMax = document.getElementById("budgetMax").value.trim();
    var size = document.getElementById("size").value.trim();
    var bedroomsMin = document.getElementById("bedroomsMin").value.trim();
    var bedroomsMax = document.getElementById("bedroomsMax").value.trim();
    var bathroomsMin = document.getElementById("bathroomsMin").value.trim();
    var bathroomsMax = document.getElementById("bathroomsMax").value.trim();

    var extraLines = [];
    if(area) extraLines.push("Zona di interesse: " + area);
    if(investmentType) extraLines.push("Tipo di investimento: " + investmentType);
    if(categories.length) extraLines.push("Categorie: " + categories.join(", "));
    if(budgetMin) extraLines.push("Budget minimo: €" + budgetMin);
    if(budgetMax) extraLines.push("Budget massimo: €" + budgetMax);
    if(size) extraLines.push("Dimensioni desiderate: " + size + " mq");
    if(bedroomsMin || bedroomsMax) extraLines.push("Camere: da " + (bedroomsMin || "-") + " a " + (bedroomsMax || "-"));
    if(bathroomsMin || bathroomsMax) extraLines.push("Bagni: da " + (bathroomsMin || "-") + " a " + (bathroomsMax || "-"));
    if(amenities.length) extraLines.push("Caratteristiche desiderate: " + amenities.join(", "));

    if(extraLines.length){
      fullMessage = message + "\n\n---\n" + extraLines.join("\n");
    }
  }

  try{
    var insertRes = await client.from("immonova_contact_requests").insert({
      full_name: fullName,
      email: email,
      phone: phone || null,
      message: fullMessage,
      language: currentLanguage,
      topic: topic
    });
    if(insertRes.error) console.warn("Richiesta non salvata (non bloccante):", insertRes.error.message);

    var fnRes = await fetch(String(SUPABASE_URL||"").replace(/\/+$/,"") + "/functions/v1/immonova-contact-form", {
      method:"POST",
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ full_name: fullName, email: email, phone: phone, message: fullMessage, language: currentLanguage, topic: topic })
    });

    var data = await fnRes.json();
    if(!fnRes.ok || !data.ok) throw new Error(data.error || dict("msg_error"));

    setStatus(dict("msg_success"), "success");
    form.reset();
  }catch(error){
    setStatus(error.message || dict("msg_error"), "error");
  }

  submitBtn.disabled = false;
});

document.getElementById("languageButton").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("languageMenu").classList.toggle("open");
});
document.querySelectorAll("[data-lang]").forEach(function(btn){
  btn.addEventListener("click", function(){
    applyLanguage(btn.getAttribute("data-lang"));
    document.getElementById("languageMenu").classList.remove("open");
  });
});
document.addEventListener("click", function(){
  document.getElementById("languageMenu").classList.remove("open");
});

function updateExtraFieldsVisibility(){
  var topic = document.getElementById("topic").value;
  var extra = document.getElementById("extraFields");
  extra.style.display = (topic === "richiesta" || topic === "valutazione") ? "block" : "none";
}
document.getElementById("topic").addEventListener("change", updateExtraFieldsVisibility);
updateExtraFieldsVisibility();

(function initLanguage(){
  var params = new URLSearchParams(window.location.search);
  var langParam = params.get("lang");
  var saved = null;
  try{ saved = sessionStorage.getItem("immonova_public_language"); }catch(e){}
  var browser = (navigator.language || "it").slice(0,2).toLowerCase();
  applyLanguage(langParam || saved || (UI[browser] ? browser : "it"));
})();
</script>

</body>
</html>
